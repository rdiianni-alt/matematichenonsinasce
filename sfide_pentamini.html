<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sfide con i pentamini · Matematiche non si nasce</title>
<style>
  :root{--text:#2c2c2a;--text-secondary:#5f5e5a;--line:#d6d6d2;--accent:#e10600;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--text);
    font-family:"Lato","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:6px 10px 8px}
  header{display:flex;justify-content:center;flex:0 0 auto}
  .logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
  .logo img{width:60px;height:60px;object-fit:contain;border-radius:50%}
  .logo span{font-size:14px;color:var(--text-secondary,#5f5e5a)}
  #bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 14px;margin:6px 0 4px;flex:0 0 auto}
  .grp{display:flex;align-items:center;gap:6px}
  button,select{font:inherit;font-size:15px;color:var(--text);background:#fff;border:1px solid #c9c9c4;border-radius:8px;
    padding:6px 11px;cursor:pointer;min-height:36px}
  button:active{background:#f2f2ef}
  button.primary{border-color:var(--accent);color:var(--accent);font-weight:700}
  select{padding:6px 8px;font-weight:700}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bdbdb8;cursor:pointer;padding:0;min-height:0}
  .sw.on{box-shadow:0 0 0 3px var(--text)}
  .sw.multi{background:conic-gradient(#e53935 0 60deg,#fbc02d 0 120deg,#43a047 0 180deg,#1e88e5 0 240deg,#8e24aa 0 300deg,#fb8c00 0)}
  #info{display:flex;justify-content:center;align-items:center;gap:12px;flex:0 0 auto;min-height:48px;margin-bottom:4px}
  #title{font-weight:700;font-size:20px}
  #badge{width:44px;height:44px;border-radius:9px;color:#fff;font-weight:800;font-size:27px;display:flex;align-items:center;justify-content:center}
  #pent{font-weight:800;font-size:20px;line-height:1.05}
  #note{font-size:15px;color:var(--text)}
  #need svg{display:block}
  #dots{display:flex;gap:4px;margin-left:2px}
  #dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid;display:block}
  #main{flex:1 1 auto;min-height:0;display:flex;gap:12px}
  #boardWrap{flex:1 1 auto;min-width:0;min-height:0;position:relative;touch-action:none}
  #board{position:absolute;inset:0;width:100%;height:100%}
  #side{flex:0 0 auto;width:min(36vw,440px);display:flex;flex-direction:column;gap:6px;min-height:0}
  #tray{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:6px;touch-action:none}
  .slot{position:relative;border:1px solid #e4e4e0;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:0;overflow:hidden}
  .slot.sel{border:2px solid var(--text);background:#f7f7f4}
  .slot.used{cursor:default}
  .slot .lt{position:absolute;left:6px;top:3px;font-size:12px;font-weight:700;color:#9a9a95}
  .slot svg{display:block}
  #tools{display:flex;gap:6px;justify-content:center;flex:0 0 auto}
  #msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;border:2px solid var(--text);border-radius:10px;
    padding:8px 16px;font-weight:700;font-size:18px;display:none;pointer-events:none;white-space:nowrap}
  #ghost{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:10}
  @media (max-aspect-ratio:1/1){
    #main{flex-direction:column}
    #side{width:auto;height:31%}
    #tray{grid-template-columns:repeat(6,1fr)}
  }
  @media (max-height:640px){
    .logo img{width:40px;height:40px}.logo{gap:2px}.logo span{font-size:12px}
    #info{min-height:40px}#badge{width:36px;height:36px;font-size:22px}#title,#pent{font-size:17px}
    button,select{min-height:32px;padding:4px 9px;font-size:14px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="logo" href="https://matematichenonsinasce.com/" target="_blank" rel="noopener">

  </header>

    <div class="grp" id="colors"></div>
    <div class="grp">
      <button id="reset">Ricomincia</button>
      <button id="solve">Soluzione</button>
    </div>
  </div>

  <div id="info">
    <div id="title"></div>
    <div id="badge"></div>
    <div><div id="pent">pentamini</div><div id="note"></div></div>
    <div id="need"></div>
    <div id="dots"></div>
  </div>

  <div id="main">
    <div id="boardWrap"><svg id="board"></svg><div id="msg"></div></div>
    <div id="side">
      <div id="tray"></div>
      <div id="tools">
        <button id="rot">↻ Ruota</button>
        <button id="flip">⇋ Capovolgi</button>
        <button id="back">Rimetti</button>
      </div>
    </div>
  </div>
</div>
<svg id="ghost"></svg>

let geo = null;       // board geometry

function pieceColor(L){return S.color==='multi'?MULTI[L]:S.color;}
function cur(){return SFIDE[S.i];}
function shapeSet(){const m=new Map();cur().c.forEach(([x,y,g])=>m.set(key(x,y),g));return m;}
function occupied(){const m=new Map();S.placed.forEach((p,pi)=>p.cells.forEach(([x,y])=>m.set(key(x,y),pi)));return m;}
function usedLetters(){return new Set(S.placed.map(p=>p.L));}

// ---------------------------------------------------------------- svg drawing
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function shade(hex,f){if(hex==='multi')return '#444';const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return `rgb(${r},${g},${b})`;}

// draws a set of cells (absolute grid coords) at origin ox,oy with cell s
function drawCells(g, cells, ox, oy, s, fill, opt={}){
  const set=new Set(cells.map(p=>key(p[0],p[1])));
  cells.forEach(([x,y])=>el('rect',{x:ox+x*s,y:oy+y*s,width:s,height:s,fill,stroke:opt.thin||'none','stroke-width':opt.thinW||1},g));
  const d=[];
  cells.forEach(([x,y])=>{
    const X=ox+x*s,Y=oy+y*s;
    if(!set.has(key(x,y-1)))d.push(`M${X},${Y}h${s}`);
    if(!set.has(key(x,y+1)))d.push(`M${X},${Y+s}h${s}`);
    if(!set.has(key(x-1,y)))d.push(`M${X},${Y}v${s}`);
    if(!set.has(key(x+1,y)))d.push(`M${X+s},${Y}v${s}`);
  });
  el('path',{d:d.join(''),fill:'none',stroke:opt.edge||'#2c2c2a','stroke-width':opt.edgeW||3,'stroke-linecap':'square'},g);
}

function renderBoard(){
  const svg=$('board');svg.innerHTML='';
  const r=$('boardWrap').getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  const c=cur().c;const W=Math.max(...c.map(p=>p[0]))+1,H=Math.max(...c.map(p=>p[1]))+1;
  const s=Math.floor(Math.min((r.width-12)/W,(r.height-12)/H, 90));
  const ox=Math.round((r.width-W*s)/2),oy=Math.round((r.height-H*s)/2);
  geo={ox,oy,s,left:r.left,top:r.top,W,H};
  const g=el('g',{},svg);
  // shape: white cells, thin grid, thick outline
  c.forEach(([x,y,h])=>el('rect',{x:ox+x*s,y:oy+y*s,width:s,height:s,fill:h?'#b9b9b4':'#fff',stroke:'#c4c4bf','stroke-width':1},g));
  drawCells(g,c.map(p=>[p[0],p[1]]),ox,oy,s,'none',{edgeW:Math.max(2.5,s/18)});
  // placed pieces
  S.placed.forEach(p=>{const col=pieceColor(p.L);
    drawCells(g,p.cells,ox,oy,s,col,{thin:shade(col,.75),thinW:1,edgeW:Math.max(2.5,s/16)});});
  renderGhost();
}

function slotScale(){const t=$('tray').firstChild;if(!t)return 10;const r=t.getBoundingClientRect();return Math.max(6,Math.min((r.width-14)/5.2,(r.height-14)/5.2));}

function renderTray(){
  const tray=$('tray');
  if(!tray.children.length){
    ORDER.forEach(L=>{const d=document.createElement('div');d.className='slot';d.dataset.l=L;
      d.innerHTML=`<span class="lt">${L}</span><svg></svg>`;tray.appendChild(d);});
  }
  const used=usedLetters();const s=slotScale();
  [...tray.children].forEach(d=>{
    const L=d.dataset.l;const svg=d.querySelector('svg');svg.innerHTML='';
    const c=S.orient[L];const w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1;
    svg.setAttribute('width',w*s+6);svg.setAttribute('height',h*s+6);
    const inHand=S.hand&&S.hand.L===L;
    d.classList.toggle('sel',!!inHand);
    const isUsed=used.has(L)||(inHand&&S.hand.from==='board');
    d.classList.toggle('used',used.has(L));
    const col=pieceColor(L);
    if(used.has(L)) drawCells(el('g',{},svg),c,3,3,s,'#fff',{thin:'#e6e6e2',edge:'#d0d0cc',edgeW:1.5});
    else drawCells(el('g',{opacity:inHand?.55:1},svg),c,3,3,s,col,{thin:shade(col,.75),edgeW:2});
  });
}

function renderInfo(){
  const ch=cur();
  $('title').textContent='Sfida '+ch.n;
  const b=$('badge');b.textContent=ch.k;b.style.background=LEV[ch.lv];
  $('pent').style.color=LEV[ch.lv];
  $('note').textContent=ch.note||'';
  const need=$('need');need.innerHTML='';
  if(ch.p){const s=9;let x=2;const svg=el('svg',{},need);let hmax=0;
    [...ch.p].forEach(L=>{const c=base(L);const w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1;
      drawCells(el('g',{},svg),c,x,2,s,'#fff',{thin:'#ccc',edgeW:1.4});x+=w*s+9;hmax=Math.max(hmax,h*s);});
    svg.setAttribute('width',x);svg.setAttribute('height',hmax+4);}
  const dots=$('dots');dots.innerHTML='';
  for(let i=1;i<=3;i++){const d=document.createElement('i');d.style.borderColor=LEV[ch.lv];d.style.background=i<=ch.lv?LEV[ch.lv]:'transparent';dots.appendChild(d);}
  $('pick').value=S.i;
}

// ---------------------------------------------------------------- placing
function cellUnder(x,y){if(!geo)return null;return [Math.floor((x-geo.left-geo.ox)/geo.s),Math.floor((y-geo.top-geo.oy)/geo.s)];}
function overBoard(x,y){const r=$('boardWrap').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function overTray(x,y){const r=$('side').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}

function candidate(x,y){
  if(!S.hand)return null;const c=S.orient[S.hand.L];const g=c[S.hand.g];const u=cellUnder(x,y);if(!u)return null;
  const cells=c.map(p=>[p[0]-g[0]+u[0],p[1]-g[1]+u[1]]);
  const sh=shapeSet(),oc=occupied();
  const ok=cells.every(([a,b])=>sh.get(key(a,b))===0&&!oc.has(key(a,b)));
  return {cells,ok};
}

function renderGhost(){
  const gs=$('ghost');gs.innerHTML='';
  if(!S.hand||!hover||!geo)return;
  const col=pieceColor(S.hand.L);
  if(overBoard(hover.x,hover.y)){
    const cd=candidate(hover.x,hover.y);if(!cd)return;
    const g=el('g',{opacity:cd.ok?.7:.45},gs);
    drawCells(g,cd.cells,geo.left+geo.ox,geo.top+geo.oy,geo.s,cd.ok?col:'#bbb',{thin:shade(col,.75),edge:cd.ok?'#2c2c2a':'#c62828',edgeW:3});
  } else if(down&&down.drag){
    const c=S.orient[S.hand.L],g0=c[S.hand.g],s=geo.s;
    drawCells(el('g',{opacity:.7},gs),c,hover.x-(g0[0]+.5)*s,hover.y-(g0[1]+.5)*s,s,col,{thin:shade(col,.75),edgeW:3});
  }
}

function place(x,y){
  const cd=candidate(x,y);
  if(!cd||!cd.ok){flash('Il pezzo non entra lì');return false;}
  S.placed.push({L:S.hand.L,cells:cd.cells});S.hand=null;
  renderAll();checkDone();return true;
}

function checkDone(){
  const sh=shapeSet();let need=0;sh.forEach(v=>{if(!v)need++});
  const covered=S.placed.reduce((a,p)=>a+p.cells.length,0);
  if(covered===need&&!S.done){S.done=true;showMsg('Sfida completata! Pentamini usati: '+S.placed.length,0);}
}

let msgT=null;
function showMsg(t,ms){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msgT);if(ms)msgT=setTimeout(()=>m.style.display='none',ms);}
function hideMsg(){$('msg').style.display='none';}
function flash(t){if(!S.done)showMsg(t,1300);}

function returnHand(){S.hand=null;renderAll();}

function takeFromTray(L){
  if(usedLetters().has(L))return;
  S.hand={L,g:middle(S.orient[L]),from:'tray'};
}
function liftFromBoard(pi,cell){
  const p=S.placed[pi];const n=norm(p.cells);
  const mx=Math.min(...p.cells.map(q=>q[0])),my=Math.min(...p.cells.map(q=>q[1]));
  S.orient[p.L]=n;
  const gi=n.findIndex(q=>q[0]===cell[0]-mx&&q[1]===cell[1]-my);
  S.placed.splice(pi,1);S.hand={L:p.L,g:gi<0?middle(n):gi,from:'board'};
  if(S.done){S.done=false;hideMsg();}
}

// ---------------------------------------------------------------- pointer handling
document.addEventListener('pointerdown',e=>{
  const slot=e.target.closest&&e.target.closest('.slot');
  hover={x:e.clientX,y:e.clientY};
  if(slot){
    const L=slot.dataset.l;
    if(usedLetters().has(L))return;
    if(!S.hand||S.hand.L!==L){takeFromTray(L);}
    down={x:e.clientX,y:e.clientY,drag:false,kind:'tray'};
    renderTray();renderGhost();e.preventDefault();return;
  }
  if(overBoard(e.clientX,e.clientY)){
    e.preventDefault();
    if(S.hand){down={x:e.clientX,y:e.clientY,drag:false,kind:'place'};renderGhost();return;}
    const u=cellUnder(e.clientX,e.clientY);const oc=occupied();const pi=u?oc.get(key(u[0],u[1])):undefined;
    if(pi!==undefined){liftFromBoard(pi,u);down={x:e.clientX,y:e.clientY,drag:false,kind:'lift'};renderAll();}
  }
});
document.addEventListener('pointermove',e=>{
  hover={x:e.clientX,y:e.clientY};
  if(down&&!down.drag&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)down.drag=true;
  if(S.hand)renderGhost();
});
document.addEventListener('pointerup',e=>{
  if(!down)return;const d=down;down=null;hover={x:e.clientX,y:e.clientY};
  if(!S.hand){renderGhost();return;}
  if(d.drag){
    if(overBoard(e.clientX,e.clientY)){place(e.clientX,e.clientY);}
    else if(overTray(e.clientX,e.clientY)){returnHand();}
    else renderGhost();
    return;
  }
  // simple tap
  if(d.kind==='place')place(e.clientX,e.clientY);
  renderGhost();
});
document.addEventListener('pointercancel',()=>{down=null;renderGhost();});
document.addEventListener('contextmenu',e=>{if(S.hand){e.preventDefault();doFlip();}});
$('boardWrap').addEventListener('wheel',e=>{if(S.hand){e.preventDefault();doRotate();}},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R')doRotate();
  else if(e.key==='f'||e.key==='F')doFlip();
  else if(e.key==='Escape')returnHand();
});

function keepGrab(fn){ // transform the piece in hand keeping the grabbed cell index
  if(!S.hand)return;const L=S.hand.L;
  const c=S.orient[L];const t=fn(c.map(p=>p.slice()));S.orient[L]=t;renderTray();renderGhost();
}
function doRotate(){keepGrab(rotate);}
function doFlip(){keepGrab(flip);}
$('rot').onclick=()=>{if(!S.hand)flash('Prima scegli un pentamino');doRotate();};
$('flip').onclick=()=>{if(!S.hand)flash('Prima scegli un pentamino');doFlip();};
$('back').onclick=()=>{
  if(S.hand){returnHand();return;}
  if(S.placed.length){S.placed.pop();S.done=false;hideMsg();renderAll();}
};

// ---------------------------------------------------------------- controls
function resetOrient(){ORDER.forEach(L=>S.orient[L]=base(L));}
function load(i){
  S.i=(i+SFIDE.length)%SFIDE.length;S.placed=[];S.hand=null;S.done=false;hideMsg();resetOrient();
  history.replaceState(null,'','#'+cur().n);
  renderInfo();renderAll();
}
function renderAll(){renderBoard();renderTray();}

SFIDE.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Sfida '+s.n;$('pick').appendChild(o);});
$('pick').onchange=e=>load(+e.target.value);
$('prev').onclick=()=>load(S.i-1);
$('next').onclick=()=>load(S.i+1);
$('rand').onclick=()=>{let j;do{j=Math.floor(Math.random()*SFIDE.length)}while(j===S.i&&SFIDE.length>1);load(j);};
$('reset').onclick=()=>load(S.i);
$('solve').onclick=()=>{
  const groups={};cur().s.forEach(([x,y,L])=>(groups[L]=groups[L]||[]).push([x,y]));
  S.placed=Object.keys(groups).map(L=>({L,cells:groups[L]}));S.hand=null;S.done=true;
  showMsg('Una soluzione possibile',2500);renderAll();
};
COLORS.forEach(([name,val],k)=>{const b=document.createElement('button');b.className='sw'+(val==='multi'?' multi':'')+(k===0?' on':'');
  b.title=name;b.setAttribute('aria-label',name);if(val!=='multi')b.style.background=val;
  b.onclick=()=>{S.color=val;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderAll();};
  $('colors').appendChild(b);});

window.addEventListener('resize',()=>renderAll());
const h=parseInt((location.hash||'').slice(1));
const start=SFIDE.findIndex(s=>s.n===h);
load(start>=0?start:Math.floor(Math.random()*SFIDE.length));
</script>
