<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il bruco mangianumeri</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --green:#9CCB5B; --green-d:#4F8A2B; --green-l:#C9E6A0; --ink:#1F2A44; --gray:#D2D2D2; --muted:#5f5e5a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Poppins', sans-serif; background: #fff; color: var(--ink); display: flex; flex-direction: column; align-items: center; overflow: hidden; }
header { flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
.logo img { width: 60px; height: 60px; object-fit: contain; border-radius: 50%; }
.logo span { font-size: 14px; color: var(--muted); }
h1 { flex: none; text-align: center; font-size: clamp(18px, 3vw, 26px); font-weight: 700; margin: 6px 0 0; }
h1 small { display: block; font-size: clamp(12px, 1.6vw, 15px); font-weight: 400; color: var(--muted); margin-top: 2px; }

/* scelta del livello */
#schermata-livello { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; width: min(92vw, 520px); }
#schermata-livello h2 { font-size: 18px; font-weight: 600; }
.btn-livello { width: 100%; text-align: left; padding: 18px 24px; font-family: inherit; font-size: 20px; font-weight: 700; color: var(--ink);
  background: #fff; border: 2px solid var(--ink); border-radius: 18px; cursor: pointer; }
.btn-livello:hover { background: #f4f8ec; }
.btn-livello small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 4px; }

/* gioco */
#gioco { display: none; flex: 1; min-height: 0; width: min(100%, 1100px); padding: 4px 16px 10px; flex-direction: column; }
#gioco.on { display: flex; }
.garden { flex: none; position: relative; height: 104px; border-bottom: 3px solid var(--green-l); }
#crawlerHome { position: absolute; left: 16px; bottom: 0; width: 170px; height: 100px; }
#crawler { width: 170px; height: 100px; z-index: 1000; pointer-events: none; transform-origin: 85% 60%; }
#crawlerHome #crawler { width: 100%; height: 100%; }
#crawler svg { width: 100%; height: 100%; overflow: visible; }
.walking .segment { animation: wiggle .3s ease-in-out infinite alternate; }
.walking .s2 { animation-delay: .1s; } .walking .s3 { animation-delay: .2s; }
.chomping .head { animation: chew .16s ease-in-out 4 alternate; transform-origin: 146px 57px; }
@keyframes wiggle { to { transform: translateY(-5px); } }
@keyframes chew { to { transform: rotate(-7deg) scale(1.06); } }

.progress-row { flex: none; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
.progress-track { height: 8px; background: #eef2e6; border-radius: 8px; flex: 1; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--green); transition: width .3s; }

.speech-area { flex: none; text-align: center; min-height: 64px; }
.bubble { text-transform: uppercase; font-size: clamp(20px, 3.6vw, 32px); font-weight: 700; color: var(--ink); line-height: 1.25; }
.sub-hint { font-size: clamp(13px, 1.6vw, 16px); color: var(--muted); min-height: 22px; }

.numbers-area { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(8px, 2vh, 18px); }
.numbers-area > div { gap: clamp(10px, 2vw, 22px) !important; margin-top: 0 !important; }
.num-card { display: flex; background: var(--green); padding: 7px 0; border-radius: 4px; }
.digit { font-family: inherit; font-weight: 700; color: #000; background: #fff; border: 0; border-left: 1px solid #ececec;
  width: clamp(44px, 7vh, 72px); height: clamp(56px, 9.5vh, 94px); font-size: clamp(30px, 6vh, 58px); line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; transition: background .15s; }
.digit:first-child { border-left: 0; }
.digit.clickable:hover { background: #F4F9EA; }
.digit:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.digit.eaten { background: var(--gray); color: transparent; cursor: default; position: relative; }
.digit.wrong-click { background: #fde3df; animation: shake .3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* fine partita: compare la domanda */
.final-area { flex: none; display: none; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px; }
.final-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.final-area label { font-size: clamp(17px, 2.4vw, 22px); font-weight: 700; }
.final-input { font-family: inherit; font-size: 22px; font-weight: 700; padding: 6px 10px; width: 120px; text-align: center; border: 2px solid var(--ink); border-radius: 10px; color: var(--ink); }
.keypad { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; }
.keypad button { font-family: inherit; min-width: 42px; min-height: 42px; font-size: 20px; font-weight: 600; background: #fff; border: 1px solid #c9c9c9; border-radius: 10px; color: var(--ink); cursor: pointer; }
.keypad button:hover { background: #f4f4f4; }
.result-msg { font-size: 18px; font-weight: 700; min-height: 26px; }
.correct { color: var(--green-d); } .wrong { color: #b3261e; }
#gioco.fine .speech-area { min-height: 0; }
#gioco.fine .sub-hint { display: none; }
#gioco.fine .digit { width: clamp(34px, 5.6vh, 60px); height: clamp(40px, 7vh, 72px); font-size: clamp(24px, 4.6vh, 46px); }
#gioco.fine .numbers-area { gap: 10px; }
.final-input::-webkit-outer-spin-button, .final-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.final-input { -moz-appearance: textfield; appearance: textfield; }

.step-log { flex: none; align-self: center; font-size: 14px; color: var(--ink); margin-top: 4px; max-width: 760px; }
.step-log summary { cursor: pointer; color: var(--muted); text-align: center; }
.step-log ul { padding-left: 20px; columns: 2; column-gap: 28px; margin-top: 4px; }
.step-log li { margin: 2px 0; }

.controls { flex: none; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding-top: 10px; }
.btn { font-family: inherit; font-size: clamp(14px, 1.8vw, 17px); font-weight: 600; border-radius: 999px; padding: 9px 22px; cursor: pointer;
  border: 2px solid var(--ink); background: #fff; color: var(--ink); }
.btn:hover { background: #f4f4f4; }
.btn.scuro { background: var(--ink); color: #fff; }
.btn.scuro:hover { background: #2c3a5c; }

@media (max-width: 650px) {
  #gioco { padding: 4px 8px 8px; }
  .digit { width: 36px; height: 52px; font-size: 30px; }
  .num-card { padding: 5px 0; }
  .step-log ul { columns: 1; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* stampa */
#foglio-stampa { display: none; }
#titolo-stampa { display: none; font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 12px; }
.scheda-stampa { border: 1.5px solid #9a9a9a; border-radius: 10px; padding: 12px 18px; margin-bottom: 18px; page-break-inside: avoid; break-inside: avoid; }
.scheda-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1.5px dashed #aaa; }
.scheda-bruco { flex-shrink: 0; line-height: 0; }
.numeri-stampa { display: flex; gap: 22px; font-weight: 700; color: #000; flex-wrap: wrap; justify-content: center; flex: 1; }
.logo-stampa { flex-shrink: 0; }
.logo-stampa img { width: 34px; height: 34px; object-fit: contain; border-radius: 50%; vertical-align: middle; }
.istruzioni-stampa { columns: 2; column-gap: 26px; font-size: 13.5px; color: #222; margin: 8px 0 10px 18px; }
.istruzioni-stampa li { break-inside: avoid; margin-bottom: 4px; line-height: 1.3; }
.istruzioni-stampa b { text-transform: uppercase; }
.finale-stampa { font-size: 14px; font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.finale-stampa .linea-risposta { display: inline-block; border-bottom: 2px solid #333; width: 150px; height: 20px; }
.firma-stampa { text-align: center; font-size: 11px; color: #555; margin-top: 6px; }
@media print {
  html, body { height: auto; overflow: visible; display: block; background: #fff; }
  header, h1, #schermata-livello, #gioco { display: none !important; }
  #foglio-stampa, #titolo-stampa { display: block !important; }
}
</style>

<script>
var BRUCO_MINI = '<svg viewBox="0 0 120 70" width="64" height="38" xmlns="http://www.w3.org/2000/svg"><g fill="#4F8A2B"><ellipse cx="22" cy="62" rx="4" ry="2.6"/><ellipse cx="44" cy="62" rx="4" ry="2.6"/><ellipse cx="66" cy="62" rx="4" ry="2.6"/></g><circle cx="22" cy="44" r="15" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="1.4"/><circle cx="44" cy="42" r="17" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="1.4"/><circle cx="67" cy="41" r="18" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="1.4"/><line x1="88" y1="18" x2="84" y2="7" stroke="#4F8A2B" stroke-width="2.4" stroke-linecap="round"/><line x1="100" y1="18" x2="106" y2="8" stroke="#4F8A2B" stroke-width="2.4" stroke-linecap="round"/><circle cx="84" cy="6" r="3" fill="#4F8A2B"/><circle cx="106" cy="7" r="3" fill="#4F8A2B"/><circle cx="94" cy="38" r="20" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="1.4"/><circle cx="88" cy="33" r="4.2" fill="#fff"/><circle cx="89" cy="33.5" r="2.4" fill="#1F2A44"/><circle cx="101" cy="33" r="4.2" fill="#fff"/><circle cx="102" cy="33.5" r="2.4" fill="#1F2A44"/><path d="M88 45 Q94 51 100 45" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round"/></svg>';

var cifre = 2;
var pendingTimers=[];
function later(fn,ms){var t=setTimeout(fn,ms);pendingTimers.push(t);return t;}
function cancelPending(){for(var i=0;i<pendingTimers.length;i++)clearTimeout(pendingTimers[i]);pendingTimers=[];resetCrawler();}
function resetCrawler(){var c=document.getElementById('crawler');if(!c)return;c.className='';c.style.cssText='';document.getElementById('crawlerHome').appendChild(c);}
function updateProgress(){document.getElementById('progressLabel').textContent=stepIdx+' / '+game.steps.length+' bocconi';document.getElementById('progressFill').style.width=(100*stepIdx/game.steps.length)+'%';document.getElementById('levelLabel').textContent=cifre===2?'DECINE E UNITÀ':'CENTINAIA, DECINE E UNITÀ';}
function eatDigit(el,done){
 var c=document.getElementById('crawler'),from=c.getBoundingClientRect(),to=el.getBoundingClientRect();
 var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.body.appendChild(c);c.style.position='fixed';c.style.left=from.left+'px';c.style.top=from.top+'px';c.className='walking';
 later(function(){c.style.transition=reduced?'none':'left .65s ease-in-out, top .65s ease-in-out';c.style.left=(to.left+to.width/2-146)+'px';c.style.top=(to.top+to.height/2-57)+'px';},20);
 later(function(){c.className='chomping';el.classList.add('eaten');el.disabled=true;},reduced?40:700);
 later(function(){c.className='walking';var home=document.getElementById('crawlerHome').getBoundingClientRect();c.style.left=home.left+'px';c.style.top=home.top+'px';},reduced?90:1200);
 later(function(){resetCrawler();done();},reduced?150:1900);
}

var game = null, stepIdx = 0, logLines = [], waitingClick = false;

var unita = ['','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
var decine = ['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
var centinaia = ['','cento','duecento','trecento','quattrocento','cinquecento','seicento','settecento','ottocento','novecento'];

function toWords(n) {
  if (n === 0) return 'zero';
  if (n < 20) return unita[n];
  if (n < 100) {
    var d = Math.floor(n/10), u = n%10;
    var base = decine[d];
    if (u===1||u===8) base = base.slice(0,-1);
    return u===0 ? base : base+unita[u];
  }
  var c = Math.floor(n/100), resto = n%100;
  var baseC = c===1 ? 'cento' : centinaia[c];
  if (resto===0) return baseC;
  if (resto===8 || (resto>=80 && resto<90)) baseC=baseC.slice(0,-1);
  return baseC + toWords(resto);
}

function buildBites(nums) {
  var allBites = [];
  nums.forEach(function(n, ni) {
    var s = String(n);
    for (var di=0; di<s.length; di++) {
      var place = s.length-1-di;
      var val = parseInt(s[di]) * Math.pow(10, place);
      allBites.push({val:val, numIdx:ni, digitPos:di});
    }
  });
  var skipIdx = Math.floor(Math.random()*allBites.length);
  var bites = allBites.filter(function(_,i){ return i!==skipIdx; });
  for (var i=bites.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp=bites[i]; bites[i]=bites[j]; bites[j]=tmp;
  }
  return {nums:nums, steps:bites};
}

function generateGame2() {
  var nums = [], attempts = 0;
  while (true) {
    attempts++;
    nums = [];
    while (nums.length < 5) {
      var n = Math.floor(Math.random()*89)+11;
      var d0 = Math.floor(n/10), d1 = n%10;
      if (d1===0) continue;
      if (d0===d1) continue;
      if (nums.indexOf(n)<0) nums.push(n);
    }
    var asUnits = nums.map(function(n){ return n%10; });
    var asTens  = nums.map(function(n){ return Math.floor(n/10); });
    var overlap = asUnits.filter(function(d){ return asTens.indexOf(d)>=0; });
    if (overlap.length>=2) break;
    if (attempts>200) break;
  }
  return buildBites(nums);
}

function generateGame3() {
  var nums = [], attempts = 0;
  while (true) {
    attempts++;
    nums = [];
    while (nums.length < 5) {
      var n = Math.floor(Math.random()*900)+100;
      var d0 = Math.floor(n/100);
      var d1 = Math.floor((n%100)/10);
      var d2 = n%10;
      if (d1===0||d2===0) continue;
      if (d0===d1&&d1===d2) continue;
      if (nums.indexOf(n)<0) nums.push(n);
    }
    var cents = nums.map(function(n){ return Math.floor(n/100); });
    var tens  = nums.map(function(n){ return Math.floor((n%100)/10); });
    var ones  = nums.map(function(n){ return n%10; });
    var ambig = cents.filter(function(d){ return tens.indexOf(d)>=0||ones.indexOf(d)>=0; });
    if (ambig.length>=2) break;
    if (attempts>300) break;
  }
  return buildBites(nums);
}

function avvia(nc) {
  cifre = nc;
  document.getElementById('schermata-livello').style.display = 'none';
  document.getElementById('gioco').classList.add('on');
  newGame();
}

function tornaScelta() {
  cancelPending(); waitingClick=false;
  document.getElementById('gioco').classList.remove('on');
  document.getElementById('schermata-livello').style.display = 'flex';
}

function newGame() {
  cancelPending();
  game = cifre===2 ? generateGame2() : generateGame3();
  stepIdx=0; logLines=[]; waitingClick=false;
  document.getElementById('finalArea').style.display='none';
  document.getElementById('gioco').classList.remove('fine');
  document.getElementById('resultMsg').textContent='';
  document.getElementById('stepLog').style.display='none';
  document.getElementById('stepList').innerHTML='';
  document.getElementById('finalInput').value='';
  document.getElementById('subHint').textContent='';
  renderNumbers(); updateProgress();
  setBubble('COMINCIAMO!');
  later(showCurrentStep, 400);
}

function renderNumbers() {
  var area = document.getElementById('numbersArea');
  area.innerHTML = '';
  var row1 = document.createElement('div');
  row1.style.cssText = 'display:flex;justify-content:center;gap:14px;width:100%;';
  var row2 = document.createElement('div');
  row2.style.cssText = 'display:flex;justify-content:center;gap:14px;width:100%;margin-top:14px;';
  game.nums.forEach(function(n, ni) {
    var digits = String(n).split('');
    var card = document.createElement('div');
    card.className = 'num-card';
    card.id = 'card-'+ni;
    digits.forEach(function(d, di) {
      var span = document.createElement('button');
      span.type="button"; span.setAttribute("aria-label", "Cifra "+d+" nel numero "+n);
      span.className = 'digit';
      span.id = 'd-'+ni+'-'+di;
      span.textContent = d;
      span.onclick = function(){ onDigitClick(ni, di); };
      card.appendChild(span);
    });
    (ni<3 ? row1 : row2).appendChild(card);
  });
  area.appendChild(row1);
  area.appendChild(row2);
}

function setBubble(txt){ document.getElementById('bubble').textContent = txt; }
function setHint(txt){ document.getElementById('subHint').textContent = txt; }

function showCurrentStep() {
  if (!game||stepIdx>=game.steps.length) return;
  var s = game.steps[stepIdx];
  setBubble('MANGIO '+toWords(s.val)+'!');
  setHint('TOCCA LA CIFRA GIUSTA');
  makeAllClickable();
  waitingClick = true;
}

function makeAllClickable() {
  game.nums.forEach(function(n, ni) {
    String(n).split('').forEach(function(d, di) {
      var el = document.getElementById('d-'+ni+'-'+di);
      if (el&&!el.classList.contains('eaten')) el.classList.add('clickable');
    });
  });
}

function clearClickable() {
  document.querySelectorAll('.digit.clickable').forEach(function(el){ el.classList.remove('clickable'); });
}

function onDigitClick(ni, di) {
  if (!waitingClick) return;
  var s = game.steps[stepIdx];
  var el = document.getElementById('d-'+ni+'-'+di);
  if (!el||el.classList.contains('eaten')) return;
  var digits = String(game.nums[ni]).split('');
  var place = digits.length-1-di;
  var digitVal = parseInt(digits[di])*Math.pow(10, place);
  if (digitVal===s.val) {
    waitingClick = false;
    clearClickable();
    setBubble('GNAM, '+toWords(s.val)+'!');
    eatDigit(el,function(){
    logLines.push('Ho mangiato il <strong>'+digits[di]+'</strong> (vale '+toWords(s.val)+') dal numero <strong>'+game.nums[ni]+'</strong>');
    stepIdx++; updateProgress();
    setHint('');
    if (stepIdx>=game.steps.length) {
      setBubble('È RIMASTA UNA CIFRA!');
      showLog(); showFinal();
    } else {
      setBubble('ESATTO!');
      later(showCurrentStep, 300);
    }
    });
  } else {
    el.classList.add('wrong-click');
    var word = toWords(s.val);
    setBubble('OPS! QUELLA CIFRA NON VALE '+word+'. RIPROVA.');
    later(function(){
      el.classList.remove('wrong-click');
      setBubble('MANGIO '+word+'!');
    }, 900);
  }
}

function showLog() {
  document.getElementById('stepList').innerHTML = logLines.map(function(l){ return '<li>'+l+'</li>'; }).join('');
  document.getElementById('stepLog').style.display = 'block';
}

function showFinal() { document.getElementById('finalArea').style.display = 'flex'; document.getElementById('gioco').classList.add('fine'); }

function calcResiduo() {
  var tot = 0;
  game.nums.forEach(function(n, ni) {
    String(n).split('').forEach(function(d, di) {
      var el = document.getElementById('d-'+ni+'-'+di);
      if (el&&!el.classList.contains('eaten')) {
        var place = String(n).length-1-di;
        tot += parseInt(d)*Math.pow(10, place);
      }
    });
  });
  return tot;
}

function checkAnswer() {
  var val = parseInt(document.getElementById('finalInput').value);
  var correct = calcResiduo();
  var msg = document.getElementById('resultMsg');
  if (isNaN(val)) { msg.textContent='INSERISCI UN NUMERO.'; msg.className='result-msg wrong'; return; }
  if (val===correct) {
    msg.innerHTML = 'ESATTO! RIMANE <strong>'+correct+'</strong>';
    msg.className = 'result-msg correct';
  } else {
    msg.innerHTML = 'RIPROVA: PENSA AL POSTO DELLA CIFRA RIMASTA.';
    msg.className = 'result-msg wrong';
  }
}

function stampaSoglio() {
  var logoSrc = 'https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png';
  var fsNumeri = cifre===3 ? '26px' : '28px';
  var nSchede = cifre===2 ? 8 : 6;

  var foglio = document.getElementById('foglio-stampa');
  var titolo = document.getElementById('titolo-stampa');
  foglio.innerHTML = '';
  foglio.appendChild(titolo);
  foglio.style.display = 'block';

  for (var r=0; r<nSchede; r++) {
    var g = cifre===2 ? generateGame2() : generateGame3();

    var scheda = document.createElement('div');
    scheda.className = 'scheda-stampa';

    // intestazione: bruco, numeri, logo
    var header = document.createElement('div');
    header.className = 'scheda-header';

    var bruco = document.createElement('div');
    bruco.className = 'scheda-bruco';
    bruco.innerHTML = BRUCO_MINI;
    header.appendChild(bruco);

    var numDiv = document.createElement('div');
    numDiv.className = 'numeri-stampa';
    numDiv.style.fontSize = fsNumeri;
    g.nums.forEach(function(n) {
      var sp = document.createElement('span');
      sp.textContent = String(n);
      numDiv.appendChild(sp);
    });
    header.appendChild(numDiv);

    var logoDiv = document.createElement('div');
    logoDiv.className = 'logo-stampa';
    var img = document.createElement('img');
    img.src = logoSrc;
    img.alt = 'Logo';
    logoDiv.appendChild(img);
    header.appendChild(logoDiv);

    scheda.appendChild(header);

    // istruzioni passo-passo, come se si giocasse davvero
    var ol = document.createElement('ol');
    ol.className = 'istruzioni-stampa';
    g.steps.forEach(function(s) {
      var li = document.createElement('li');
      li.innerHTML = 'Il bruco mangia <b>'+toWords(s.val)+'</b>.';
      ol.appendChild(li);
    });
    scheda.appendChild(ol);

    // riga finale, senza indicare il risultato
    var finale = document.createElement('div');
    finale.className = 'finale-stampa';
    finale.innerHTML = 'Alla fine resta una sola cifra: quale numero rimane? <span class="linea-risposta"></span>';
    scheda.appendChild(finale);

    foglio.appendChild(scheda);
  }
  var firma = document.createElement('div');
  firma.className = 'firma-stampa';
  firma.textContent = 'Rita Di Ianni · matematichenonsinasce · idee e materiali per la scuola primaria';
  foglio.appendChild(firma);

  setTimeout(function() {
    window.print();
    setTimeout(function() {
      foglio.innerHTML = '';
      foglio.style.display = 'none';
      var t = document.createElement('div');
      t.id = 'titolo-stampa';
      t.textContent = 'Il bruco mangianumeri';
      foglio.appendChild(t);
    }, 1000);
  }, 400);
}

(function(){var pad=document.getElementById('keypad');for(var i=0;i<11;i++){var b=document.createElement('button');b.type='button';b.textContent=i===10?'⌫':String(i);b.setAttribute('aria-label',i===10?'Cancella ultima cifra':String(i));b.onclick=function(){var input=document.getElementById('finalInput');input.value=this.textContent==='⌫'?input.value.slice(0,-1):(input.value+this.textContent).slice(0,4);};pad.appendChild(b);}document.getElementById('finalInput').onkeydown=function(e){if(e.key==='Enter')checkAnswer();};})();

</script>
