<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Contafagioli</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif;
    background: #f5efe6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  #logo-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 12px; }
  #logo-bar img { width: 60px; height: 60px; border-radius: 50%; }
  #logo-bar a { font-size: 0.95rem; color: #4a90c4; text-decoration: none; font-weight: bold; letter-spacing: 0.02em; }

  #info-bar {
    background: #fff8f0;
    border: 2px solid #c8a97a;
    border-radius: 10px;
    padding: 8px 24px;
    margin-bottom: 14px;
    font-size: 1.1rem;
    color: #5a3e1b;
  }
  #info-bar b { font-size: 1.3rem; }

  #bicchierini {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
    min-height: 90px;
  }
  .bicchiere { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bicchiere-label { font-size: 0.75rem; color: #5a3e1b; font-weight: bold; }

  #tavolo {
    background: #d4a96a;
    border-radius: 16px;
    border: 3px solid #b07d3a;
    padding: 16px;
    width: 100%;
    max-width: 600px;
    min-height: 200px;
    position: relative;
    margin-bottom: 14px;
  }
  #tavolo-label { text-align: center; font-size: 0.8rem; color: #5a3e1b; margin-bottom: 8px; font-weight: bold; }
  #fagioli-area { position: relative; width: 100%; height: 180px; }
  .fagiolo {
    position: absolute;
    width: 28px;
    height: 20px;
    background: radial-gradient(ellipse at 35% 35%, #c8a060, #7a5c2e);
    border-radius: 50%;
    border: 1.5px solid #5a3e1b;
    cursor: pointer;
    transform: rotate(var(--rot, 0deg));
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
  }
  .fagiolo:hover { transform: rotate(var(--rot, 0deg)) scale(1.15); box-shadow: 0 2px 6px #0004; }
  /* Fagiolo che vola nel bicchierino */
  .fagiolo-volo {
    position: fixed;
    z-index: 1000;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(.45,0,.25,1), opacity 0.6s ease-in;
  }
  .fagiolo.sel-giallo {
    background: radial-gradient(ellipse at 35% 35%, #ffe066, #c8a030);
    border-color: #e6a000;
    box-shadow: 0 0 8px #ffcc00aa;
  }
  .fagiolo.sel-arancio {
    background: radial-gradient(ellipse at 35% 35%, #ffaa33, #c85000);
    border-color: #c85000;
    box-shadow: 0 0 8px #ff8800aa;
  }

  #selezione-bar { font-size: 0.95rem; color: #5a3e1b; margin-bottom: 6px; min-height: 1.4em; text-align: center; }

  #btn-area { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    font-weight: bold;
  }
  #btn-metti { background: #5a8a3a; color: white; }
  #btn-metti:disabled { background: #aaa; cursor: default; }
  #btn-nuovo { background: #5a3e1b; color: white; }
  #btn-pdf, #btn-pdf-bf { background: #4a90c4; color: white; }

  #risultato { display: none; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; }
  #risposta-row { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; color: #5a3e1b; }
  #input-tot {
    width: 64px;
    font-size: 1.2rem;
    text-align: center;
    border: 2px solid #c8a97a;
    border-radius: 8px;
    padding: 4px;
  }
  #btn-verifica {
    background: #5a8a3a;
    color: white;
    padding: 6px 16px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  #feedback { font-size: 1.1rem; min-height: 1.4em; text-align: center; }
  #coppa { font-size: 3rem; display: none; }

  #stima-bar { margin-bottom: 12px; font-size: 1rem; color: #5a3e1b; display: flex; align-items: center; gap: 10px; }
  #input-stima {
    width: 64px; font-size: 1.1rem; text-align: center;
    border: 2px solid #c8a97a; border-radius: 8px; padding: 4px;
  }

  /* --- Pannello scheda PDF --- */
  #pdf-config {
    background: #fff8f0;
    border: 2px solid #c8a97a;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    font-size: 0.95rem;
    color: #5a3e1b;
  }
  .pdf-sep { width: 2px; align-self: stretch; background: #c8a97a; }
  .pdf-check { display: flex; align-items: center; gap: 4px; }
  #pdf-config .pdf-check input { width: auto; }
  .pdf-nota { font-size: 0.8rem; color: #8a6a3a; }
  #pdf-config input {
    width: 56px; font-size: 1rem; text-align: center;
    border: 2px solid #c8a97a; border-radius: 8px; padding: 4px;
  }

  @media (max-width: 480px) {
    .fagiolo { width: 24px; height: 17px; }
    #fagioli-area { height: 150px; }
  }

  /* --- Area di stampa (nascosta a schermo) --- */
  #area-stampa { display: none; }

  @media print {
    @page { size: A4; margin: 10mm; }
    body * { visibility: hidden; }
    #area-stampa, #area-stampa * { visibility: visible; }
    #area-stampa { display: block; position: absolute; top: 0; left: 0; width: 100%; }
    .pagina { page-break-after: always; }
    .pagina:last-child { page-break-after: auto; }
    .bf-pagina { page-break-after: always; }
    .bf-pagina:last-child { page-break-after: auto; }
  }

  .pagina {
    width: 190mm;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .scheda {
    width: 100%;
    padding: 2mm 0;
    font-family: sans-serif;
    color: #3a2a10;
  }
  .scheda-logo {
    display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 1.5mm;
  }
  .scheda-logo img { width: 24px; height: 24px; border-radius: 50%; }
  .scheda-logo .nome { font-size: 0.65rem; color: #4a90c4; font-weight: bold; }
  .scheda-titolo { text-align: center; font-size: 1rem; font-weight: bold; margin-bottom: 1mm; color: #5a3e1b; }
  .scheda-numero { text-align: center; font-size: 0.7rem; color: #8a6a3a; margin-bottom: 2mm; }
  .scheda-tavolo {
    background: #f0dcb8;
    border: 2px solid #b07d3a;
    border-radius: 8px;
    width: 100%;
    height: 68mm;
    position: relative;
    margin-bottom: 3mm;
  }
  .scheda-fagiolo {
    position: absolute;
    width: 6mm;
    height: 4.2mm;
    background: #a17a3e;
    border: 0.35mm solid #5a3e1b;
    border-radius: 50%;
  }
  .scheda-domande { display: flex; flex-direction: column; gap: 4mm; font-size: 1rem; }
  .scheda-domande .riga { display: flex; align-items: baseline; gap: 3mm; }
  .scheda-domande .linea {
    flex: 1;
    border-bottom: 0.4mm solid #5a3e1b;
    height: 11mm;
  }
  /* Scheda "bicchierini e fagioli": 12 riquadri per pagina A4.
     Bicchierini e fagioli sono SVG, così si stampano anche in bianco e nero
     e senza l'opzione "grafica di sfondo". */
  .bf-pagina { width: 190mm; height: 275mm; margin: 0 auto; display: flex; flex-direction: column; font-family: sans-serif; color: #3a2a10; }
  .bf-testa { display: flex; align-items: center; gap: 3mm; height: 11mm; border-bottom: 0.3mm solid #b07d3a; margin-bottom: 2mm; }
  .bf-testa img { width: 8mm; height: 8mm; border-radius: 50%; }
  .bf-testa .t { font-weight: bold; font-size: 0.95rem; color: #5a3e1b; }
  .bf-testa .leg { margin-left: auto; display: flex; align-items: center; gap: 1.5mm; font-size: 0.75rem; }
  .bf-griglia { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(8, 1fr); }
  .bf-box { border: 0.3mm dashed #b07d3a; margin: -0.15mm; padding: 2mm 3mm; display: flex; flex-direction: column; gap: 1mm; overflow: hidden; }
  .bf-num { font-size: 0.6rem; color: #8a6a3a; margin-right: 1mm; }
  .bf-bicchieri { display: flex; gap: 1.2mm; height: 10mm; align-items: flex-end; }
  .bf-bicchieri svg { width: 7.7mm; height: 10mm; flex: none; }
  .bf-fagioli { position: relative; height: 10.5mm; }
  .bf-fagioli svg { position: absolute; width: 6mm; height: 4.2mm; }
  .bf-risposta { margin-top: auto; display: flex; align-items: baseline; gap: 2mm; font-size: 0.85rem; }
  .bf-risposta .linea { width: 28mm; border-bottom: 0.35mm solid #5a3e1b; height: 5mm; }
  .bf-sol { font-size: 0.85rem; columns: 4; line-height: 1.8; }
  .divisore {
    width: 100%;
    border: none;
    border-top: 0.4mm dashed #b07d3a;
    margin: 1mm 0 2mm;
    position: relative;
  }
  .divisore::after {
    content: '✂ taglia qui';
    position: absolute;
    top: -2.2mm;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 0 3mm;
    font-size: 0.6rem;
    color: #b07d3a;
  }
</style>
</head>
<body>

<div id="logo-bar">
  <img src="https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png" alt="logo">
  <a href="https://matematichenonsinasce.com" target="_blank">Matematiche non si nasce</a>
  <div style="font-weight:bold; color:#5a3e1b; font-size:1.2rem; margin-top:6px;">Il Contafagioli</div>
</div>

<div id="pdf-config">
  <span>Schermate nella scheda:</span>
  <input id="input-n-schede" type="number" min="1" max="8" value="3">
  <button id="btn-pdf">📄 Crea scheda PDF</button>
  <span class="pdf-sep"></span>
  <span>Bicchierini e fagioli — pagine:</span>
  <input id="input-n-pagine-bf" type="number" min="1" max="5" value="1">
  <label class="pdf-check"><input id="check-soluzioni-bf" type="checkbox"> soluzioni</label>
  <button id="btn-pdf-bf">🥤 Crea PDF bicchierini e fagioli</button>
  <span class="pdf-nota">16 riquadri per pagina</span>
</div>

<div id="info-bar">
  Decine: <b id="n-decine">0</b>
</div>

<div id="bicchierini"></div>

<div id="stima-bar">
  La mia stima: <input id="input-stima" type="number" min="0" max="199" placeholder="?">
</div>

<div id="tavolo">
  <div id="tavolo-label">Tavolo — clicca i fagioli</div>
  <div id="fagioli-area"></div>
</div>

<div id="selezione-bar">Selezionati: <b id="n-sel">0</b> / 10</div>

<div id="btn-area">
  <button id="btn-metti" disabled>Metti nel bicchierino</button>
  <button id="btn-nuovo">Nuovo giro</button>
</div>

<div id="risultato">
  <div id="risposta-row">
    Quanti fagioli in tutto?
    <input id="input-tot" type="number" min="0" max="199">
    <button id="btn-verifica">Verifica</button>
  </div>
  <div id="feedback"></div>
  <div id="coppa">🏆</div>
</div>

<!-- Area usata solo in stampa -->
<div id="area-stampa"></div>

<script>
  const areaEl = document.getElementById('fagioli-area');
  const bicchieriniEl = document.getElementById('bicchierini');
  const nDecinEl = document.getElementById('n-decine');
  const nSelEl = document.getElementById('n-sel');
  const btnMetti = document.getElementById('btn-metti');
  const btnNuovo = document.getElementById('btn-nuovo');
  const risultatoEl = document.getElementById('risultato');

  let fagioli = [];
  let decine = 0;
  let totale = 0;

  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function nuovoGiro() {
    decine = 0;
    totale = rnd(11, 99);
    fagioli = [];
    areaEl.innerHTML = '';
    areaEl.style.height = '';
    bicchieriniEl.innerHTML = '';
    risultatoEl.style.display = 'none';
    btnMetti.disabled = true;
    nSelEl.textContent = 0;
    nDecinEl.textContent = 0;
    document.getElementById('input-stima').value = '';
    posizionaFagioli(totale);
  }

  // Posizioni sparse e senza sovrapposizioni: prima si prova a caso; se non c'è
  // posto si cerca un buco libero; se il tavolo è pieno, il tavolo si allunga.
  function posizionaFagioli(n) {
    const W = areaEl.offsetWidth || 560;
    let H = areaEl.offsetHeight || 180;
    const fw = 30, fh = 22, margin = 4;
    const placed = [];
    const libero = (x, y) => placed.every(p => Math.abs(p.x - x) >= fw || Math.abs(p.y - y) >= fh);

    for (let i = 0; i < n; i++) {
      let x, y, tries = 0, ok;
      do {
        x = rnd(margin, W - fw - margin);
        y = rnd(margin, H - fh - margin);
        ok = libero(x, y);
        tries++;
      } while (!ok && tries < 400);

      while (!ok) {
        const buchi = [];
        for (let yy = margin; yy <= H - fh - margin; yy += 2)
          for (let xx = margin; xx <= W - fw - margin; xx += 2)
            if (libero(xx, yy)) buchi.push([xx, yy]);
        if (buchi.length) {
          [x, y] = buchi[rnd(0, buchi.length - 1)];
          ok = true;
        } else {
          H += fh;
          areaEl.style.height = H + 'px';
        }
      }

      placed.push({x, y});
      const el = document.createElement('div');
      el.className = 'fagiolo';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--rot', `${rnd(-30,30)}deg`);
      el.addEventListener('click', () => clickFagiolo(i));
      areaEl.appendChild(el);
      fagioli.push({el, id: i, selected: false});
    }
  }

  function clickFagiolo(id) {
    const f = fagioli.find(f => f.id === id);
    if (!f) return;
    const nSel = fagioli.filter(f => f.selected).length;
    if (!f.selected && nSel >= 10) return;
    f.selected = !f.selected;
    if (!f.selected) {
      f.el.classList.remove('sel-giallo', 'sel-arancio');
      f.colore = null;
    } else {
      const nSelNow = fagioli.filter(f => f.selected).length;
      f.colore = nSelNow <= 5 ? 'sel-giallo' : 'sel-arancio';
      f.el.classList.add(f.colore);
    }
    const sel = fagioli.filter(f => f.selected).length;
    nSelEl.textContent = sel;
    btnMetti.disabled = sel !== 10;
  }

  btnMetti.addEventListener('click', () => {
    const sel = fagioli.filter(f => f.selected);
    if (sel.length !== 10) return;
    fagioli = fagioli.filter(f => !f.selected);
    decine++;
    nDecinEl.textContent = decine;
    aggiornaBicchierini();
    btnMetti.disabled = true;
    nSelEl.textContent = 0;

    // I dieci fagioli volano, uno dopo l'altro, dentro il nuovo bicchierino
    const bicchiere = bicchieriniEl.lastElementChild.querySelector('svg').getBoundingClientRect();
    const bx = bicchiere.left + bicchiere.width / 2, by = bicchiere.top + bicchiere.height * 0.55;
    sel.forEach((f, k) => {
      const r = f.el.getBoundingClientRect();
      const volo = f.el.cloneNode(true);
      volo.classList.add('fagiolo-volo');
      const w = f.el.offsetWidth, h = f.el.offsetHeight;
      volo.style.left = (r.left + r.width / 2 - w / 2) + 'px';
      volo.style.top = (r.top + r.height / 2 - h / 2) + 'px';
      f.el.remove();
      document.body.appendChild(volo);
      const dx = bx - (r.left + r.width / 2), dy = by - (r.top + r.height / 2);
      setTimeout(() => {
        volo.style.transform = `translate(${dx}px, ${dy}px) scale(0.6)`;
        volo.style.opacity = '0';
      }, 30 + k * 60);
      setTimeout(() => volo.remove(), 30 + k * 60 + 650);
    });

    if (fagioli.length < 10) {
      setTimeout(mostraRisultato, 30 + 9 * 60 + 650);
    }
  });

  function aggiornaBicchierini() {
    bicchieriniEl.innerHTML = '';
    for (let d = 0; d < decine; d++) {
      const div = document.createElement('div');
      div.className = 'bicchiere';
      div.innerHTML = `
        <div class="bicchiere-label">una decina</div>
        <svg width="54" height="70" viewBox="0 0 54 70">
          <polygon points="4,8 50,8 44,64 10,64" fill="white" stroke="#8b6340" stroke-width="2"/>
          <line x1="4" y1="8" x2="50" y2="8" stroke="#8b6340" stroke-width="2.5"/>
        </svg>
      `;
      bicchieriniEl.appendChild(div);
    }
  }

  function mostraRisultato() {
    risultatoEl.style.display = 'flex';
    document.getElementById('feedback').textContent = '';
    document.getElementById('coppa').style.display = 'none';
    const inp = document.getElementById('input-tot');
    inp.value = '';
    inp.focus();
  }

  document.getElementById('btn-verifica').addEventListener('click', verifica);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && risultatoEl.style.display === 'flex') verifica();
  });

  function verifica() {
    const inp = document.getElementById('input-tot');
    const feedback = document.getElementById('feedback');
    const coppa = document.getElementById('coppa');
    const val = parseInt(inp.value);
    const tot = decine * 10 + fagioli.length;
    if (val === tot) {
      feedback.textContent = 'Esatto!';
      feedback.style.color = '#2a6a0a';
      coppa.style.display = 'block';
    } else {
      feedback.textContent = 'Non è esatto!';
      feedback.style.color = '#c00';
      coppa.style.display = 'none';
      inp.value = '';
      inp.focus();
    }
  }

  btnNuovo.addEventListener('click', nuovoGiro);
  nuovoGiro();

  /* ================= SCHEDA PDF ================= */

  const LOGO_URL = 'https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png';

  function posizionaFagioliStampa(container, n) {
    // dimensioni in mm, coerenti con .scheda-tavolo (190mm larghezza, 68mm altezza)
    const W = 186, H = 64;
    const fw = 7, fh = 5, margin = 2;
    const placed = [];

    for (let i = 0; i < n; i++) {
      let x, y, tries = 0, ok;
      do {
        x = Math.random() * (W - fw - margin) + margin;
        y = Math.random() * (H - fh - margin) + margin;
        ok = placed.every(p => Math.abs(p.x - x) > fw - 1.5 || Math.abs(p.y - y) > fh - 1.5);
        tries++;
      } while (!ok && tries < 300);

      placed.push({x, y});
      const el = document.createElement('div');
      el.className = 'scheda-fagiolo';
      el.style.left = x + 'mm';
      el.style.top = y + 'mm';
      el.style.transform = `rotate(${rnd(-30, 30)}deg)`;
      container.appendChild(el);
    }
  }

  function creaScheda(numero, quantita) {
    const scheda = document.createElement('div');
    scheda.className = 'scheda';
    scheda.innerHTML = `
      <div class="scheda-logo">
        <img src="${LOGO_URL}" alt="logo">
        <div class="nome">Matematiche non si nasce</div>
      </div>
      <div class="scheda-titolo">Il Contafagioli</div>
      <div class="scheda-numero">Schermata ${numero}</div>
      <div class="scheda-tavolo"></div>
      <div class="scheda-domande">
        <div class="riga">La mia stima iniziale: <div class="linea"></div></div>
        <div class="riga">Quanti fagioli in tutto? <div class="linea"></div></div>
      </div>
    `;
    const tavolo = scheda.querySelector('.scheda-tavolo');
    posizionaFagioliStampa(tavolo, quantita);
    return scheda;
  }

  document.getElementById('btn-pdf').addEventListener('click', () => {
    const nSchede = Math.min(8, Math.max(1, parseInt(document.getElementById('input-n-schede').value) || 3));
    const areaStampa = document.getElementById('area-stampa');
    areaStampa.innerHTML = '';

    // quantità diverse e non ripetute, tra 15 e 99 fagioli
    const usati = new Set();
    const schede = [];
    for (let i = 1; i <= nSchede; i++) {
      let q;
      do { q = rnd(15, 99); } while (usati.has(q));
      usati.add(q);
      schede.push(creaScheda(i, q));
    }

    // raggruppa 2 schede per pagina A4
    for (let i = 0; i < schede.length; i += 2) {
      const pagina = document.createElement('div');
      pagina.className = 'pagina';
      pagina.appendChild(schede[i]);
      if (schede[i + 1]) {
        const divisore = document.createElement('hr');
        divisore.className = 'divisore';
        pagina.appendChild(divisore);
        pagina.appendChild(schede[i + 1]);
      }
      areaStampa.appendChild(pagina);
    }

    // aspetta che l'immagine del logo sia pronta prima di stampare
    setTimeout(() => window.print(), 200);
  });

  /* ========== SCHEDA PDF: SOLO BICCHIERINI E FAGIOLI ========== */
  // Ogni riquadro ha fino a 9 bicchierini (una decina ciascuno) e fino a 9 fagioli sciolti:
  // numeri da 1 a 99. 16 riquadri per pagina, per fare meno fotocopie.

  const BF_PER_PAGINA = 16;
  const SVG_BICCHIERE = '<svg viewBox="0 0 54 70"><polygon points="4,8 50,8 44,64 10,64" fill="white" stroke="#5a3e1b" stroke-width="3.5"/><line x1="2" y1="8" x2="52" y2="8" stroke="#5a3e1b" stroke-width="4.5"/></svg>';
  const SVG_FAGIOLO = '<svg viewBox="0 0 60 42"><ellipse cx="30" cy="21" rx="27" ry="18" fill="#7a5a2a" stroke="#3a2a10" stroke-width="3.5"/><path d="M14 17 Q30 9 46 17" fill="none" stroke="#c9a46a" stroke-width="3" stroke-linecap="round"/></svg>';

  // quantità da 1 a 99, tutte diverse finché possibile, con decine e unità ben mescolate
  function quantitaBF(n) {
    const tutte = [];
    for (let q = 1; q <= 99; q++) tutte.push(q);
    for (let i = tutte.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tutte[i], tutte[j]] = [tutte[j], tutte[i]];
    }
    const out = [];
    while (out.length < n) out.push(...tutte.slice(0, n - out.length));
    return out;
  }

  function fagioliSparsi(container, n) {
    // area in mm: larghezza del riquadro meno i margini, altezza di .bf-fagioli
    const W = 84, H = 10.5, fw = 6, fh = 4.2;
    const placed = [];
    for (let i = 0; i < n; i++) {
      let x, y, tries = 0, ok;
      do {
        x = Math.random() * (W - fw);
        y = Math.random() * (H - fh);
        ok = placed.every(p => Math.abs(p.x - x) > fw + 1 || Math.abs(p.y - y) > fh + 0.8);
        tries++;
      } while (!ok && tries < 400);
      placed.push({ x, y });
      const span = document.createElement('span');
      span.innerHTML = SVG_FAGIOLO;
      const svg = span.firstChild;
      svg.style.left = x + 'mm';
      svg.style.top = y + 'mm';
      svg.style.transform = `rotate(${rnd(-35, 35)}deg)`;
      container.appendChild(svg);
    }
  }

  function riquadroBF(numero, q) {
    const d = Math.floor(q / 10), u = q % 10;
    const box = document.createElement('div');
    box.className = 'bf-box';
    box.innerHTML = `
      <div class="bf-bicchieri">${SVG_BICCHIERE.repeat(d)}</div>
      <div class="bf-fagioli"></div>
      <div class="bf-risposta"><span class="bf-num">${numero}.</span> Quanti fagioli in tutto? <span class="linea"></span></div>
    `;
    fagioliSparsi(box.querySelector('.bf-fagioli'), u);
    return box;
  }

  function testaBF(titolo) {
    return `<div class="bf-testa">
      <img src="${LOGO_URL}" alt="logo">
      <span class="t">${titolo}</span>
      <span class="leg">${SVG_BICCHIERE.replace('<svg ', '<svg style="width:5mm;height:6.5mm" ')} = 10 fagioli (una decina)</span>
    </div>`;
  }

  document.getElementById('btn-pdf-bf').addEventListener('click', () => {
    const nPagine = Math.min(5, Math.max(1, parseInt(document.getElementById('input-n-pagine-bf').value) || 1));
    const conSoluzioni = document.getElementById('check-soluzioni-bf').checked;
    const areaStampa = document.getElementById('area-stampa');
    areaStampa.innerHTML = '';
    const quantita = quantitaBF(nPagine * BF_PER_PAGINA);

    for (let p = 0; p < nPagine; p++) {
      const pagina = document.createElement('div');
      pagina.className = 'bf-pagina';
      pagina.innerHTML = testaBF('Il Contafagioli · Bicchierini e fagioli') + '<div class="bf-griglia"></div>';
      const griglia = pagina.querySelector('.bf-griglia');
      for (let i = 0; i < BF_PER_PAGINA; i++) {
        const k = p * BF_PER_PAGINA + i;
        griglia.appendChild(riquadroBF(k + 1, quantita[k]));
      }
      areaStampa.appendChild(pagina);
    }

    if (conSoluzioni) {
      const pagina = document.createElement('div');
      pagina.className = 'bf-pagina';
      pagina.innerHTML = testaBF('Soluzioni · Bicchierini e fagioli') +
        '<div class="bf-sol">' + quantita.map((q, i) => `${i + 1}. <b>${q}</b>`).join('<br>') + '</div>';
      areaStampa.appendChild(pagina);
    }

    setTimeout(() => window.print(), 200);
  });
</script>
</body>
</html>
