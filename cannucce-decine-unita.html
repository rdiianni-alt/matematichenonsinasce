<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cannucce delle Decine e Unità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Lexend:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --panel:#fbfcf7; --ink:#1f2a22; --muted:#5a6758; --line:#d3dac6;
  --accent:#1c7c90; --accent-ink:#ffffff; --soft:#dfe9c4; --warn:#a33a2a;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141915; --panel:#1c231e; --ink:#e6ece2; --muted:#9dab9c; --line:#303b32;
    --accent:#5bbfd2; --accent-ink:#0d1a1d; --soft:#2a3526; --warn:#ff8f7a;
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;padding:20px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none}
.logo img{width:60px;height:60px;object-fit:contain;border-radius:50%}
.logo span{font-size:14px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:32px;text-align:center;margin:0 0 10px;color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);margin:0 0 20px;font-size:14px}
.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{border:2px solid var(--accent);background:#fff;color:var(--accent);padding:12px 24px;border-radius:999px;font-family:var(--display);font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover{opacity:.9}
.game-container{display:flex;flex-direction:column;gap:20px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:1180/760;max-width:100%;background:#e3e1da}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px;border-top:1px solid var(--line);font-size:14px}
#score,#score-c{font-family:var(--display);font-weight:600;color:var(--ink)}
.caption{flex:1;margin:0;color:var(--ink);min-height:1.5em}
.top-controls{display:flex;gap:12px;margin-bottom:0}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input{font-family:var(--display);font-size:28px;font-weight:600;width:80px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.fld input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font-family:var(--body);font-size:14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:44px;transition:all .15s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
button:focus{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--display);font-weight:700;font-size:18px;padding:8px 28px;min-height:48px}
button.primary:hover{filter:brightness(1.08)}
.icon-btn{width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.msg{margin:0;color:var(--warn);font-size:14px;min-height:1.5em;font-weight:500}
.msg.correct{color:#2e9e5b}
.panel{display:none}
.panel.active{display:block}
.controls-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.counter-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.counter-box label{font-size:13px;font-weight:600;color:var(--ink)}
.counter-controls{display:flex;gap:8px;align-items:center}
.counter-controls button{width:44px;height:44px;padding:0;font-size:18px}
.counter-value{font-size:24px;font-weight:700;color:var(--accent);min-width:50px;text-align:center}
.target-display{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);text-align:center;margin:10px 0}
@media (min-width:900px){
  .game-container{flex-direction:row;align-items:flex-start}
  .stage{flex:1;min-width:0}
  #form-r{flex:0 0 auto;width:280px;height:fit-content}
  canvas{max-height:70vh;width:100%;height:auto}
}
@media (min-width:600px) and (max-width:899px){
  .game-container{gap:16px}
  canvas{max-height:60vh;width:100%;height:auto}
}
@media (max-width:599px){
  body{padding:12px}
  h1{font-size:24px}
  canvas{aspect-ratio:1180/760;max-height:50vh}
  .tabs{gap:6px}
  .tab-btn{padding:10px 16px;font-size:14px}
  button{font-size:13px;padding:8px 12px}
  .fld input{font-size:22px;width:70px}
  .top-controls{margin-bottom:12px}
}
</style>
</head>
<body>

<div class="wrap">
  <a class="logo" href="https://matematichenonsinasce.com/" target="_blank" rel="noopener">
    <img src="https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png" alt="Logo">
    <span>Matematiche non si nasce</span>
  </a>

  <h1>Cannucce delle Decine e Unità</h1>
  <p class="subtitle">Riconosci i numeri contando le cannucce sulla tovaglietta</p>


  <!-- RICONOSCI LE QUANTITÀ -->
  <section id="panel-recognize" class="panel active">
    <div class="game-container">
      <section class="stage">
        <canvas id="canvas-r"></canvas>
        <div class="bar">
          <span id="score-r">✅ 0 | ❌ 0</span>
          <p class="caption" id="caption-r">Conta le cannucce sulla tovaglietta.</p>
        </div>
      </section>

      <form id="form-r">
        <div class="top-controls">
          <button type="button" class="icon-btn" id="speak-r" title="Ascolta il numero">🔊</button>
          <button type="button" class="icon-btn" id="newnum-r" title="Nuovo numero">🎲</button>
        </div>
        <div class="row">
          <div class="fld">
            <label for="ans-r">Numero</label>
            <input id="ans-r" type="text" placeholder="0" inputmode="numeric" maxlength="2">
          </div>
          <button id="check-r" type="button" class="primary">Verifica</button>
          <button id="clear-r" type="button">Cancella</button>
        </div>
        <p class="msg" id="msg-r"></p>
      </form>
    </div>
  </section>

</div>

<script>
const W=1180, H=760;

/* ============ GRAPHICS ============ */
const SL=220, SWD=13, PAD=10, SS=3;
const Y0=184, Y1=426;
const unitSlot=i=>({x:552+(i%10)*34, y:Y0});
const tenSlot=j=>({x:130+(j%5)*84, y:j<5?Y0:Y1});

const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const rk=()=>Math.random()<.55?'nero':'avana';

function makeSprite(kind){
  const c=document.createElement('canvas');
  c.width=(SWD+PAD*2)*SS; c.height=(SL+PAD*2)*SS;
  const g=c.getContext('2d'); g.scale(SS,SS); g.translate(PAD+SWD/2,PAD+SL/2);
  const base=kind==='nero'?'#f6f6f2':'#f4f1e8';
  const stripe=kind==='nero'?'#2a2b2e':'#c7b28c';
  const shape=()=>{g.beginPath(); g.roundRect(-SWD/2,-SL/2,SWD,SL,2);};
  g.save(); g.shadowColor='rgba(30,40,15,.33)'; g.shadowBlur=3; g.shadowOffsetX=2.5; g.shadowOffsetY=3.5;
  shape(); g.fillStyle=base; g.fill(); g.restore();
  g.save(); shape(); g.clip();
  g.fillStyle=stripe;
  for(let y=-SL/2-30;y<SL/2+30;y+=22){
    g.beginPath(); g.moveTo(-SWD/2,y); g.lineTo(SWD/2,y-13); g.lineTo(SWD/2,y-13+10.5); g.lineTo(-SWD/2,y+10.5); g.closePath(); g.fill();
  }
  if(kind==='avana'){
    for(let k=0;k<160;k++){ g.fillStyle=`rgba(110,85,50,${rand(.15,.4)})`; g.beginPath(); g.arc(rand(-SWD/2,SWD/2),rand(-SL/2,SL/2),rand(.2,.5),0,7); g.fill(); }
  }
  const gr=g.createLinearGradient(-SWD/2,0,SWD/2,0);
  gr.addColorStop(0,'rgba(0,0,0,.30)'); gr.addColorStop(.32,'rgba(255,255,255,.28)');
  gr.addColorStop(.55,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.34)');
  g.fillStyle=gr; g.fillRect(-SWD/2,-SL/2,SWD,SL);
  g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(-SWD/2,-SL/2,SWD,1.3); g.fillRect(-SWD/2,SL/2-1.3,SWD,1.3);
  g.restore();
  return c;
}
const SPR={nero:makeSprite('nero'),avana:makeSprite('avana')};

function drawStraw(g,kind,x,y,rot){
  g.save(); g.translate(x,y); g.rotate(rot);
  g.drawImage(SPR[kind],-SWD/2-PAD,-SL/2-PAD,SWD+2*PAD,SL+2*PAD);
  g.restore();
}

function bundleItems(kinds){
  return kinds.map((k,i)=>{const back=i<5,c=i%5;
    return {kind:k,dx:(c-2)*13+(back?6.5:0),dy:(back?-5:4)+rand(-7,7),r:rand(-.025,.025)};});
}

function makeBundle(x,y){
  const kinds=Array.from({length:10},rk);
  return {x,y,rot:rand(-.02,.02),items:bundleItems(kinds),band:1,bandY:22,bandA:1,a:1};
}

function drawBand(g,b){
  if(b.band<=0||b.bandA<=0) return;
  g.save(); g.globalAlpha*=b.bandA;
  const y=b.bandY, x0=-40, x1=x0+80*b.band;
  g.lineCap='round'; g.lineJoin='round';
  const path=()=>{g.beginPath(); let first=true;
    for(let x=x0;x<x1;x+=4){const yy=y+3*(1-(x/40)**2); first?g.moveTo(x,yy):g.lineTo(x,yy); first=false;}
    g.lineTo(x1,y+3*(1-(x1/40)**2));};
  path(); g.strokeStyle='rgba(20,60,50,.35)'; g.lineWidth=7; g.stroke();
  path(); g.strokeStyle='#4db8a7'; g.lineWidth=4.6; g.stroke();
  g.translate(0,-1.2); path(); g.strokeStyle='rgba(225,255,248,.75)'; g.lineWidth=1.2; g.stroke();
  g.restore();
}

function drawBundle(g,b){
  g.save(); g.globalAlpha=b.a; g.translate(b.x,b.y); g.rotate(b.rot);
  for(const it of b.items){
    g.save(); g.translate(it.dx,it.dy); g.rotate(it.r);
    g.drawImage(SPR[it.kind],-SWD/2-PAD,-SL/2-PAD,SWD+2*PAD,SL+2*PAD); g.restore();
  }
  drawBand(g,b);
  g.restore();
}

function roundRect(g,x,y,w,h,r,fill){g.beginPath(); g.roundRect(x,y,w,h,r); g.fillStyle=fill; g.fill();}

function drawStatic(g){
  g.fillStyle='#e3e1da'; g.fillRect(0,0,W,H);
  const vg=g.createRadialGradient(W/2,H/2,200,W/2,H/2,820);
  vg.addColorStop(0,'rgba(255,255,255,.18)'); vg.addColorStop(1,'rgba(90,80,60,.14)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  g.save(); g.shadowColor='rgba(50,45,30,.22)'; g.shadowBlur=14; g.shadowOffsetY=5;
  roundRect(g,30,14,882,688,8,'#fbfbf6'); g.restore();
  g.fillStyle='#1f8aa3'; g.font='700 25px "Baloo 2", "Trebuchet MS", sans-serif'; g.textBaseline='middle';
  g.fillText('ABACO  DECINE  E  UNITÀ',58,39);
  roundRect(g,58,62,466,500,3,'#b7d263');
  roundRect(g,530,62,352,500,3,'#d2e39e');
  roundRect(g,58,566,466,40,3,'#a4c34a');
  roundRect(g,530,566,352,40,3,'#bdd57c');
  roundRect(g,58,610,466,68,3,'#c6dd84');
  roundRect(g,530,610,352,68,3,'#dbe9b3');
  g.fillStyle='#2b3818'; g.font='500 25px "Baloo 2", "Trebuchet MS", sans-serif'; g.textAlign='center';
  g.fillText('decine',291,587); g.fillText('unità',706,587);
  g.textAlign='left';
  g.save(); g.beginPath(); g.roundRect(30,14,882,688,8); g.clip();
  const gl=g.createLinearGradient(100,0,700,700);
  gl.addColorStop(0,'rgba(255,255,255,0)'); gl.addColorStop(.42,'rgba(255,255,255,0)');
  gl.addColorStop(.47,'rgba(255,255,255,.16)'); gl.addColorStop(.52,'rgba(255,255,255,0)');
  gl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gl; g.fillRect(30,14,882,688); g.restore();
}

/* ============ GAME 1: RECOGNIZE ============ */
const cvR=document.getElementById('canvas-r');
const ctxR=cvR.getContext('2d');
let scaleR=1;
const stateR={tens:0,units:0,correct:0,wrong:0,bundles:[],straws:[]};

function resizeR(){
  const w=cvR.clientWidth||cvR.parentElement.clientWidth;
  if(!w) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cvR.width=Math.round(w*dpr);
  cvR.height=Math.round(w*H/W*dpr);
  scaleR=cvR.width/W;
}

function newNumR(){
  stateR.tens=Math.floor(Math.random()*10);
  stateR.units=Math.floor(Math.random()*10);
  stateR.bundles=[];
  stateR.straws=[];
  for(let j=0;j<stateR.tens;j++){
    const sl=tenSlot(j);
    stateR.bundles.push({x:sl.x,y:sl.y,rot:0,items:bundleItems(Array(10).fill('nero')),band:1,bandY:22,bandA:1,a:1});
  }
  for(let i=0;i<stateR.units;i++){
    const sl=unitSlot(i);
    stateR.straws.push({x:sl.x,y:sl.y,rot:0,kind:'nero'});
  }
  document.getElementById('ans-r').value='';
  document.getElementById('msg-r').textContent='';
}

function drawR(){
  resizeR();
  ctxR.setTransform(scaleR,0,0,scaleR,0,0);
  drawStatic(ctxR);
  stateR.bundles.forEach(b=>drawBundle(ctxR,b));
  stateR.straws.forEach(s=>drawStraw(ctxR,s.kind,s.x,s.y,s.rot));
  requestAnimationFrame(drawR);
}

document.getElementById('check-r').addEventListener('click',()=>{
  const ans=parseInt(document.getElementById('ans-r').value,10);
  const target=stateR.tens*10+stateR.units;
  const msg=document.getElementById('msg-r');
  if(isNaN(ans)){
    msg.textContent='Scrivi un numero.'; return;
  }
  if(ans===target){
    stateR.correct++;
    msg.textContent='✅ Esatto!'; msg.className='msg correct';
    setTimeout(newNumR,1400);
  } else {
    stateR.wrong++;
    msg.textContent=`❌ Non esatto. Il numero era ${target}.`;
  }
  document.getElementById('score-r').textContent=`✅ ${stateR.correct} | ❌ ${stateR.wrong}`;
});

document.getElementById('newnum-r').addEventListener('click',newNumR);
document.getElementById('clear-r').addEventListener('click',()=>{document.getElementById('ans-r').value='';});
document.getElementById('ans-r').addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('check-r').click();});
document.getElementById('speak-r').addEventListener('click',()=>{
  const num=stateR.tens*10+stateR.units;
  if('speechSynthesis' in window){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(num)); u.lang='it-IT'; speechSynthesis.speak(u);}
});


/* ============ INIT ============ */
window.addEventListener('resize',resizeR);
newNumR();
drawR();
</script>

</body>
</html>

</body></html>
