<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La macchina delle tabelline del maestro Paolini</title>
<style>
  :root{
    --red:#e10600;
    --red-dark:#a80400;
    --wood:#c9a06a;
    --wood-dark:#8a6239;
    --text:#2b2a28;
    --text-secondary:#5f5e5a;
    --green:#2e8b3d;
    --green-dark:#1f6229;
    --gold:#f0b429;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#ffffff;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 48px;
  }
  .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-decoration:none;
    margin-bottom:8px;
  }
  .logo img{width:60px;height:60px;object-fit:contain;border-radius:50%;}
  .logo span{font-size:14px;color:var(--text-secondary);}

  h1{
    font-size:clamp(20px,4vw,28px);
    text-align:center;
    margin:6px 0 4px;
    color:var(--red);
  }
  .subtitle{
    font-size:14px;
    color:var(--text-secondary);
    text-align:center;
    margin:0 0 20px;
    max-width:480px;
  }

  .table-label{
    font-size:18px;
    font-weight:700;
    margin-bottom:10px;
    color:var(--text);
  }

  .machine-wrap{
    position:relative;
    display:flex;
    align-items:flex-end;
    gap:10px;
  }

  .machine{
    position:relative;
    width:min(88vw,360px);
    transition:opacity .18s ease;
  }
  .machine.swap{ animation:swapFade .35s ease; }
  @keyframes swapFade{
    0%{opacity:1; transform:scale(1);}
    35%{opacity:.25; transform:scale(.96);}
    100%{opacity:1; transform:scale(1);}
  }

  svg{width:100%;height:auto;display:block;}

  .frame-outer{fill:var(--wood-dark);}
  .frame-mid{fill:var(--wood);}
  .frame-red{fill:var(--red);}

  .window{
    fill:#ffffff;
    stroke:var(--red-dark);
    stroke-width:1.5;
    transition:fill .15s ease, filter .15s ease;
  }
  .window.active{
    fill:var(--gold);
  }
  .dot{
    fill:var(--text-secondary);
    pointer-events:none;
  }
  .dot.active-dot{
    fill:var(--red-dark);
  }

  .pivot{fill:var(--gold);stroke:var(--wood-dark);stroke-width:2;}

  .pallino-bg{fill:#ffffff;stroke:var(--red-dark);stroke-width:2;}
  .pallino-text{
    font-size:24px;
    font-weight:800;
    fill:var(--red);
    text-anchor:middle;
    dominant-baseline:middle;
    transition:opacity .12s ease;
  }
  .pallino-text.hidden{
    opacity:0;
  }


  /* leva */
  .lever{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
    padding-bottom:18px;
    -webkit-tap-highlight-color:transparent;
  }
  .lever-track{
    width:22px;
    height:150px;
    background:linear-gradient(180deg,#3a3a3a,#1c1c1c);
    border-radius:11px;
    position:relative;
    box-shadow:inset 0 0 4px rgba(0,0,0,.5);
  }
  .lever-knob{
    position:absolute;
    left:50%;
    top:6px;
    transform:translateX(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4fbf5f, var(--green) 55%, var(--green-dark));
    box-shadow:0 3px 6px rgba(0,0,0,.4);
    transition:top .28s cubic-bezier(.4,1.6,.5,1);
  }
  .lever-knob.pulled{ top:106px; }
  .lever-label{
    font-size:12px;
    color:var(--text-secondary);
    text-align:center;
    max-width:70px;
  }

  .expression{
    margin-top:22px;
    font-size:clamp(22px,5vw,30px);
    font-weight:800;
    color:var(--text);
    background:#fdf3e3;
    border:2px dashed var(--wood);
    border-radius:12px;
    padding:10px 24px;
  }

  .selector{
    margin-top:32px;
    text-align:center;
    max-width:640px;
    width:100%;
  }
  .selector p{
    font-size:14px;
    color:var(--text-secondary);
    margin:0 0 10px;
  }
  .wheel-buttons{
    display:flex;
    flex-wrap:nowrap;
    justify-content:flex-start;
    gap:8px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:4px 4px 10px;
    margin:0 auto;
    max-width:100%;
    width:fit-content;
  }
  .wheel-btn{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:50%;
    border:3px solid var(--wood-dark);
    background:radial-gradient(circle at 35% 30%, #e6c896, var(--wood) 60%, var(--wood-dark));
    color:#3b2a15;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .wheel-btn:hover{transform:translateY(-2px);}
  .wheel-btn.selected{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(225,6,0,.25);
    transform:translateY(-2px);
  }
</style>
</head>
<body>

  <a class="logo" href="https://matematichenonsinasce.com/" target="_blank" rel="noopener">
    <img src="https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png" alt="Matematiche non si nasce">
    <span>Matematiche non si nasce</span>
  </a>

  <h1>La macchina delle tabelline del maestro Paolini</h1>
  <p class="subtitle">Scegli la ruota da inserire, poi tira la leva verde per far scattare la tabellina, una moltiplicazione alla volta.</p>

  <div class="table-label" id="tableLabel">Tabellina del 2</div>

  <div class="machine-wrap">
    <div class="machine" id="machine">
      <svg viewBox="0 0 400 400" id="svg"></svg>
    </div>
    <div class="lever" id="lever">
      <div class="lever-track">
        <div class="lever-knob" id="leverKnob"></div>
      </div>
      <div class="lever-label">tira per far scattare la ruota</div>
    </div>
  </div>

  <div class="expression" id="expression">2 × 1 = 2</div>

  <div class="selector">
    <p>Il cassetto delle ruote — scegli quale inserire:</p>
    <div class="wheel-buttons" id="wheelButtons"></div>
  </div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('svg');
  const cx = 200, cyArc = 292, rInner = 74, rOuter = 152;
  const startAngle = 180, totalAngle = 180, gapDeg = 1.6;
  const N = 10;

  let currentTable = 2;
  let currentStep = 1;

  function polar(cx,cy,r,angleDeg){
    const rad = angleDeg * Math.PI/180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // --- static frame ---
  svg.appendChild(el('rect', {x:8,y:8,width:384,height:384,rx:22,class:'frame-outer'}));
  svg.appendChild(el('rect', {x:18,y:18,width:364,height:364,rx:16,class:'frame-mid'}));
  svg.appendChild(el('rect', {x:30,y:30,width:340,height:340,rx:12,class:'frame-red'}));

  // --- windows (fan) ---
  // Ogni finestrella, se "svelata", mostra sempre lo stesso numero di pallini:
  // tanti quanti indica la ruota inserita (currentTable). Le finestrelle non
  // ancora raggiunte dalla leva restano completamente vuote.
  const windowEls = [];
  const windowDots = []; // windowDots[i] = array di 10 elementi <circle>, uno per slot
  const COLS = 5, ROWS = 2, SPACING = 7.5;

  for(let i=0;i<N;i++){
    const a0 = startAngle + i*(totalAngle/N) + gapDeg/2;
    const a1 = startAngle + (i+1)*(totalAngle/N) - gapDeg/2;
    const p1 = polar(cx,cyArc,rInner,a0);
    const p2 = polar(cx,cyArc,rOuter,a0);
    const p3 = polar(cx,cyArc,rOuter,a1);
    const p4 = polar(cx,cyArc,rInner,a1);
    const pts = [p1,p2,p3,p4].map(p=>p.join(',')).join(' ');
    const win = el('polygon', {points:pts, class:'window'});
    win.dataset.index = i+1;
    svg.appendChild(win);
    windowEls.push(win);

    const midA = (a0+a1)/2;
    const midR = (rInner+rOuter)/2;
    const [dx,dy] = polar(cx,cyArc,midR,midA);
    const rad = midA*Math.PI/180;
    // asse radiale (verso l'esterno, dal centro) e asse tangenziale (perpendicolare)
    const radX = Math.cos(rad), radY = Math.sin(rad);
    const tanX = -Math.sin(rad), tanY = Math.cos(rad);

    // griglia fissa di 10 slot: 5 lungo il raggio (come un raggio della ruota,
    // così ruotano insieme alla finestrella) e 2 righe affiancate tangenzialmente
    const slots = [];
    for(let s=0;s<COLS*ROWS;s++){
      const row = Math.floor(s/COLS);
      const col = s%COLS;
      const radOffset = (col - (COLS-1)/2) * SPACING;
      const tanOffset = (row - (ROWS-1)/2) * SPACING;
      const wx = dx + radOffset*radX + tanOffset*tanX;
      const wy = dy + radOffset*radY + tanOffset*tanY;
      const dot = el('circle', {cx:wx, cy:wy, r:2.4, class:'dot'});
      dot.style.display = 'none';
      svg.appendChild(dot);
      slots.push(dot);
    }
    windowDots.push(slots);
  }

  // pivot
  svg.appendChild(el('circle', {cx:cx, cy:cyArc, r:13, class:'pivot'}));

  // pallino (result window)
  const pGroup = el('g', {class:'pallino-group', id:'pallinoGroup'});
  pGroup.appendChild(el('circle', {cx:328, cy:326, r:26, class:'pallino-bg'}));
  const pText = el('text', {x:328, y:329, class:'pallino-text', id:'pallinoText'});
  pText.textContent = '2';
  pGroup.appendChild(pText);
  svg.appendChild(pGroup);

  function render(){
    document.getElementById('tableLabel').textContent = 'Tabellina del ' + currentTable;

    windowEls.forEach((w,i)=>{
      const idx = i+1;
      const rivelata = idx <= currentStep;
      w.classList.toggle('active', idx === currentStep);

      windowDots[i].forEach((dot, slot)=>{
        const mostra = rivelata && slot < currentTable;
        dot.style.display = mostra ? '' : 'none';
        dot.classList.toggle('active-dot', mostra && idx === currentStep);
      });
    });

    const result = currentTable * currentStep;
    document.getElementById('pallinoText').textContent = result;
    document.getElementById('expression').textContent = currentTable + ' × ' + currentStep + ' = ' + result;
  }

  function advance(){
    const knob = document.getElementById('leverKnob');
    const pText = document.getElementById('pallinoText');

    // abbassando la leva il numero sparisce (diventa bianco)
    pText.classList.add('hidden');
    knob.classList.add('pulled');

    // quando la leva risale, la ruota è girata: si vede il nuovo numero
    setTimeout(()=>{
      knob.classList.remove('pulled');
      currentStep = currentStep % N + 1;
      render();
      pText.classList.remove('hidden');
    }, 280);
  }

  document.getElementById('lever').addEventListener('click', advance);

  // wheel selector
  const wheelButtons = document.getElementById('wheelButtons');
  for(let n=1;n<=10;n++){
    const b = document.createElement('button');
    b.className = 'wheel-btn' + (n===currentTable ? ' selected':'');
    b.textContent = n;
    b.title = 'Inserisci la ruota del ' + n;
    b.addEventListener('click', ()=>{
      currentTable = n;
      currentStep = 1;
      document.querySelectorAll('.wheel-btn').forEach(el=>el.classList.remove('selected'));
      b.classList.add('selected');
      const machine = document.getElementById('machine');
      machine.classList.remove('swap');
      void machine.offsetWidth;
      machine.classList.add('swap');
      render();
    });
    wheelButtons.appendChild(b);
  }

  render();
})();
</script>
</body>
</html>
