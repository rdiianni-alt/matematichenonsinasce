<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #2b2b2b; }
body { min-height: 100vh; }

.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #2b2b2b; padding-top: clamp(6px, 1.5vw, 12px); }
.logo img { width: clamp(44px, 8vmin, 64px); height: clamp(44px, 8vmin, 64px); border-radius: 50%; object-fit: contain; }
.logo span { font-size: clamp(0.62rem, 1.4vmin, 0.8rem); font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }

#app { max-width: 1200px; margin: 0 auto; padding: clamp(8px, 2vw, 20px); }

.titolo { text-align: center; font-size: clamp(1.2rem, 4vmin, 1.8rem); margin: clamp(4px, 1vw, 8px) 0 4px; color: #2b2b2b; }
.sub { text-align: center; font-size: clamp(0.8rem, 1.8vmin, 0.95rem); color: #6a6a6a; margin: 0 0 clamp(10px, 2vw, 16px); }
.etichetta { font-size: clamp(0.7rem, 1.6vmin, 0.85rem); text-transform: uppercase; letter-spacing: 0.06em; color: #6a6a6a; margin: 0; font-weight: bold; }

.btn { background: #ffffff; border: 2px solid #d6d6d6; border-radius: 14px; padding: clamp(8px, 1.4vmin, 12px) clamp(10px, 2vw, 18px); font-family: inherit; font-size: clamp(0.75rem, 1.7vmin, 0.95rem); font-weight: bold; color: #2b2b2b; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(0.96); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.piccolo { padding: 6px 12px; min-height: 36px; font-size: clamp(0.7rem, 1.5vmin, 0.85rem); }
.btn.attivo { background: #dff1ff; border-color: #2d9be0; }
.btn.grande { min-height: 58px; font-size: clamp(1rem, 2.6vmin, 1.25rem); padding: 12px 28px; min-width: 160px; }
.btn.costruisci { background: #ffe9b8; border-color: #ffb020; }
.btn.continua { background: #d6ecff; border-color: #2d9be0; }
.btn.avanti { background: #e8dcff; border-color: #8b62d9; }
.btn.giusta { background: #2fb47a; border-color: #2fb47a; color: #ffffff; }
.btn.sbagliata { background: #ef6b6b; border-color: #ef6b6b; color: #ffffff; }
.btn.pdf { background: #ffe3d0; border-color: #f47c2c; }

.riga { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.pannello { background: #ffffff; border: 2px solid #efefef; border-radius: 18px; padding: clamp(10px, 1.5vw, 14px); display: flex; flex-direction: column; gap: 10px; margin-bottom: clamp(10px, 2vw, 16px); }

.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(150px, 22vw, 220px), 1fr)); gap: clamp(8px, 1.6vw, 16px); }
.carta-gioco { border: 3px solid; border-radius: 18px; padding: clamp(10px, 2vw, 16px); text-align: left; cursor: pointer; font-family: inherit; color: #2b2b2b; display: flex; flex-direction: column; gap: 6px; min-height: clamp(84px, 14vh, 110px); }
.carta-gioco:hover { transform: translateY(-2px); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08); }
.carta-gioco .nome { font-size: clamp(0.8rem, 1.8vmin, 0.98rem); font-weight: bold; }
.carta-gioco .desc { font-size: clamp(0.7rem, 1.5vmin, 0.82rem); color: #555; }

#gioco { display: grid; gap: clamp(8px, 1.5vw, 16px); grid-template-columns: 1fr; grid-template-areas: "head" "carta" "mat" "zona"; }
#g-head { grid-area: head; }
#g-carta { grid-area: carta; }
.mat-wrap { grid-area: mat; display: flex; justify-content: center; }
#g-zona { grid-area: zona; }
#mat { display: block; width: 100%; aspect-ratio: 1180 / 760; background: #e3e1da; border-radius: 14px; border: 2px solid #efefef; }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #gioco { grid-template-columns: minmax(300px, 0.8fr) 1.7fr; grid-template-areas: "head head" "carta mat" "zona mat"; align-items: start; }
  #mat { width: min(100%, calc((100vh - 170px) * 1180 / 760)); }
}

.tessera { background: #ffffff; border: 6px solid; border-radius: 18px; text-align: center; padding: clamp(6px, 1.5vh, 12px) 12px; width: 100%; max-width: 440px; margin: 0 auto; }
.tessera .op { font-size: clamp(2.2rem, min(9vw, 9vh), 4.2rem); font-weight: bold; line-height: 1.1; }
.tessera .tip { font-size: clamp(0.75rem, 1.6vmin, 0.9rem); color: #555; margin-top: 6px; line-height: 1.35; }

.zona { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.azioni { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.5vw, 14px); justify-content: center; }
.pausa-box { background: #fff8e6; border: 3px solid #ffb020; border-radius: 16px; padding: 10px 14px; max-width: 560px; width: 100%; }
.titolo-p { font-size: 0.8rem; text-transform: uppercase; font-weight: bold; color: #b26a00; letter-spacing: 0.05em; }
.testo-p { font-size: clamp(0.9rem, 2vmin, 1.05rem); margin-top: 4px; line-height: 1.4; }
.messaggio { font-size: clamp(0.95rem, 2.2vmin, 1.1rem); font-weight: bold; min-height: 1.4em; }
.messaggio.ok { color: #23875b; }
.messaggio.ko { color: #d63b3b; }
.strategia { font-size: clamp(0.8rem, 1.7vmin, 0.92rem); color: #555; max-width: 560px; margin: 0; line-height: 1.4; }
.risposta { font-size: clamp(1.6rem, 4vmin, 2.2rem); font-weight: bold; min-height: 48px; border-bottom: 3px solid #2b2b2b; width: 150px; line-height: 1.2; }
.tastiera { display: grid; grid-template-columns: repeat(3, minmax(56px, 1fr)); gap: 8px; width: min(100%, 300px); }
.tastiera button { background: #ffffff; border: 2px solid #d6d6d6; border-radius: 14px; font-family: inherit; font-size: clamp(1.1rem, 3vmin, 1.5rem); font-weight: bold; min-height: 52px; cursor: pointer; color: #2b2b2b; }
.tastiera button:hover { background: #f3f3f3; }
.tastiera button.azione { font-size: 0.8rem; text-transform: uppercase; }
.tastiera button.verifica { background: #2fb47a; border-color: #2fb47a; color: #ffffff; }
.opzioni { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; width: 100%; max-width: 600px; }
.opzioni .btn { text-align: left; }

.fine { text-align: center; padding-top: 10px; }
.medaglia { width: clamp(150px, 30vmin, 210px); height: clamp(150px, 30vmin, 210px); border-radius: 50%; border: 10px solid #ffb020; background: #fff8e6; margin: 10px auto 14px; display: flex; align-items: center; justify-content: center; }
.medaglia span { font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; color: #b26a00; text-align: center; padding: 0 10px; }
.fine p { margin: 6px 0; }
</style>

<div id="app">
  <div id="menu"></div>

    <div id="g-head"></div>
    <div id="g-carta"></div>

    <div id="g-zona"></div>
  </div>

</div>

<script>
/* ================= STRATEGIE E TESSERE ================= */
const STR = {
  uno:   { nome: 'Aggiungi o togli 1', colore: '#ffb020', fondo: '#fff1cc', tip: 'Aggiungere 1 significa andare al numero successivo; togliere 1 significa tornare al numero precedente.' },
  zero:  { nome: 'Aggiungi o togli 0', colore: '#2fb47a', fondo: '#d6f5e6', tip: 'Aggiungere o togliere 0 non cambia il numero.' },
  due:   { nome: 'Aggiungi o togli 2', colore: '#2d9be0', fondo: '#d6ecff', tip: 'Aggiungere 2 significa andare avanti di due; togliere 2 significa tornare indietro di due.' },
  doppi: { nome: 'Raddoppiamento', colore: '#ec5f86', fondo: '#ffdbe6', tip: 'Un doppio è la somma di due numeri uguali. Dai doppi si arriva ai numeri vicini.' },
  c5:    { nome: 'Combinazioni con il 5', colore: '#8b62d9', fondo: '#e8dcff', tip: 'Ci sono coppie di numeri che fanno 5: 1 e 4, 2 e 3, e così via.' },
  c6:    { nome: 'Combinazioni con il 6', colore: '#18a8a6', fondo: '#d0f4f2', tip: 'Ci sono coppie di numeri che fanno 6: 1 e 5, 2 e 4, 3 e 3.' },
  c7:    { nome: 'Combinazioni con il 7', colore: '#7cb82f', fondo: '#e6f5c9', tip: 'Ci sono coppie di numeri che fanno 7: 1 e 6, 2 e 5, 3 e 4.' },
  c8:    { nome: 'Combinazioni con il 8', colore: '#f47c2c', fondo: '#ffe3d0', tip: 'Ci sono coppie di numeri che fanno 8: 1 e 7, 2 e 6, 3 e 5, 4 e 4.' },
  c9:    { nome: 'Combinazioni con il 9', colore: '#4f6fe0', fondo: '#dfe5ff', tip: 'Ci sono coppie di numeri che fanno 9: 1 e 8, 2 e 7, 3 e 6, 4 e 5.' },
  p5:    { nome: 'Passaggio al 5 e ritorno al 5', colore: '#e6a817', fondo: '#fff3d4', tip: 'Si fa una tappa al 5 (o al 10) e poi si aggiunge quello che resta.' },
  pd:    { nome: 'Passaggio alla decina e ritorno alla decina', colore: '#14a0c8', fondo: '#d2f1fb', tip: 'Si arriva alla decina (10) e poi si aggiunge quello che resta.' }
};

function f(a, op, b, s, step) {
  const res = op === '+' ? a + b : a - b;
  return { a, op, b, res, s, step: step || 0, key: a + op + b };
}
function combN(n, s) {
  const r = [];
  for (let a = 0; a <= n; a++) { r.push(f(a, '+', n - a, s)); r.push(f(n, '-', a, s)); }
  return r;
}
function uniq(arr) {
  const seen = new Set();
  return arr.filter(c => { if (seen.has(c.key)) return false; seen.add(c.key); return true; });
}
const P5 = [[6,8],[5,6],[7,5],[7,8],[9,6],[3,4],[7,4],[1,6],[6,2],[7,6],[7,2],[2,6],[6,7],[8,7]];
const PD = [[6,8],[7,8],[8,6],[8,7],[9,6],[9,5],[3,8],[2,9],[9,8],[9,7],[5,9],[5,7],[14,4],[6,9],[12,7],[5,15],[8,2],[8,4],[2,15],[8,5],[11,3],[4,13],[2,11],[11,5]];

const GIOCHI = [
  { id: 'uno', nome: 'Aggiungi o togli 1', desc: 'Il numero successivo o precedente', col: STR.uno.colore, fondo: STR.uno.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', 1, 'uno')); for (let a = 1; a <= 10; a++) r.push(f(a, '-', 1, 'uno')); return r; } },
  { id: 'zero', nome: 'Aggiungi o togli 0', desc: 'Il numero non cambia', col: STR.zero.colore, fondo: STR.zero.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) { r.push(f(a, '+', 0, 'zero')); r.push(f(a, '-', 0, 'zero')); } return r; } },
  { id: 'due', nome: 'Aggiungi o togli 2', desc: 'Due in avanti o indietro', col: STR.due.colore, fondo: STR.due.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', 2, 'due')); for (let a = 2; a <= 10; a++) r.push(f(a, '-', 2, 'due')); return r; } },
  { id: 'doppi', nome: 'Raddoppiamento', desc: 'Il doppio e i numeri vicini', col: STR.doppi.colore, fondo: STR.doppi.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', a, 'doppi')); for (let a = 1; a <= 9; a++) r.push(f(2 * a, '-', a, 'doppi')); return r; } },
  { id: 'c5', nome: 'Combinazioni con il 5', desc: 'Coppie che fanno 5', col: STR.c5.colore, fondo: STR.c5.fondo, deck: () => combN(5, 'c5') },
  { id: 'c6', nome: 'Combinazioni con il 6', desc: 'Coppie che fanno 6', col: STR.c6.colore, fondo: STR.c6.fondo, deck: () => combN(6, 'c6') },
  { id: 'c7', nome: 'Combinazioni con il 7', desc: 'Coppie che fanno 7', col: STR.c7.colore, fondo: STR.c7.fondo, deck: () => combN(7, 'c7') },
  { id: 'c8', nome: 'Combinazioni con il 8', desc: 'Coppie che fanno 8', col: STR.c8.colore, fondo: STR.c8.fondo, deck: () => combN(8, 'c8') },
  { id: 'c9', nome: 'Combinazioni con il 9', desc: 'Coppie che fanno 9', col: STR.c9.colore, fondo: STR.c9.fondo, deck: () => combN(9, 'c9') },
  { id: 'p5', nome: 'Passaggio al 5 e ritorno al 5', desc: 'Tappa al 5, poi si prosegue', col: STR.p5.colore, fondo: STR.p5.fondo,
    deck: () => P5.map(([a, b]) => f(a, '+', b, 'p5', 5)) },
  { id: 'pd', nome: 'Passaggio alla decina e ritorno alla decina', desc: 'Tappa alla decina, poi si prosegue', col: STR.pd.colore, fondo: STR.pd.fondo,
    deck: () => PD.map(([a, b]) => f(a, '+', b, 'pd', 10)) },
  { id: 'misto', nome: 'Riepilogo', desc: 'Tutte le combinazioni, in ordine casuale', col: '#7a7a7a', fondo: '#ececec', misto: true,
    deck: () => uniq([].concat(...GIOCHI.filter(g => !g.misto).map(g => g.deck()))) }
];

/* ================= TOVAGLIETTA (motore delle cannucce) ================= */
const Tov = (() => {
  const W = 1180, H = 760;
  const SL = 220, SWD = 13, PAD = 10, SS = 3;
  const Y0 = 184, Y1 = 426;
  const unitSlot = i => ({ x: 552 + (i % 10) * 34, y: i < 10 ? Y0 : Y1 });
  const tenSlot = j => ({ x: 130 + (j % 5) * 84, y: j < 5 ? Y0 : Y1 });
  const BOXL = { x: 1048, y: 470 }, BOXB = { x: 1048, y: 196 };
  const HOME = { L: { x: 330, y: 728 }, R: { x: 770, y: 728 } };
  const UNIT_C = 707;
  const ABORT = { abort: true };
  /* colori delle cannucce nella riga delle unità: le prime 5 di un tipo, le successive 5 dell'altro */
  const PAL = { nero: ['#f6f6f2', '#2a2b2e'], avana: ['#f4f1e8', '#c7b28c'] };
  const unitKind = i => (i % 10) < 5 ? 'nero' : 'avana';

  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lin = t => t;
  const rk = () => Math.random() < .55 ? 'nero' : 'avana';
  const removeFrom = (arr, o) => { const i = arr.indexOf(o); if (i >= 0) arr.splice(i, 1); };
  const toTop = (arr, o) => { removeFrom(arr, o); arr.push(o); };
  const roundRect = (g, x, y, w, h, r, fill) => { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill(); };

  function makeSprite(kind) {
    const c = document.createElement('canvas');
    c.width = (SWD + PAD * 2) * SS; c.height = (SL + PAD * 2) * SS;
    const g = c.getContext('2d'); g.scale(SS, SS); g.translate(PAD + SWD / 2, PAD + SL / 2);
    const [base, stripe] = PAL[kind] || PAL.avana;
    const shape = () => { g.beginPath(); g.roundRect(-SWD / 2, -SL / 2, SWD, SL, 2); };
    g.save(); g.shadowColor = 'rgba(30,40,15,.33)'; g.shadowBlur = 3; g.shadowOffsetX = 2.5; g.shadowOffsetY = 3.5;
    shape(); g.fillStyle = base; g.fill(); g.restore();
    g.save(); shape(); g.clip();
    g.fillStyle = stripe;
    for (let y = -SL / 2 - 30; y < SL / 2 + 30; y += 22) {
      g.beginPath(); g.moveTo(-SWD / 2, y); g.lineTo(SWD / 2, y - 13); g.lineTo(SWD / 2, y - 13 + 10.5); g.lineTo(-SWD / 2, y + 10.5); g.closePath(); g.fill();
    }
    if (kind === 'avana') {
      for (let k = 0; k < 160; k++) { g.fillStyle = `rgba(110,85,50,${rand(.15, .4)})`; g.beginPath(); g.arc(rand(-SWD / 2, SWD / 2), rand(-SL / 2, SL / 2), rand(.2, .5), 0, 7); g.fill(); }
    }
    const gr = g.createLinearGradient(-SWD / 2, 0, SWD / 2, 0);
    gr.addColorStop(0, 'rgba(0,0,0,.30)'); gr.addColorStop(.32, 'rgba(255,255,255,.28)');
    gr.addColorStop(.55, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.34)');
    g.fillStyle = gr; g.fillRect(-SWD / 2, -SL / 2, SWD, SL);
    g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(-SWD / 2, -SL / 2, SWD, 1.3); g.fillRect(-SWD / 2, SL / 2 - 1.3, SWD, 1.3);
    g.restore();
    return c;
  }
  const SPR = { nero: makeSprite('nero'), avana: makeSprite('avana') };

  function drawStraw(g, kind, x, y, rot, alpha = 1, sc = 1) {
    g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(rot); if (sc !== 1) g.scale(sc, sc);
    g.drawImage(SPR[kind], -SWD / 2 - PAD, -SL / 2 - PAD, SWD + 2 * PAD, SL + 2 * PAD);
    g.restore();
  }
  function bundleItems(kinds) {
    return kinds.map((k, i) => { const back = i < 5, c = i % 5;
      return { kind: k, dx: (c - 2) * 13 + (back ? 6.5 : 0), dy: (back ? -5 : 4) + rand(-7, 7), r: rand(-.025, .025) }; });
  }
  function makeBundle(x, y, band = 1) {
    const kinds = Array.from({ length: 10 }, rk);
    return { x, y, rot: rand(-.02, .02), items: bundleItems(kinds), band, bandY: 22, bandA: 1, a: 1, lift: 0 };
  }
  function drawBand(g, b) {
    if (b.band <= 0 || b.bandA <= 0) return;
    g.save(); g.globalAlpha *= b.bandA;
    const y = b.bandY, x0 = -40, x1 = x0 + 80 * b.band;
    g.lineCap = 'round'; g.lineJoin = 'round';
    const path = () => { g.beginPath(); let first = true;
      for (let x = x0; x < x1; x += 4) { const yy = y + 3 * (1 - (x / 40) ** 2); first ? g.moveTo(x, yy) : g.lineTo(x, yy); first = false; }
      g.lineTo(x1, y + 3 * (1 - (x1 / 40) ** 2)); };
    path(); g.strokeStyle = 'rgba(20,60,50,.35)'; g.lineWidth = 7; g.stroke();
    path(); g.strokeStyle = '#4db8a7'; g.lineWidth = 4.6; g.stroke();
    g.translate(0, -1.2); path(); g.strokeStyle = 'rgba(225,255,248,.75)'; g.lineWidth = 1.2; g.stroke();
    g.restore();
  }
  function drawBundle(g, b) {
    g.save(); g.globalAlpha = b.a; g.translate(b.x, b.y); g.rotate(b.rot);
    const sc = 1 + .05 * (b.lift || 0); if (sc !== 1) g.scale(sc, sc);
    for (const it of b.items) {
      g.save(); g.translate(it.dx, it.dy); g.rotate(it.r);
      g.drawImage(SPR[it.kind], -SWD / 2 - PAD, -SL / 2 - PAD, SWD + 2 * PAD, SL + 2 * PAD); g.restore();
    }
    drawBand(g, b);
    g.restore();
  }

  const boxPile = {
    bundles: [makeBundle(1000, 196), makeBundle(1090, 202)],
    loose: Array.from({ length: 11 }, (_, i) => ({ kind: rk(), x: 962 + i * 17 + rand(-4, 4), y: 470 + rand(-22, 22), rot: rand(-.28, .28) }))
  };
  function drawStatic(g) {
    g.fillStyle = '#e3e1da'; g.fillRect(0, 0, W, H);
    const vg = g.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 820);
    vg.addColorStop(0, 'rgba(255,255,255,.18)'); vg.addColorStop(1, 'rgba(90,80,60,.14)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
    g.save(); g.shadowColor = 'rgba(50,45,30,.22)'; g.shadowBlur = 14; g.shadowOffsetY = 5;
    roundRect(g, 30, 14, 882, 688, 8, '#fbfbf6'); g.restore();
    g.fillStyle = '#1f8aa3'; g.font = '700 25px "Baloo 2", "Trebuchet MS", sans-serif'; g.textBaseline = 'middle';
    g.fillText('ABACO  DECINE  E  UNITÀ', 58, 39);
    roundRect(g, 58, 62, 466, 500, 3, '#b7d263');
    roundRect(g, 530, 62, 352, 500, 3, '#d2e39e');
    roundRect(g, 58, 566, 466, 40, 3, '#a4c34a');
    roundRect(g, 530, 566, 352, 40, 3, '#bdd57c');
    roundRect(g, 58, 610, 466, 68, 3, '#c6dd84');
    roundRect(g, 530, 610, 352, 68, 3, '#dbe9b3');
    g.fillStyle = '#2b3818'; g.font = '500 25px "Baloo 2", "Trebuchet MS", sans-serif'; g.textAlign = 'center';
    g.fillText('decine', 291, 587); g.fillText('unità', 706, 587);
    g.textAlign = 'left';
    g.save(); g.beginPath(); g.roundRect(30, 14, 882, 688, 8); g.clip();
    const gl = g.createLinearGradient(100, 0, 700, 700);

  function recolorUnits() { unitsList.forEach((s, i) => { s.kind = unitKind(i); }); }

  async function placeStraw() {
    await moveHand(R, BOXL.x + rand(-40, 40), BOXL.y + rand(-18, 18), 340);
    await grip(R, .75, 90);

    const group = unitsList.splice(0, 10);

/* linea dei numeri: usata solo nelle tessere stampate */
function linea() {
  const W = 1000, H = 210, Y = 150, X = n => 40 + n * 46;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Linea dei numeri da 0 a 20" style="width:100%;height:auto;display:block">`;
  s += `<line x1="${X(0) - 24}" y1="${Y}" x2="${X(20) + 24}" y2="${Y}" stroke="#222" stroke-width="3"/>`;

function avvia(id) {
  const g = GIOCHI.find(x => x.id === id);
  let d = g.deck();
  if (g.misto) d = shuffle(d);
  else if (stato.casuale) d = shuffle(d);
  stato.gioco = g; stato.deck = d; stato.i = 0; stato.primi = 0;
  stato.schermo = 'gioco';
  prepara(); renderAll();
}
async function fermaSequenza() {
  if (!seqPromise) return;
  Tov.abort();
  if (resumeFn) { const f = resumeFn; resumeFn = null; f(); }
  await seqPromise;
  seqPromise = null;
}
async function vaiMenu() {
  await fermaSequenza();
  stato.schermo = 'menu'; renderAll();
}
function attendi(titolo, testo) {
  stato.fase = 'pausa'; stato.pausaTitolo = titolo; stato.pausaTesto = testo; renderAll();
  return new Promise(r => { resumeFn = r; });
}
function continua() {
  if (stato.fase !== 'pausa' || !resumeFn) return;
  stato.fase = 'lavoro';
  const f = resumeFn; resumeFn = null;
  renderAll(); f();
}
function costruisci() {
  if (stato.fase !== 'inizio') return;
  stato.fase = 'lavoro'; renderAll();
  seqPromise = sequenza(card(), token);
}
function saltaFine() { fermaSequenza().then(renderAll); }

/* sequenza: costruisce il primo numero, si ferma, poi completa l'operazione */
async function sequenza(c, my) {
  let abortato = false;
  try {
    await Tov.build(c.a);
    await attendi(`Sulla tovaglietta c'è ${c.a}`, `Quanto farà ${c.a} ${sg(c.op)} ${c.b}? Ragionate, poi premete Continua.`);
    if (c.op === '+') {
      const piv = c.step ? (Math.floor(c.a / c.step) + 1) * c.step : 0;
      if (piv && piv < c.res && piv < 10) {
        await Tov.build(piv - c.a);
        await attendi(`Tappa al ${piv}`, `Le mani sono arrivate a ${piv}. Quanto manca per arrivare a ${c.res}? Premete Continua.`);
        await Tov.build(c.res - piv);
      } else {
        await Tov.build(c.b);
      }
      // si posano tutte le cannucce senza legare: il bambino vede 10 sulla prima riga e il resto sotto
      if (Tov.unita() >= 10) {
        await attendi(`Sulla prima riga ci sono 10 cannucce`, `Ecco una decina: quanto fa ${c.a} ${sg(c.op)} ${c.b}? Premete Continua e il mazzetto si lega.`);
        await Tov.legaSeDieci();
      }
    } else {
      await Tov.subN(c.b);
    }
  } catch (e) {
    if (e !== Tov.ABORT) console.error(e);
    abortato = true;
  }
  if (abortato) { Tov.setInstant(c.res); Tov.homeInstant(); }
  Tov.clearAbort();
  if (my !== token) return;
  stato.fase = 'fine';
  renderAll();
}

async function avanti() {
  if (avantiInCorso) return;
  avantiInCorso = true;
  try {
    await fermaSequenza();
    stato.i++;
    if (stato.i >= stato.deck.length) stato.schermo = 'fine';
    else prepara();
    renderAll();
  } finally { avantiInCorso = false; }
}

/* giudizio a voce (LIM) */
function giudica(giusta) {
  if (stato.giudizio) return;
  const c = card();
  if (giusta) { stato.giudizio = 'ok'; if (stato.tent === 0) stato.primi++; stato.msg = 'Esatto!'; stato.msgCls = 'ok'; }
  else { stato.giudizio = 'ko'; stato.msg = `Il risultato è ${c.res}.`; stato.msgCls = 'ko'; }
  renderAll();
}
/* risposta scritta */
function tasto(t) {
  if (stato.giudizio) return;
  if (t === 'CANC') stato.input = stato.input.slice(0, -1);
  else if (t === 'OK') { verifica(); return; }
  else if (stato.input.length < 2) stato.input += t;
  renderAll();
}
function verifica() {
  if (stato.giudizio || stato.input === '') return;
  const c = card();
  const v = parseInt(stato.input, 10);
  if (v === c.res) {
    stato.giudizio = 'ok'; if (stato.tent === 0) stato.primi++;
    stato.msg = 'Esatto!'; stato.msgCls = 'ok';
  } else {
    stato.tent++;
    if (stato.tent < 2) { stato.msg = 'Non ancora. Riprova.'; stato.msgCls = ''; stato.input = ''; }
    else { stato.giudizio = 'ko'; stato.msg = `Il risultato è ${c.res}.`; stato.msgCls = 'ko'; }
  }
  renderAll();
}
function impostaModo(m) { stato.modo = m; stato.input = ''; renderAll(); }
function toggleOrdine() { stato.casuale = !stato.casuale; renderAll(); }
function toggleSugg() { stato.suggerimento = !stato.suggerimento; renderAll(); }
function ciclaVelocita() { stato.velIdx = (stato.velIdx + 1) % VELOCITA.length; Tov.setSpeed(VELOCITA[stato.velIdx]); renderAll(); }

/* ---------- viste ---------- */
function bottoniImpostazioni() {
  return `
    <button class="btn piccolo" onclick="toggleOrdine()">Ordine: ${stato.casuale ? 'casuale' : 'in sequenza'}</button>
    <button class="btn piccolo ${stato.modo === 'voce' ? 'attivo' : ''}" onclick="impostaModo('voce')">A voce</button>
    <button class="btn piccolo ${stato.modo === 'scritta' ? 'attivo' : ''}" onclick="impostaModo('scritta')">Scritta</button>
    <button class="btn piccolo" onclick="ciclaVelocita()">Velocità: ${NOMI_VEL[stato.velIdx]}</button>
    <button class="btn piccolo ${stato.suggerimento ? 'attivo' : ''}" onclick="toggleSugg()">Suggerimento: ${stato.suggerimento ? 'sì' : 'no'}</button>`;
}
function vistaMenu() {
  return `
    <h1 class="titolo">Calcolo a mente entro il 20</h1>
    <p class="sub">Scegli un gioco e costruisci i numeri con le mani</p>
    <div class="pannello"><div class="riga">${bottoniImpostazioni()}</div></div>
    <div class="riga" style="margin-bottom:12px"><button class="btn pdf" onclick="apriPannelloPdf()">Schede PDF</button></div>
    ${stato.pannelloPdf ? vistaPannelloPdf() : ''}
    <div class="griglia">
      ${GIOCHI.map(g => `<button class="carta-gioco" style="background:${g.fondo};border-color:${g.col}" onclick="avvia('${g.id}')"><span class="nome">${g.nome}</span><span class="desc">${g.desc}</span></button>`).join('')}
    </div>`;
}
function vistaHead() {
  return `
    <div class="riga">
      <button class="btn piccolo" onclick="vaiMenu()">Menu</button>
      <span class="etichetta">${stato.gioco.nome}</span>
      <span class="etichetta">${stato.i + 1} / ${stato.deck.length}</span>
    </div>
    <div class="riga" style="margin-top:8px">
      ${bottoniImpostazioni()}
      <button class="btn piccolo" onclick="scarica()">Scarica tessere</button>
    </div>`;
}
function vistaCarta() {
  const c = card();
  const mostraTip = stato.suggerimento && !stato.gioco.misto && (stato.fase === 'inizio' || stato.fase === 'pausa');
  return `<div class="tessera" style="border-color:${STR[c.s].colore};background:${STR[c.s].fondo}">
    <div class="op">${c.a} ${sg(c.op)} ${c.b}</div>
    ${mostraTip ? `<div class="tip">${STR[c.s].tip}</div>` : ''}
  </div>`;
}
function bloccoVoce() {
  return `<div class="azioni">
      <button class="btn grande giusta" onclick="giudica(true)">Giusta</button>
      <button class="btn grande sbagliata" onclick="giudica(false)">Sbagliata</button>
    </div>`;
}
function bloccoScritta() {
  return `<div class="risposta">${stato.input || '&nbsp;'}</div>
    <div class="messaggio ${stato.msgCls}">${stato.msg}</div>
    <div class="tastiera">
      ${['1','2','3','4','5','6','7','8','9'].map(t => `<button onclick="tasto('${t}')">${t}</button>`).join('')}
      <button class="azione" onclick="tasto('CANC')">Canc</button>
      <button onclick="tasto('0')">0</button>
      <button class="azione verifica" onclick="tasto('OK')">OK</button>
    </div>`;
}
function bloccoRisposta() {
  if (stato.giudizio) return `<div class="messaggio ${stato.msgCls}">${stato.msg}</div>`;
  return stato.modo === 'voce' ? bloccoVoce() : bloccoScritta();
}
function vistaZona() {
  const c = card();
  let h = '';
  if (stato.fase === 'inizio') {
    h = bloccoRisposta() + `<div class="azioni">
      <button class="btn grande costruisci" onclick="costruisci()">Costruisci il primo numero</button>
      <button class="btn piccolo" onclick="avanti()">Avanti senza svolgere</button></div>`;
  } else if (stato.fase === 'lavoro') {
    h = `<p class="etichetta">Le mani lavorano…</p>` + bloccoRisposta() +
      `<div class="azioni"><button class="btn piccolo" onclick="saltaFine()">Salta alla fine</button></div>`;
  } else if (stato.fase === 'pausa') {
    h = `<div class="pausa-box"><div class="titolo-p">${stato.pausaTitolo}</div><div class="testo-p">${stato.pausaTesto}</div></div>` +
      bloccoRisposta() + `<div class="azioni">
        <button class="btn grande continua" onclick="continua()">Continua</button>
        <button class="btn piccolo" onclick="saltaFine()">Salta alla fine</button></div>`;
  } else {
    const esito = stato.giudizio ? stato.msg : `${c.a} ${sg(c.op)} ${c.b} = ${c.res}.`;
    h = `<div class="messaggio ${stato.giudizio ? stato.msgCls : ''}">${esito}</div>` +
      (stato.giudizio ? '' : bloccoRisposta()) +
      `<p class="strategia">Strategia: ${STR[c.s].nome}. ${STR[c.s].tip}</p>
       <div class="azioni"><button class="btn grande avanti" onclick="avanti()">Avanti</button></div>`;
  }
  return `<div class="zona">${h}</div>`;
}
function vistaFine() {
  const g = stato.gioco;
  return `
    <div class="fine">
      <div class="medaglia"><span>${g.misto ? 'Coppa del calcolo a mente' : 'Brevetto'}</span></div>
      <h1 class="titolo">${g.misto ? 'Coppa conquistata' : 'Brevetto conquistato'}</h1>
      <p>${g.nome}</p>
      <p>Risposte giuste al primo tentativo: ${stato.primi} su ${stato.deck.length}</p>
      <div class="riga" style="margin-top:14px">
        <button class="btn" onclick="avvia('${g.id}')">Ricomincia</button>
        <button class="btn" onclick="scarica()">Scarica tessere</button>
        <button class="btn" onclick="vaiMenu()">Menu</button>
      </div>
    </div>`;
}
function renderAll() {
  const s = stato.schermo;
  elMenu.hidden = s !== 'menu';
  elGioco.hidden = s !== 'gioco';
  elFine.hidden = s !== 'fine';
  if (s === 'menu') elMenu.innerHTML = vistaMenu();
  if (s === 'gioco') {
    elHead.innerHTML = vistaHead();
    elCarta.innerHTML = vistaCarta();
    elZona.innerHTML = vistaZona();
  }
  if (s === 'fine') elFine.innerHTML = vistaFine();
}

/* ================= SCHEDE PDF ================= */
function caricaImg(url) {
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0);
        res({ data: c.toDataURL('image/png'), w: c.width, h: c.height });
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = url;
    setTimeout(() => res(null), 5000);
  });
}
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
function intestazionePdf(doc, logo, M, PW) {
  if (logo) doc.addImage(logo.data, 'PNG', M, 9, 13, 13 * logo.h / logo.w);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(34, 34, 34);
  doc.text('Matematiche non si nasce', M + 17, 18);
  doc.setDrawColor(225, 6, 0); doc.setLineWidth(0.6); doc.line(M, 26, PW - M, 26);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(34, 34, 34);
  doc.text('Scrivi il risultato.', M, 36);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(90, 90, 90);
  doc.text('Non contare uno alla volta: usa la strategia che abbiamo imparato in classe.', M, 43);
  doc.setTextColor(34, 34, 34);
}
function piePdf(doc, logoF, M) {
  const fy = 268;
  if (logoF) doc.addImage(logoF.data, 'PNG', M, fy, 14, 14 * logoF.h / logoF.w);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(34, 34, 34);
  doc.text('Rita Di Ianni', M + 18, fy + 6);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text('Materiale e idee per la scuola primaria', M + 18, fy + 11);
}
function apriPannelloPdf() { stato.pannelloPdf = !stato.pannelloPdf; renderAll(); }
function togglePdfSel(id) { pdfSel[id] = !pdfSel[id]; renderAll(); }
function vistaPannelloPdf() {
  return `<div class="pannello">
    <p class="etichetta">Scegli le tipologie di esercizi da inserire nella scheda</p>
    <div class="riga">${GIOCHI.map(g => `<button class="btn piccolo ${pdfSel[g.id] ? 'attivo' : ''}" style="background:${pdfSel[g.id] ? g.fondo : '#fff'};border-color:${g.col}" onclick="togglePdfSel('${g.id}')">${g.nome}</button>`).join('')}</div>
    <div class="riga"><button class="btn grande pdf" onclick="creaSchedaPdf()">Crea PDF</button></div>
    <p class="etichetta" id="pdf-stato"></p>
  </div>`;
}
async function creaSchedaPdf() {
  const scelti = GIOCHI.filter(g => !g.misto && pdfSel[g.id]);
  const mix = !!pdfSel['misto'];
  const st = document.getElementById('pdf-stato');
  if (!scelti.length && !mix) { st.textContent = 'Seleziona almeno una tipologia di esercizi.'; return; }
  let carte = [];
  scelti.forEach(g => carte.push(...g.deck()));
  if (mix) carte.push(...shuffle(GIOCHI.find(g => g.misto).deck()).slice(0, 44));
  carte = shuffle(uniq(carte));
  await generaPdf(carte, st);
}
async function generaPdf(carte, st) {
  if (!window.jspdf) { st.textContent = 'Non riesco a caricare lo strumento per il PDF: controlla la connessione a internet e ricarica la pagina.'; return; }
  st.textContent = 'Preparo la scheda…';
  const { jsPDF } = window.jspdf;
  const [logoTop, logoFondo] = await Promise.all([caricaImg(document.querySelector('.logo img').src), caricaImg(LOGO_TESSERE)]);
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const PW = 210, M = 14, COLS = 4, colW = (PW - 2 * M) / COLS, ROWH = 19.5, Y0 = 58, PER = 44;
  const pagine = Math.max(1, Math.ceil(carte.length / PER));
  for (let p = 0; p < pagine; p++) {
    if (p > 0) doc.addPage();
    intestazionePdf(doc, logoTop, M, PW);
    doc.setFontSize(14);
    carte.slice(p * PER, (p + 1) * PER).forEach((c, i) => {
      const x = M + (i % COLS) * colW, y = Y0 + Math.floor(i / COLS) * ROWH;
      const rgb = hexRGB(STR[c.s].colore);
      doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.rect(x, y - 4.5, 2.6, 5, 'F');
      const txt = `${c.a} ${c.op === '+' ? '+' : '-'} ${c.b} =`;
      doc.setFont('helvetica', 'normal'); doc.text(txt, x + 5, y);
      const w = doc.getTextWidth(txt);
      doc.setDrawColor(120, 120, 120); doc.setLineWidth(0.3); doc.line(x + 5 + w + 2, y + 0.8, x + colW - 6, y + 0.8);
    });
    piePdf(doc, logoFondo, M);
  }
  doc.save('scheda-esercizi.pdf');
  st.textContent = `PDF creato con ${carte.length} esercizi. Ogni volta che lo crei, il Riepilogo esce con un mix diverso.`;
}

/* ================= TASTIERA ================= */
document.addEventListener('keydown', e => {
  if (stato.schermo !== 'gioco') return;
  if (e.target.matches('button, input')) return;
  const avKey = e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight';
  if (stato.fase === 'pausa' && avKey) { e.preventDefault(); continua(); return; }
  if (stato.fase === 'fine' && avKey) { e.preventDefault(); avanti(); return; }
  if (stato.giudizio) return;
  if (stato.modo === 'voce') {
    if (e.key === 'g' || e.key === 'G') giudica(true);
    else if (e.key === 's' || e.key === 'S') giudica(false);
  } else {
    if (/^[0-9]$/.test(e.key)) tasto(e.key);
    else if (e.key === 'Backspace') tasto('CANC');
    else if (e.key === 'Enter') verifica();
  }
});

/* ================= AVVIO ================= */
Tov.init(document.getElementById('mat'));
renderAll();
</script>
