<style>
:root{--ink:#293e3c;--muted:#697873;--green:#326957;--paper:#f8f7f2;--line:#dfe5dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}[hidden]{display:none!important}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #be7e2e;outline-offset:4px}header,main{max-width:1200px;margin:auto;padding:0 26px}.brand{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:750}.brand img{width:44px;height:44px;object-fit:contain}.brand a{color:inherit;text-decoration:none}.hero{padding:36px 0 26px}.eyebrow{text-transform:uppercase;color:var(--green);letter-spacing:.17em;font-size:12px;font-weight:750}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;line-height:1.12;margin:10px 0 16px}h1 span{color:var(--green)}.intro{color:var(--muted);max-width:650px;margin:0;font-size:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 22px}.mode-card{border:1px solid #d6e2d8;border-radius:20px;padding:24px;text-align:left;background:#edf3e8;color:var(--ink);display:grid;grid-template-columns:54px 1fr;gap:15px;align-items:start;transition:transform .15s}.mode-card:hover{transform:translateY(-3px)}.mode-card:nth-child(2){background:#fff0da;border-color:#eadac1}.mode-card:nth-child(3){background:#eeebf7;border-color:#ded6ed}.mode-card:nth-child(4){background:#e8f1f5;border-color:#d1e0e6}.mode-icon{font-size:34px}.mode-card strong{font-size:20px;display:block;margin-bottom:6px}.mode-card small{display:block;font-size:15px;line-height:1.5;color:#56645e}.teacher-tools{background:white;border:1px solid var(--line);border-radius:14px;padding:15px 18px;margin-bottom:30px}.teacher-tools summary{cursor:pointer;font-weight:650}.strategies{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}.btn{border:1px solid #cbd6cc;border-radius:12px;padding:11px 17px;background:white;color:var(--ink);min-height:44px;font-weight:650}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.answer{background:#f8e4b9;border-color:#e2c98f}.btn.small{font-size:14px;padding:8px 13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 0}.toolbar-side{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.mode-title{font-weight:750}.exercise{display:flex;flex-direction:column;align-items:center;min-height:119px;justify-content:center;text-align:center}.prompt{font-size:clamp(28px,4vw,46px);font-weight:750;letter-spacing:-.025em;line-height:1.2}.prompt .result{color:var(--green)}.hint{font-size:14px;color:var(--muted);margin:10px 0 4px}.stage{border:1px solid var(--line);background:#fcfaf6;border-radius:22px;padding:4px 12px;overflow:hidden}#mat{width:100%;max-width:1080px;margin:auto}#mat svg{display:block;width:100%;height:auto}.actions{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0 26px}.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.feedback{min-height:26px;margin:0;color:var(--green);font-weight:600;text-align:center}.number-grid{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;max-width:790px}.number-grid .btn{min-width:48px}.number-grid .selected{background:var(--green);color:white}.composer{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px;color:var(--muted);font-size:14px}.composer select{border:1px solid #cbd6cc;border-radius:9px;background:white;color:var(--ink);padding:7px;min-height:40px}.tip{font-size:13px;color:var(--muted);text-align:center;margin:0 0 16px}footer{max-width:1200px;margin:10px auto 0;padding:20px 26px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:640px){header,main{padding:0 16px}.mode-grid{grid-template-columns:1fr}.mode-card{padding:18px;grid-template-columns:42px 1fr}.mode-card strong{font-size:18px}.hero{padding-top:24px}.toolbar{gap:12px}.stage{padding:0;border-radius:12px}.btn{font-size:14px;padding:10px 12px}.hint{font-size:13px}.mode-icon{font-size:29px}.teacher-tools{font-size:14px}}@media(prefers-reduced-motion:reduce){.mode-card{transition:none}}

.mode-grid{grid-template-areas:"riconosci strategie" "esplora operazioni"}.mode-card[data-mode=riconosci]{grid-area:riconosci}.mode-card[data-mode=esplora]{grid-area:esplora}.mode-card[data-mode=strategie]{grid-area:strategie}.mode-card[data-mode=operazioni]{grid-area:operazioni}.strategy-intro{padding:16px 0 24px}.strategy-intro h1{font-size:clamp(30px,4vw,43px)}.all-strategies{display:flex;justify-content:space-between;gap:20px;align-items:center;background:#eeebf7;border:1px solid #ded6ed;border-radius:18px;padding:22px;margin:0 0 22px}.all-strategies strong{font-size:20px}.all-strategies p{margin:6px 0 0;color:var(--muted);font-size:15px}.all-strategies .btn{flex-shrink:0}.strategy-panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:26px}.strategy-panel h2{font-size:22px;margin:0 0 5px}.strategy-panel>.hint{text-align:left;margin:0}.strategy-panel h3{font-size:15px;color:var(--muted);margin:24px 0 10px}.strategy-buttons{display:flex;gap:10px;flex-wrap:wrap}.strategy-choice.chosen{background:#e3f0e6;border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);color:#24533f}.strategy-launch{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;text-align:center}.strategy-launch>p{color:var(--muted);font-size:14px}.strategy-launch .hint{margin-top:12px}@media(max-width:640px){.mode-grid{grid-template-areas:"riconosci" "esplora" "strategie" "operazioni"}.all-strategies{align-items:stretch;flex-direction:column;padding:18px}.strategy-panel{padding:18px}.strategy-launch .action-row{flex-direction:column}.strategy-launch .btn{width:100%}}

<body>
<header><div class="brand"><img src="logo.png" alt="Logo"><a href="https://matematichenonsinasce.com/">Matematiche non si nasce</a></div></header>
<main id="app"><section id="menu"></section><section id="workspace" hidden><div id="toolbar"></div><div id="exercise" class="exercise"></div><div class="stage"><div id="mat" role="img" aria-label="Quattro mani affiancate"></div></div><div id="actions" class="actions"></div></section></main>
<footer>Quattro mani, venti dita. Un numero alla volta, insieme alla classe.</footer>
<script>
const STR = {
  uno:   { nome: 'Aggiungi o togli 1', colore: '#ffb020', fondo: '#fff1cc', tip: 'Aggiungere 1 significa andare al numero successivo; togliere 1 significa tornare al numero precedente.' },
  zero:  { nome: 'Aggiungi o togli 0', colore: '#2fb47a', fondo: '#d6f5e6', tip: 'Aggiungere o togliere 0 non cambia il numero.' },
  due:   { nome: 'Aggiungi o togli 2', colore: '#2d9be0', fondo: '#d6ecff', tip: 'Aggiungere 2 significa andare avanti di due; togliere 2 significa tornare indietro di due.' },
  doppi: { nome: 'I doppi', colore: '#ec5f86', fondo: '#ffdbe6', tip: 'Un doppio è la somma di due numeri uguali. Dai doppi si arriva ai numeri vicini.' },
  c5:    { nome: 'Combinazioni con il 5', colore: '#8b62d9', fondo: '#e8dcff', tip: 'Ci sono coppie di numeri che fanno 5: 1 e 4, 2 e 3, e così via.' },
  c6:    { nome: 'Combinazioni con il 6', colore: '#18a8a6', fondo: '#d0f4f2', tip: 'Ci sono coppie di numeri che fanno 6: 1 e 5, 2 e 4, 3 e 3.' },
  c7:    { nome: 'Combinazioni con il 7', colore: '#7cb82f', fondo: '#e6f5c9', tip: 'Ci sono coppie di numeri che fanno 7: 1 e 6, 2 e 5, 3 e 4.' },
  c8:    { nome: 'Combinazioni con il 8', colore: '#f47c2c', fondo: '#ffe3d0', tip: 'Ci sono coppie di numeri che fanno 8: 1 e 7, 2 e 6, 3 e 5, 4 e 4.' },
  c9:    { nome: 'Combinazioni con il 9', colore: '#4f6fe0', fondo: '#dfe5ff', tip: 'Ci sono coppie di numeri che fanno 9: 1 e 8, 2 e 7, 3 e 6, 4 e 5.' },
  p5:    { nome: 'Passaggio al 5', colore: '#e6a817', fondo: '#fff3d4', tip: 'Si fa una tappa al 5 (o al 10) e poi si aggiunge quello che resta.' },
  pd:    { nome: 'Passaggio alla decina', colore: '#14a0c8', fondo: '#d2f1fb', tip: 'Si arriva alla decina (10) e poi si aggiunge quello che resta.' }
};

function f(a, op, b, s, step) {
  const res = op === '+' ? a + b : a - b;
  return { a, op, b, res, s, step: step || 0, key: a + op + b };
}
function combN(n, s) {
  const r = [];
  for (let a = 0; a <= n; a++) { r.push(f(a, '+', n - a, s)); r.push(f(n, '-', a, s)); }
  return r;
}
function uniq(arr) {
  const seen = new Set();
  return arr.filter(c => { if (seen.has(c.key)) return false; seen.add(c.key); return true; });
}
const P5 = [[6,8],[5,6],[7,5],[7,8],[9,6],[3,4],[7,4],[1,6],[6,2],[7,6],[7,2],[2,6],[6,7],[8,7]];
const PD = [[6,8],[7,8],[8,6],[8,7],[9,6],[9,5],[3,8],[2,9],[9,8],[9,7],[5,9],[5,7],[14,4],[6,9],[12,7],[5,15],[8,2],[8,4],[2,15],[8,5],[11,3],[4,13],[2,11],[11,5]];

const GIOCHI = [
  { id: 'uno', nome: 'Aggiungi o togli 1', desc: 'Il numero successivo o precedente', col: STR.uno.colore, fondo: STR.uno.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', 1, 'uno')); for (let a = 1; a <= 10; a++) r.push(f(a, '-', 1, 'uno')); return r; } },
  { id: 'zero', nome: 'Aggiungi o togli 0', desc: 'Il numero non cambia', col: STR.zero.colore, fondo: STR.zero.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) { r.push(f(a, '+', 0, 'zero')); r.push(f(a, '-', 0, 'zero')); } return r; } },
  { id: 'due', nome: 'Aggiungi o togli 2', desc: 'Due in avanti o indietro', col: STR.due.colore, fondo: STR.due.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', 2, 'due')); for (let a = 2; a <= 10; a++) r.push(f(a, '-', 2, 'due')); return r; } },
  { id: 'doppi', nome: 'I doppi', desc: 'Il doppio e i numeri vicini', col: STR.doppi.colore, fondo: STR.doppi.fondo,
    deck: () => { const r = []; for (let a = 0; a <= 9; a++) r.push(f(a, '+', a, 'doppi')); for (let a = 1; a <= 9; a++) r.push(f(2 * a, '-', a, 'doppi')); return r; } },
  { id: 'c5', nome: 'Combinazioni con il 5', desc: 'Coppie che fanno 5', col: STR.c5.colore, fondo: STR.c5.fondo, deck: () => combN(5, 'c5') },
  { id: 'c6', nome: 'Combinazioni con il 6', desc: 'Coppie che fanno 6', col: STR.c6.colore, fondo: STR.c6.fondo, deck: () => combN(6, 'c6') },
  { id: 'c7', nome: 'Combinazioni con il 7', desc: 'Coppie che fanno 7', col: STR.c7.colore, fondo: STR.c7.fondo, deck: () => combN(7, 'c7') },
  { id: 'c8', nome: 'Combinazioni con il 8', desc: 'Coppie che fanno 8', col: STR.c8.colore, fondo: STR.c8.fondo, deck: () => combN(8, 'c8') },
  { id: 'c9', nome: 'Combinazioni con il 9', desc: 'Coppie che fanno 9', col: STR.c9.colore, fondo: STR.c9.fondo, deck: () => combN(9, 'c9') },
  { id: 'p5', nome: 'Passaggio al 5', desc: 'Le dita si alzano senza interruzioni', col: STR.p5.colore, fondo: STR.p5.fondo,
    deck: () => P5.map(([a, b]) => f(a, '+', b, 'p5', 5)) },
  { id: 'pd', nome: 'Passaggio alla decina', desc: 'Le dita continuano oltre la prima coppia di mani', col: STR.pd.colore, fondo: STR.pd.fondo,
    deck: () => PD.map(([a, b]) => f(a, '+', b, 'pd', 10)) },
  { id: 'misto', nome: 'Riepilogo', desc: 'Tutte le combinazioni, in ordine casuale', col: '#7a7a7a', fondo: '#ececec', misto: true,
    deck: () => uniq([].concat(...GIOCHI.filter(g => !g.misto).map(g => g.deck()))) }
];

/* ================= MANI: DUE PERSONE, QUATTRO GRUPPI DI CINQUE ================= */
const Mani = (() => {
  const ABORT = {abort:true};
  let element=null, count=0, speed=1, aborted=false;
  const fingers=Array(20).fill(0);
  const clamp=n=>Math.max(0,Math.min(20,Math.round(Number(n)||0)));
  function hand(index){
    const tone=Math.floor(index/2),values=fingers.slice(index*5,index*5+5);
    const mirror=index%2===0, id='hand-'+index;
    const color=tone===0?{light:'#ffe4cf',mid:'#e9b795',shade:'#bb7f61',line:'#975f46'}:{light:'#d6aa85',mid:'#aa7655',shade:'#784c37',line:'#603d2d'};
    const geometry=[{x:63,tip:58,top:48,w:20},{x:89,tip:87,top:29,w:21},{x:115,tip:117,top:41,w:19},{x:139,tip:146,top:72,w:16}];
    let extended='',folded='';
    for(let i=0;i<4;i++){
      const {x,tip,top,w}=geometry[i],open=values[i+1];
      const tipX=x+(tip-x)*open,tipY=145-(145-top)*open,half=w/2;
      const base=157,midY=tipY+(base-tipY)*.53;
      const contour=`M ${x-half-1} ${base} C ${x-half-2} ${midY+20} ${tipX-half} ${tipY+25} ${tipX-half+1} ${tipY+11} C ${tipX-half+2} ${tipY-3} ${tipX+half-2} ${tipY-3} ${tipX+half-1} ${tipY+11} C ${tipX+half+1} ${tipY+29} ${x+half+2} ${midY+19} ${x+half+1} ${base} Z`;
      extended+=`<path d="${contour}" fill="url(#${id}-finger)" stroke="${color.line}" stroke-opacity=".55" stroke-width=".9"/>
        <g opacity="${open*.55}" fill="none" stroke="${color.line}" stroke-width=".65" stroke-linecap="round">
          <path d="M ${tipX-half+5} ${tipY+(base-tipY)*.43} q ${half-4} 3 ${w-10} -.3 M ${tipX-half+4} ${tipY+(base-tipY)*.65} q ${half-3} 3 ${w-8} -.7"/>
          <path d="M ${tipX-4} ${tipY+13} q 4 -2 8 0" stroke-opacity=".45"/>
        </g>
        <path d="M ${tipX-half+4} ${tipY+17} Q ${tipX-half+3} ${midY} ${x-half+4} 145" fill="none" stroke="${color.light}" stroke-width="1.3" opacity="${open*.5}"/>`;
      const foldedTop=144+[0,-3,0,8][i];
      folded+=`<g opacity="${1-open}">
        <path d="M ${x-half-1} ${foldedTop+11} C ${x-half-2} ${foldedTop-4} ${x+half+1} ${foldedTop-5} ${x+half+1} ${foldedTop+10} L ${x+half} ${foldedTop+29} Q ${x+half-1} ${foldedTop+39} ${x} ${foldedTop+39} Q ${x-half} ${foldedTop+38} ${x-half-1} ${foldedTop+29} Z" fill="url(#${id}-curl)" stroke="${color.line}" stroke-opacity=".45" stroke-width=".85"/>
        <path d="M ${x-half+4} ${foldedTop+25} Q ${x} ${foldedTop+29} ${x+half-4} ${foldedTop+25} M ${x-half+5} ${foldedTop+28} Q ${x} ${foldedTop+31} ${x+half-5} ${foldedTop+28}" fill="none" stroke="${color.line}" stroke-opacity=".55" stroke-width=".7"/>
        <path d="M ${x-half+4} ${foldedTop+8} Q ${x} ${foldedTop+2} ${x+half-4} ${foldedTop+8}" fill="none" stroke="${color.light}" stroke-opacity=".4" stroke-width="1.3"/>
      </g>`;
    }
    // Identical Bézier topology lets the thumb unfold smoothly rather than
    // switching between a mitten shape and a stick.
    const thumb=values[0];
    const closed=[70,223,55,217,49,201,54,190,61,180,70,175,81,180,92,183,105,190,112,194,123,200,116,212,106,211,98,210,91,204,84,203,85,215,81,220,70,223];
    const opened=[70,223,51,215,46,193,43,177,35,160,18,148,14,137,7,123,14,116,23,120,33,122,37,135,47,146,62,163,76,175,81,193,84,208,81,218,70,223];
    const a=closed.map((n,i)=>n+(opened[i]-n)*thumb);
    let thumbPath=`M ${a.slice(0,2)}`;
    for(let i=2;i<a.length;i+=6)thumbPath+=` C ${a.slice(i,i+6)}`;
    thumbPath+=' Z';
    const raised=values.filter(v=>v>.99).length;
    return `<g class="hand" data-hand="${index}" data-raised="${raised}" transform="translate(${10+index*240} 0)">
      <defs>
        <radialGradient id="${id}-palm" cx="38%" cy="35%" r="78%"><stop stop-color="${color.light}"/><stop offset=".56" stop-color="${color.mid}"/><stop offset="1" stop-color="${color.shade}"/></radialGradient>
        <linearGradient id="${id}-finger" x1="0" x2="1"><stop stop-color="${color.shade}"/><stop offset=".22" stop-color="${color.mid}"/><stop offset=".52" stop-color="${color.light}"/><stop offset=".8" stop-color="${color.mid}"/><stop offset="1" stop-color="${color.shade}"/></linearGradient>
        <linearGradient id="${id}-curl" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="${color.light}"/><stop offset=".4" stop-color="${color.mid}"/><stop offset="1" stop-color="${color.shade}"/></linearGradient>
      </defs>
      <g transform="${mirror?'translate(200 0) scale(-1 1)':''}">
        <path d="M 76 217 Q 79 244 73 269 L 133 269 Q 124 241 128 216 Z" fill="url(#${id}-palm)" stroke="${color.line}" stroke-width=".8" stroke-opacity=".5"/>
        ${extended}
        <path d="M 51 151 Q 54 136 65 139 Q 78 143 89 138 Q 102 141 114 140 Q 130 146 145 148 Q 154 155 150 177 L 146 199 Q 142 217 129 229 Q 119 238 104 238 Q 78 239 67 227 Q 53 214 51 195 Q 46 174 51 151 Z" fill="url(#${id}-palm)"/>
        <path d="M 52 154 Q 46 175 51 195 Q 53 214 67 227 Q 79 239 104 238 Q 121 238 129 229 Q 142 217 146 199 L 150 177 Q 154 155 145 148" fill="none" stroke="${color.line}" stroke-opacity=".58" stroke-width=".95"/>
        <g fill="none" stroke="${color.line}" stroke-linecap="round" opacity=".36">
          <path d="M 62 174 Q 92 166 131 177 M 83 186 Q 110 191 135 181" stroke-width=".9"/>
          <path d="M 75 186 C 93 190 94 209 85 224 M 93 202 Q 105 212 126 211" stroke-width=".85"/>
          <path d="M 79 231 Q 100 236 122 231 M 81 245 Q 103 249 124 244" stroke-width=".65"/>
          <path d="M 109 198 l 10 -7 M 107 219 l 7 -5 M 66 202 l -4 -9 M 126 194 l 7 -4" stroke-width=".45"/>
        </g>
        ${folded}
        <path d="${thumbPath}" fill="url(#${id}-palm)" stroke="${color.line}" stroke-opacity=".5" stroke-width=".95"/>
        <path d="M ${29+thumb*-6} ${163-thumb*22} q 5 -2 10 2" fill="none" stroke="${color.line}" stroke-width=".7" opacity="${thumb*.45}"/>
        <path d="M 70 258 Q 101 265 136 258 L 139 277 L 68 277 Z" fill="${tone===0?'#447886':'#7d658f'}"/>
        <path d="M 71 261 Q 104 267 135 261" fill="none" stroke="${tone===0?'#76a3ac':'#aa94b9'}" stroke-width="1.4"/>
      </g>
    </g>`;
  }
  function draw(){
    if(!element)return;
    element.setAttribute('aria-label',`${count} dita alzate su due coppie di mani, in gruppi di cinque`);
    element.dataset.number=count;
    element.innerHTML=`<svg viewBox="0 0 960 326" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="960" height="326" rx="20" fill="#fcfaf6"/>
      <text x="240" y="25" text-anchor="middle" fill="#486572" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PRIMA PERSONA</text>
      <text x="720" y="25" text-anchor="middle" fill="#79608f" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">SECONDA PERSONA</text>
      <g transform="translate(0 32)">${hand(0)}${hand(1)}${hand(2)}${hand(3)}</g>
    </svg>`;
  }
  function check(){if(aborted)throw ABORT;}
  async function moveTo(number){
    const target=clamp(number);
    while(count!==target){
      check();
      const increasing=target>count,index=increasing?fingers.findIndex(value=>value<.5):fingers.findLastIndex(value=>value>.5);
      const from=fingers[index],to=increasing?1:0;
      const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?50:430/speed;
      await new Promise((resolve,reject)=>{
        const start=performance.now();
        function frame(now){
          if(aborted){reject(ABORT);return;}
          const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
          fingers[index]=from+(to-from)*ease;draw();
          if(t<1)requestAnimationFrame(frame);else resolve();
        }
        requestAnimationFrame(frame);
      });
      count+=increasing?1:-1;draw();
    }
    check();
  }
  async function addGroups(amount){
    let remaining=Math.min(20-count,clamp(amount));
    while(remaining>0){
      check();
      const hands=Array.from({length:4},(_,hand)=>Array.from({length:5},(_,i)=>hand*5+i));
      const empty=hands.filter(indices=>indices.every(i=>fingers[i]<.5));
      let indices;
      // Add whole tens/fives on unused hands. Keep the original partial
      // hand in place and use it for the remainder instead of recounting.
      if(remaining>=10&&empty.length>=2)indices=[...empty[0],...empty[1]];
      else if(remaining>=5&&empty.length)indices=empty[0];
      else{
        const partial=hands.find(indices=>indices.some(i=>fingers[i]>.5)&&indices.some(i=>fingers[i]<.5));
        const available=(partial||empty[0]||[]).filter(i=>fingers[i]<.5);
        indices=available.slice(0,remaining);
      }
      if(!indices.length)break;
      const from=indices.map(i=>fingers[i]);
      const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?50:550/speed;
      await new Promise((resolve,reject)=>{
        const start=performance.now();
        function frame(now){
          if(aborted){reject(ABORT);return;}
          const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
          indices.forEach((index,i)=>fingers[index]=from[i]+(1-from[i])*ease);draw();
          if(t<1)requestAnimationFrame(frame);else resolve();
        }
        requestAnimationFrame(frame);
      });
      count+=indices.length;remaining-=indices.length;draw();
    }
    check();
  }
  async function subtractGroups(amount){
    let remaining=Math.min(count,clamp(amount));
    // Remove complete tens/fives when possible. For the remainder, start
    // on the right so 13-3 removes its partial hand and leaves a visible ten.
    while(remaining>0){
      check();
      const hands=Array.from({length:4},(_,hand)=>Array.from({length:5},(_,i)=>hand*5+i));
      const full=hands.filter(indices=>indices.every(i=>fingers[i]>.5));
      let indices;
      if(remaining>=10&&full.length>=2)indices=[...full[0],...full[1]];
      else if(remaining>=5&&full.length)indices=full[0];
      else{
        const rightmost=hands.slice().reverse().find(indices=>indices.some(i=>fingers[i]>.5));
        if(!rightmost)break;
        indices=rightmost.slice().reverse().filter(i=>fingers[i]>.5).slice(0,remaining);
      }
      const from=indices.map(i=>fingers[i]);
      const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?50:550/speed;
      await new Promise((resolve,reject)=>{
        const start=performance.now();
        function frame(now){
          if(aborted){reject(ABORT);return;}
          const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);
          indices.forEach((index,i)=>fingers[index]=from[i]*(1-ease));draw();
          if(t<1)requestAnimationFrame(frame);else resolve();
        }
        requestAnimationFrame(frame);
      });
      count-=indices.length;remaining-=indices.length;draw();
    }
    check();
  }
  return {
    ABORT,init(node){element=node;draw();},
    build:addGroups,subN:subtractGroups,
    moveTo,
    setInstant(n){count=clamp(n);fingers.forEach((_,i)=>fingers[i]=i<count?1:0);draw();},
    getNumber:()=>count,getFingers:()=>fingers.slice(),
    abort(){aborted=true;},clearAbort(){aborted=false;},setSpeed(v){speed=v;}
  };
})();


function randomIndex(limit){
  // Use the browser's fresh entropy, including in embedded previews.
  if(globalThis.crypto&&typeof globalThis.crypto.getRandomValues==='function'){
    const sample=new Uint32Array(1),ceiling=Math.floor(4294967296/limit)*limit;
    do{globalThis.crypto.getRandomValues(sample);}while(sample[0]>=ceiling);
    return sample[0]%limit;
  }
  return Math.floor(Math.random()*limit);
}
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=randomIndex(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const VELOCITA=[.6,1,2.2], NOMI_VEL=['lenta','normale','veloce'];
const stato={mode:'menu',strategy:'libere',history:[],index:-1,deck:[],busy:false,revealed:false,speed:1,phase:'',customA:8,customB:4,customOp:'+',selectedStrategies:[],activeStrategies:[]};
let runToken=0,animation=Promise.resolve();
const card=()=>stato.history[stato.index];
const symbol=op=>op==='+'?'+':'−';
function allOperations(){const cards=[];for(let a=0;a<=20;a++)for(let b=0;b<=20;b++){if(a+b<=20)cards.push(f(a,'+',b,'uno'));if(a-b>=0)cards.push(f(a,'-',b,'due'));}return cards;}
function selectedOperations(ids){
  return uniq(GIOCHI.filter(g=>!g.misto&&ids.includes(g.id)).flatMap(g=>g.deck()));
}
function nextCard(){
  if(!stato.deck.length){
    const previous=card();
    const source=stato.mode==='riconosci'?Array.from({length:21},(_,n)=>({n,key:'n'+n})):stato.strategy==='libere'?allOperations():stato.strategy==='selezionate'?selectedOperations(stato.activeStrategies):GIOCHI.find(g=>g.id===stato.strategy).deck();
    stato.deck=shuffle(source);
    if(previous&&stato.deck.length>1&&stato.deck[stato.deck.length-1].key===previous.key)[stato.deck[0],stato.deck[stato.deck.length-1]]=[stato.deck[stato.deck.length-1],stato.deck[0]];
  }
  return stato.deck.pop();
}
async function animateCard(reset=true, applyOperation=false){
  const my=++runToken,previous=animation;
  Mani.abort();await previous;
  if(my!==runToken)return;
  Mani.clearAbort();Mani.setSpeed(VELOCITA[stato.speed]);
  const current=card(),operation=stato.mode==='operazioni';
  // Recognition is a simultaneous configuration, never a count-up animation.
  if(stato.mode==='riconosci'){
    Mani.setInstant(current.n);stato.busy=false;stato.revealed=false;stato.phase='done';render();return;
  }
  if(operation&&!applyOperation){
    Mani.setInstant(0);stato.busy=false;stato.revealed=false;stato.phase='ready';render();return;
  }
  Mani.setInstant(operation?current.a:reset?0:Mani.getNumber());
  stato.busy=true;stato.revealed=false;stato.phase='Le dita si alzano…';render();
  animation=(async()=>{
    let success=false;
    try{
      if(stato.mode==='esplora')await Mani.moveTo(current.n);
      else{
        stato.phase=current.op==='+'?'Aggiungiamo '+current.b+' dita per gruppi, usando le mani libere…':'Togliamo '+current.b+' dita: prima i gruppi completi, poi da destra…';render();
        if(current.op==='-')await Mani.subN(current.b);
        else await Mani.build(current.b);
      }
      success=true;
    }catch(error){if(error!==Mani.ABORT)console.error(error);}
    finally{if(my===runToken){
      stato.busy=false;
      stato.phase=success?'done':'error';
      stato.revealed=success&&operation&&applyOperation;
      render();
    }}
  })();
  await animation;
}
async function start(mode,strategy='libere'){
  if(strategy==='selezionate'&&!stato.selectedStrategies.length)return;
  if(strategy==='selezionate')stato.activeStrategies=stato.selectedStrategies.slice();
  ++runToken;Mani.abort();await animation;
  stato.mode=mode;stato.strategy=strategy;stato.history=[];stato.index=-1;stato.deck=[];stato.revealed=false;
  const first=mode==='esplora'?{n:0,key:'n0'}:null;
  stato.history.push(first||nextCard());stato.index=0;
  if(mode==='operazioni'){stato.customA=card().a;stato.customB=card().b;stato.customOp=card().op;}
  render();await animateCard();
}
async function menu(){++runToken;Mani.abort();await animation;stato.mode='menu';stato.busy=false;render();}
async function next(){
  if(stato.mode==='esplora'){return chooseNumber((card().n+1)%21);}
  if(stato.index<stato.history.length-1)stato.index++;
  else{stato.history.push(nextCard());stato.index++;}
  await animateCard();
}
async function previous(){if(stato.index<=0)return;stato.index--;await animateCard();}
async function repeat(){
  if(stato.mode!=='operazioni'){await animateCard();return;}
  const my=++runToken;Mani.abort();await animation;
  if(my!==runToken)return;
  Mani.clearAbort();Mani.setInstant(card().a);
  stato.busy=false;stato.revealed=false;stato.phase='predict';render();
}
async function chooseNumber(n){
  stato.history=stato.history.slice(0,stato.index+1);stato.history.push({n,key:'n'+n});stato.index++;await animateCard(false);
}
async function showAnswer(){
  if(stato.mode==='operazioni'&&stato.phase==='ready'){Mani.setInstant(card().a);stato.phase='predict';stato.revealed=false;render();return;}
  if(stato.mode==='operazioni'&&stato.phase==='predict'){if(!stato.busy)await animateCard(true,true);return;}
  if(stato.mode==='operazioni'&&stato.busy)return;
  stato.revealed=!stato.revealed;render();
}
function cycleSpeed(){stato.speed=(stato.speed+1)%VELOCITA.length;Mani.setSpeed(VELOCITA[stato.speed]);render();}
async function customOperation(){
  const a=Number(document.querySelector('#operand-a').value),b=Number(document.querySelector('#operand-b').value),op=document.querySelector('#operation').value;
  const c=f(a,op,b,'pd');if(c.res<0||c.res>20){document.querySelector('#composer-message').textContent='Scegli un’operazione con risultato fra 0 e 20.';return;}
  stato.customA=a;stato.customB=b;stato.customOp=op;
  stato.history=stato.history.slice(0,stato.index+1);stato.history.push(c);stato.index++;await animateCard();
}
async function openStrategies(){
  ++runToken;Mani.abort();await animation;
  stato.mode='strategie';stato.busy=false;render();
}
function toggleStrategy(id){
  if(!GIOCHI.some(g=>!g.misto&&g.id===id))return;
  if(stato.selectedStrategies.includes(id))stato.selectedStrategies=stato.selectedStrategies.filter(value=>value!==id);
  else stato.selectedStrategies.push(id);
  render();
}
function clearStrategies(){stato.selectedStrategies=[];render();}
function modeTitle(){
  if(stato.mode==='riconosci')return 'Che numero è?';
  if(stato.mode==='esplora')return 'Esplora le mani';
  if(stato.strategy==='libere')return 'Addizioni e sottrazioni';
  if(stato.strategy==='misto')return 'Strategie · Tutte in ordine casuale';
  if(stato.strategy==='selezionate')return stato.activeStrategies.length===1?'Strategie · '+GIOCHI.find(g=>g.id===stato.activeStrategies[0]).nome:'Strategie · '+stato.activeStrategies.length+' selezionate';
  return GIOCHI.find(g=>g.id===stato.strategy).nome;
}
function menuHTML(){return `<div class="hero"><div class="eyebrow">Per contare, capire, riprovare</div><h1>I numeri prendono <span>forma.</span></h1><p class="intro">Quattro mani affiancate per vedere i gruppi di cinque. Scegli un’attività e ragioniamo insieme, senza fretta.</p></div>
<div class="mode-grid">
<button class="mode-card" data-mode="riconosci" onclick="start('riconosci')"><span class="mode-icon" aria-hidden="true">👀</span><span><strong>Che numero è?</strong><small>Le dita sono già alzate tutte insieme. La classe riconosce il numero senza contare il movimento.</small></span></button>
<button class="mode-card" data-mode="esplora" onclick="start('esplora')"><span class="mode-icon" aria-hidden="true">✋</span><span><strong>Esplora liberamente</strong><small>Scegli un numero da 0 a 20. Le mani lo costruiscono un dito alla volta.</small></span></button>
<button class="mode-card" data-mode="strategie" onclick="openStrategies()"><span class="mode-icon" aria-hidden="true">🧠</span><span><strong>Strategie</strong><small>Seleziona o utilizza tutte le strategie che abbiamo imparato.</small></span></button>
<button class="mode-card" data-mode="operazioni" onclick="start('operazioni')"><span class="mode-icon" aria-hidden="true">＋</span><span><strong>Addizioni e sottrazioni</strong><small>Si forma il numero e cerchiamo una strada per trovare il risultato.</small></span></button>
</div>`;}
function strategiesHTML(){
  const choice=g=>`<button class="btn strategy-choice ${stato.selectedStrategies.includes(g.id)?'chosen':''}" data-strategy="${g.id}" aria-pressed="${stato.selectedStrategies.includes(g.id)}" onclick="toggleStrategy('${g.id}')">${stato.selectedStrategies.includes(g.id)?'✓ ':''}${g.nome}</button>`;
  const base=GIOCHI.filter(g=>['uno','due','zero','doppi'].includes(g.id));
  base.sort((a,b)=>['uno','due','doppi','zero'].indexOf(a.id)-['uno','due','doppi','zero'].indexOf(b.id));
  const combinations=GIOCHI.filter(g=>/^c[5-9]$/.test(g.id));
  const passages=GIOCHI.filter(g=>['p5','pd'].includes(g.id));
  const count=selectedOperations(stato.selectedStrategies).length;
  return `<div class="toolbar"><button class="btn small" onclick="menu()">‹ Menu</button><span class="mode-title">🧠 Strategie</span></div>
  <div class="strategy-intro"><h1>Strategie</h1></div>
  <div class="all-strategies"><div><strong>Tutte le strategie, in ordine casuale</strong><p>Un riepilogo con le operazioni delle diverse strategie mescolate fra loro.</p></div><button class="btn primary" id="all-strategies" onclick="start('operazioni','misto')">Usa tutte le strategie</button></div>
  <section class="strategy-panel" aria-label="Seleziona le strategie"><h2>Vuoi allenare una strategia precisa?</h2><p class="hint">Scegli una o più strategie con i pulsanti qui sotto.</p>
    <h3>Piccoli cambiamenti e doppi</h3><div class="strategy-buttons">${base.map(choice).join('')}</div>
    <h3>Combinazioni con alcuni numeri</h3><div class="strategy-buttons">${combinations.map(choice).join('')}</div>
    <h3>Passaggi</h3><div class="strategy-buttons">${passages.map(choice).join('')}</div>
    <div class="strategy-launch"><p id="strategy-selection" role="status" aria-live="polite">${stato.selectedStrategies.length?(stato.selectedStrategies.length===1?'1 strategia selezionata':stato.selectedStrategies.length+' strategie selezionate')+' · '+count+' operazioni diverse':'Seleziona almeno una strategia.'}</p><div class="action-row"><button class="btn" onclick="clearStrategies()" ${stato.selectedStrategies.length?'':'disabled'}>Deseleziona tutte</button><button class="btn primary" id="start-selected" onclick="start('operazioni','selezionate')" ${stato.selectedStrategies.length?'':'disabled'}>Esercitati sulle selezionate</button></div><p class="hint">Le operazioni delle strategie scelte saranno proposte in ordine casuale.</p></div>
  </section>`;
}
function composer(){const options=selected=>Array.from({length:21},(_,n)=>`<option ${n===selected?'selected':''}>${n}</option>`).join('');return `<details class="teacher-tools" style="width:min(100%,680px);margin:0"><summary>Scegli tu un’operazione</summary><div class="composer"><select id="operand-a" aria-label="Primo numero">${options(stato.customA)}</select><select id="operation" aria-label="Operazione"><option value="+" ${stato.customOp==='+'?'selected':''}>+</option><option value="-" ${stato.customOp==='-'?'selected':''}>−</option></select><select id="operand-b" aria-label="Secondo numero">${options(stato.customB)}</select><button class="btn small primary" onclick="customOperation()">Mostra con le mani</button></div><p id="composer-message" class="hint" role="status"></p></details>`;}
function render(){
  const isMenu=stato.mode==='menu'||stato.mode==='strategie';document.querySelector('#menu').hidden=!isMenu;document.querySelector('#workspace').hidden=isMenu;
  if(isMenu){document.querySelector('#menu').innerHTML=stato.mode==='strategie'?strategiesHTML():menuHTML();return;}
  const c=card();
  document.querySelector('#toolbar').innerHTML=`<div class="toolbar"><div class="toolbar-side"><button class="btn small" onclick="menu()">‹ Menu</button><span class="mode-title">${modeTitle()}</span>${stato.mode==='operazioni'&&stato.strategy!=='libere'?'<button class="btn small" onclick="openStrategies()">Cambia strategie</button>':''}</div><button class="btn small" onclick="cycleSpeed()">Velocità: ${NOMI_VEL[stato.speed]}</button></div>`;
  const prompt=stato.mode==='riconosci'?(stato.revealed?`<span class="result">${c.n}</span>`:'Che numero vedi?'):stato.mode==='esplora'?`<span class="result">${c.n}</span>`:`${c.a} ${symbol(c.op)} ${c.b}${stato.revealed?` = <span class="result">${c.res}</span>`:''}`;
  document.querySelector('#exercise').innerHTML=`<div class="prompt">${prompt}</div><p class="hint">${stato.mode==='riconosci'?'Osserva le mani e rispondi a voce. Non occorre scrivere.':stato.mode==='esplora'?'Dal pollice al mignolo: ogni mano completa vale cinque.':(c.op==='-'?'Togliamo prima gruppi completi di dieci o cinque, poi le dita da destra. Le dita rimaste non si spostano.':'Prevedi il risultato: aggiungiamo gruppi di cinque o dieci sulle mani libere, poi completiamo la mano già aperta.')}</p>`;
  document.querySelector('#actions').innerHTML=`<p class="feedback" role="status">${stato.busy?stato.phase:stato.phase==='ready'?'Premi Avanti: il primo numero apparirà tutto insieme.':stato.phase==='predict'?`Le mani mostrano ${c.a}. Qual è il risultato di ${c.a} ${symbol(c.op)} ${c.b}?`:stato.revealed?(stato.mode==='riconosci'?`Sono ${c.n} dita.`:`${c.a} ${symbol(c.op)} ${c.b} = ${c.res}`):'Osserviamo e ragioniamo insieme.'}</p><div class="action-row"><button class="btn" onclick="previous()" ${stato.index<=0?'disabled':''}>‹ Precedente</button><button class="btn" onclick="repeat()">↻ Ripeti</button>${stato.mode!=='esplora'?`<button class="btn answer" onclick="showAnswer()" ${stato.mode==='operazioni'&&stato.busy?'disabled':''}>${stato.phase==='ready'?'Avanti':stato.phase==='predict'?'Mostra risultato':stato.revealed?'Nascondi risposta':stato.mode==='riconosci'?'Mostra risposta':'Mostra risultato'}</button>`:''}<button class="btn primary" onclick="next()">Successivo ›</button></div>${stato.mode==='esplora'?`<div class="number-grid">${Array.from({length:21},(_,n)=>`<button class="btn ${c.n===n?'selected':''}" onclick="chooseNumber(${n})">${n}</button>`).join('')}</div>`:stato.mode==='operazioni'&&stato.strategy==='libere'?composer():''}`;
}
document.addEventListener('keydown',event=>{
  if(['menu','strategie'].includes(stato.mode)||['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY'].includes(event.target.tagName))return;
  if(event.key==='ArrowRight'){event.preventDefault();next();}
  if(event.key==='ArrowLeft'){event.preventDefault();previous();}
  if(event.key===' '){event.preventDefault();repeat();}
});
Mani.init(document.querySelector('#mat'));render();
</script></body></html>
