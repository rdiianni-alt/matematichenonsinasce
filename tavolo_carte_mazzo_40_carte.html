<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Il tavolo delle carte · Matematiche non si nasce</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2eb;font-family:Arial,sans-serif;color:#27342d}header{padding:15px 16px 8px;text-align:center}h1{font-size:clamp(21px,4vw,31px);margin:0 0 5px}p{margin:0;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px;justify-content:center}button{border:0;border-radius:9px;padding:12px 17px;font-size:16px;font-weight:bold;cursor:pointer;background:#245d46;color:white}button.secondary{background:#e1e5de;color:#243c30}#table{height:clamp(420px,68vh,850px);position:relative;margin:0 12px;border-radius:16px;background:#dce9dd;border:2px solid #b7cbb8;overflow:hidden;touch-action:none}.card{position:absolute;width:clamp(78px,13vw,116px);aspect-ratio:0.70;background:#fff;border:1px solid #aaa;border-radius:9px;box-shadow:0 3px 7px #0003;touch-action:none;user-select:none;cursor:grab}.card.red{color:#cf3450}.card.black{color:#252b2a}.corner{position:absolute;top:5px;left:6px;font-size:clamp(13px,2vw,19px);font-weight:bold;line-height:1;text-align:center}.corner.end{top:auto;left:auto;bottom:5px;right:6px;transform:rotate(180deg)}.piparea{position:absolute;inset:17% 19%;display:block}.pip{position:absolute;font-size:clamp(16px,2.5vw,25px);line-height:1;transform:translate(-50%,-50%);white-space:nowrap}.card.dense .pip{font-size:clamp(13px,2vw,20px)}.pip.flip{transform:rotate(180deg)}#ink{position:absolute;inset:0;width:100%;height:100%;z-index:10000;pointer-events:none;touch-action:none}button:disabled{opacity:.55;cursor:not-allowed}button.active{background:#e50086;color:white;box-shadow:0 0 0 3px #f6b0d8 inset}footer{text-align:center;padding:12px;font-size:12px;color:#596d5d}@media(max-width:500px){#table{height:65vh;min-height:430px}.card{width:78px}.pip{font-size:18px}.card.dense .pip{font-size:15px}.controls button{font-size:14px;padding:11px 12px}}</style></head><body><header><h1>Il tavolo delle carte</h1><p>Pesca, sposta e raggruppa le carte per costruire le somme.</p></header><div class="controls"><button id="draw">+ Pesca una carta</button><span id="remaining" role="status" aria-live="polite" style="align-self:center;font-weight:bold;padding:8px">40 carte nel mazzo</span><button id="undo" class="secondary">Togli l'ultima</button><button id="clear" class="secondary">Svuota il tavolo</button><button id="pen" class="secondary" aria-pressed="false">✏️ Scrivi in rosa</button><button id="erase" class="secondary">Cancella scritte</button></div><main id="table" aria-label="Tavolo delle carte"><canvas id="ink" aria-label="Superficie per scrivere in rosa"></canvas></main><footer>matematichenonsinasce.com · idee e materiali per la scuola primaria</footer><script>
(function(){var table=document.getElementById('table'),cards=[],highest=1,active=null;var suits=['♥','♦','♣','♠'],deck=[],drawn=[];var drawButton=document.getElementById('draw'),remaining=document.getElementById('remaining');
function shuffle(){for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=deck[i];deck[i]=deck[j];deck[j]=tmp}}
function resetDeck(){deck=[];drawn=[];for(var si=0;si<suits.length;si++)for(var n=1;n<=10;n++)deck.push({n:n,s:suits[si]});shuffle();updateCount()}
function updateCount(){remaining.textContent=deck.length?'Carte rimaste: '+deck.length+' / 40':'Mazzo terminato · 0 / 40';drawButton.disabled=!deck.length;drawButton.textContent=deck.length?'+ Pesca una carta':'Mazzo terminato'}
resetDeck();
// Coordinates are expressed in a 3-column by 6-row grid, following conventional French-suited card pip layouts.
var layouts={1:[[1,2.5]],2:[[1,0],[1,5]],3:[[1,0],[1,2.5],[1,5]],4:[[0,0],[2,0],[0,5],[2,5]],5:[[0,0],[2,0],[1,2.5],[0,5],[2,5]],6:[[0,0],[2,0],[0,2.5],[2,2.5],[0,5],[2,5]],7:[[0,0],[2,0],[1,1.25],[0,2.5],[2,2.5],[0,5],[2,5]],8:[[0,0],[2,0],[1,1.25],[0,2.5],[2,2.5],[1,3.75],[0,5],[2,5]],9:[[0,0],[2,0],[0,1.65],[2,1.65],[1,2.5],[0,3.35],[2,3.35],[0,5],[2,5]],10:[[0,0],[2,0],[1,0.9],[0,1.65],[2,1.65],[0,3.35],[2,3.35],[1,4.1],[0,5],[2,5]]};
function draw(){if(!deck.length)return;var item=deck.pop(),n=item.n,s=item.s;drawn.push(item);updateCount();var c=document.createElement('div');c.className='card '+((s==='♥'||s==='♦')?'red':'black')+(n>=8?' dense':'');var corner=document.createElement('div');corner.className='corner';corner.innerHTML=(n===1?'A':n);c.appendChild(corner);var area=document.createElement('div');area.className='piparea';layouts[n].forEach(function(pos){var p=document.createElement('span');p.className='pip';p.textContent=s;p.style.left=(pos[0]===0?17:pos[0]===2?83:50)+'%';p.style.top=(12+pos[1]*15.2)+'%';p.style.transform='translate(-50%,-50%)'+(pos[1]>2.5?' rotate(180deg)':'');area.appendChild(p)});c.appendChild(area);var end=document.createElement('div');end.className='corner end';end.innerHTML=(n===1?'A':n);c.appendChild(end);table.appendChild(c);var idx=cards.length;var maxX=Math.max(0,table.clientWidth-c.offsetWidth-5);c.style.left=Math.min(maxX,12+(idx%6)*Math.min(95,Math.max(36,(table.clientWidth-100)/6)))+'px';c.style.top=(15+(Math.floor(idx/6)%7)*38)+'px';c.style.zIndex=++highest;cards.push(c);c.addEventListener('pointerdown',function(e){e.preventDefault();var rect=c.getBoundingClientRect();active={c:c,dx:e.clientX-rect.left,dy:e.clientY-rect.top};c.style.zIndex=++highest;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',function(e){if(!active||active.c!==c)return;var r=table.getBoundingClientRect();c.style.left=Math.max(0,Math.min(table.clientWidth-c.offsetWidth,e.clientX-r.left-active.dx))+'px';c.style.top=Math.max(0,Math.min(table.clientHeight-c.offsetHeight,e.clientY-r.top-active.dy))+'px'});c.addEventListener('pointerup',function(){active=null});c.addEventListener('pointercancel',function(){active=null})}
document.getElementById('draw').onclick=draw;document.getElementById('undo').onclick=function(){var c=cards.pop();if(c){c.remove();var item=drawn.pop();deck.push(item);shuffle();updateCount()}};document.getElementById('clear').onclick=function(){cards.forEach(function(c){c.remove()});cards=[];resetDeck();ctx.clearRect(0,0,table.clientWidth,table.clientHeight)};draw();draw();draw();
var canvas=document.getElementById('ink'),ctx=canvas.getContext('2d'),pen=document.getElementById('pen'),writing=false,painting=false,last=null;
function sizeCanvas(){var old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;if(old.width&&old.height)old.getContext('2d').drawImage(canvas,0,0);var w=table.clientWidth,h=table.clientHeight,dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(old.width&&old.height)ctx.drawImage(old,0,0,old.width,old.height,0,0,w,h);ctx.strokeStyle='#f00096';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round'}
sizeCanvas();window.addEventListener('resize',sizeCanvas);
pen.onclick=function(){writing=!writing;pen.classList.toggle('active',writing);pen.textContent=writing?'✓ Fine scrittura':'✏️ Scrivi in rosa';pen.setAttribute('aria-pressed',writing?'true':'false');canvas.style.pointerEvents=writing?'auto':'none'};
document.getElementById('erase').onclick=function(){ctx.clearRect(0,0,table.clientWidth,table.clientHeight)};
function point(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',function(e){if(!writing)return;e.preventDefault();painting=true;last=point(e);canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last.x,last.y,2.5,0,Math.PI*2);ctx.fillStyle='#f00096';ctx.fill()});
canvas.addEventListener('pointermove',function(e){if(!painting)return;e.preventDefault();var p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
function stop(){painting=false;last=null}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
})();
</script></body></html>
