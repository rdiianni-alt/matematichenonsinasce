<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moltiplicazione visiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2d3142;
    --muted: #6b7088;
    --accent: #ff7a59;
    --accent-dark: #e85d3c;
    --blue: #4f7cff;
    --green: #2fa86b;
    --red: #e04a4a;
    --card: #ffffff;
    --radius: 18px;
    --shadow: 0 6px 24px rgba(45, 49, 66, 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 10%, #fff3d6 0, transparent 40%),
      radial-gradient(circle at 90% 90%, #dfe9ff 0, transparent 45%),
      #f7f4ee;
    display: flex; flex-direction: column;
    padding: 14px 18px;
    gap: 14px;
  }

  /* ---------- intestazione ---------- */
  header { display: flex; align-items: center; gap: 12px; }
  a.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo img { width: 46px; height: 46px; object-fit: contain; border-radius: 50%; background: #fff; box-shadow: var(--shadow); }
  .logo-text { font-size: 0.8rem; font-weight: 700; color: var(--muted); line-height: 1.1; }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.2px; margin-left: 6px; }
  header h1 span { color: var(--accent); }

  /* ---------- layout principale ---------- */
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
  }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }

  #stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #board {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
    background-image: radial-gradient(#e7e3da 1px, transparent 1px);
    background-size: 18px 18px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  #canvas-wrap { position: relative; padding: 30px; }
  canvas { display: block; touch-action: manipulation; }

  /* barra della formula */
  #formula {
    border-top: 2px dashed #eee8dc;
    padding: 14px 18px;
    font-size: 1.25rem; font-weight: 800;
    text-align: center; line-height: 1.8;
    transition: background 0.3s;
    border-radius: 0 0 var(--radius) var(--radius);
  }
  #formula .eq { color: var(--muted); margin: 0 4px; }
  #formula .final {
    display: inline-block; padding: 0 12px; border-radius: 10px;
    background: var(--green); color: #fff;
    animation: pop 0.45s ease-out;
  }
  #formula.done { background: #eafaf1; }
  @keyframes pop { 0% { transform: scale(0.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

  /* etichette sui bordi */
  .edge-label, .preview-label {
    position: absolute; pointer-events: none; white-space: nowrap;
    font-weight: 900; font-size: 0.95rem;
  }
  .edge-label { color: var(--muted); }
  .preview-label {
    color: #fff; background: var(--ink);
    padding: 1px 8px; border-radius: 8px; font-size: 0.9rem;
  }

  /* caselle dentro i pezzi */
  .rect-input {
    position: absolute;
    border: 2px solid rgba(45,49,66,0.35);
    border-radius: 8px;
    background: rgba(255,255,255,0.92);
    text-align: center; font-family: inherit; font-weight: 900;
    color: var(--ink); outline: none;
    transform: translate(-50%, -50%);
    -moz-appearance: textfield;
    transition: border-color 0.15s, background 0.15s;
  }
  .rect-input::-webkit-outer-spin-button,
  .rect-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rect-input::placeholder { color: #b9bccb; }
  .rect-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,124,255,0.25); }
  .rect-input.correct { border-color: var(--green); color: var(--green); background: #eafaf1; }
  .rect-input.wrong { border-color: var(--red); color: var(--red); background: #fdeeee; }

  /* ---------- pannello destro ---------- */
  aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .panel { padding: 18px; }
  .panel h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; font-weight: 800; }

  .op-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .op-row .times { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
  .num {
    width: 92px; font-family: inherit; font-size: 2.4rem; font-weight: 900;
    text-align: center; color: var(--ink);
    border: 3px solid #e4e0d6; border-radius: 14px; padding: 4px 2px;
    outline: none; background: #fffdf8;
    -moz-appearance: textfield;
  }
  .num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num:focus { border-color: var(--accent); }
  .num-label { display: block; text-align: center; font-size: 0.75rem; color: var(--muted); font-weight: 700; margin-top: 4px; }

  .btn {
    font-family: inherit; font-weight: 800; font-size: 1.05rem;
    border: none; border-radius: 12px; padding: 11px 16px; cursor: pointer;
    width: 100%;
    transition: transform 0.08s, background 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; margin-top: 14px; box-shadow: 0 4px 0 var(--accent-dark); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-light { background: #f1eee7; color: var(--ink); }
  .btn-light:hover { background: #e6e1d6; }
  .btn + .btn { margin-top: 8px; }

  .error { color: var(--red); font-size: 0.85rem; font-weight: 700; text-align: center; margin-top: 8px; min-height: 1em; }

  .tips { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 0.92rem; font-weight: 700; color: var(--ink); }
  .tips li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.35; }
  .tips .ico {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 900; color: #fff;
  }

  /* ---------- schermi stretti: pannello sopra ---------- */
  @media (max-width: 820px) {
    html, body { height: auto; }
    body { padding: 10px; min-height: 100vh; }
    main { display: flex; flex-direction: column; }
    aside { display: contents; }
    #panel-op { order: 1; }
    #stage { order: 2; height: 72vh; flex: none; }
    #panel-help { order: 3; }
    header h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <a href="https://matematichenonsinasce.com/" target="_blank" class="logo">
    <img src="logo.png" alt="logo">
    <div class="logo-text">Matematiche<br>non si nasce</div>
  </a>
  <h1>Moltiplicazione <span>visiva</span></h1>
</header>

<main>
  <section id="stage" class="card">
    <div id="board">
      <div id="canvas-wrap"><canvas id="cv"></canvas></div>
    </div>
    <div id="formula"></div>
  </section>

  <aside>
    <div id="panel-op" class="panel card">
      <h2>La moltiplicazione</h2>
      <div class="op-row">
        <div><input id="fa" class="num" type="number" min="1" max="100" value="12"><span class="num-label">colonne</span></div>
        <span class="times">×</span>
        <div><input id="fb" class="num" type="number" min="1" max="100" value="8"><span class="num-label">righe</span></div>
      </div>
      <button id="start-btn" class="btn btn-primary">Disegna il rettangolo</button>
      <div id="err" class="error"></div>
    </div>

    <div id="panel-help" class="panel card">
      <h2>Come si usa</h2>
      <ul class="tips">
        <li><span class="ico" style="background:var(--blue)">✂</span>Clicca tra due quadretti per tagliare (clicca di nuovo per togliere il taglio).</li>
        <li><span class="ico" style="background:var(--accent)">?</span>Scrivi in ogni pezzo quanti quadretti contiene.</li>
      </ul>
      <button id="clear-btn" class="btn btn-light" style="margin-top:16px">Togli tutti i tagli</button>
    </div>
  </aside>
</main>

<script>
const COLORS = [
  '#8ec5ff','#9be3b4','#ffe08a','#ffb99a','#cdb4ff',
  '#7fe0d4','#ffb3c7','#b8e986','#ffd1a1','#a7c4ff',
  '#e3b5f0','#9fe6c8','#fff0a0','#c5f2d2','#ffc9b0'
];
const GAP = 6, MARGIN = 2, PAD = 30; // PAD = spazio attorno al canvas per le etichette

let cols, rows, cellSize;
let cuts = { v: [], h: [] };
let rects = [], savedValues = {};
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');
const board = document.getElementById('board');
let hoverCut = null;

const rectKey = r => `${r.c1},${r.r1},${r.c2},${r.r2}`;
const vSegs = () => [0, ...cuts.v, cols];
const hSegs = () => [0, ...cuts.h, rows];

function darkenColor(hex, f) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

/* dimensione dei quadretti in base allo spazio disponibile nel riquadro */
function computeCellSize() {
  const availW = board.clientWidth - 20 - PAD*2 - MARGIN*2;
  const availH = board.clientHeight - 20 - PAD*2 - MARGIN*2;
  // lascio spazio per qualche taglio futuro
  const extraW = Math.min(cols - 1, 4) * GAP, extraH = Math.min(rows - 1, 4) * GAP;
  const byW = Math.floor((availW - extraW) / cols);
  const byH = Math.floor((availH - extraH) / rows);
  return Math.max(5, Math.min(byW, byH, 70));
}

function buildRects() {
  const vS = vSegs(), hS = hSegs();
  rects = []; let ci = 0;
  for (let vi = 0; vi < vS.length-1; vi++)
    for (let hi = 0; hi < hS.length-1; hi++)
      rects.push({ c1: vS[vi], c2: vS[vi+1], r1: hS[hi], r2: hS[hi+1], colorIdx: ci++ % COLORS.length });
}

function cellToCanvas(cellX, cellY) {
  const vS = vSegs(), hS = hSegs();
  let px = MARGIN, py = MARGIN;
  for (let i = 0; i < vS.length-1; i++) {
    if (cellX <= vS[i+1]) { px += (cellX - vS[i]) * cellSize; break; }
    px += (vS[i+1] - vS[i]) * cellSize + GAP;
  }
  for (let i = 0; i < hS.length-1; i++) {
    if (cellY <= hS[i+1]) { py += (cellY - hS[i]) * cellSize; break; }
    py += (hS[i+1] - hS[i]) * cellSize + GAP;
  }
  return { px, py };
}

function canvasToCell(px, py) {
  const vS = vSegs(), hS = hSegs();
  let x = MARGIN, cellX = null;
  for (let i = 0; i < vS.length-1; i++) {
    const w = (vS[i+1] - vS[i]) * cellSize;
    if (px >= x - GAP/2 && px <= x + w + GAP/2) { cellX = vS[i] + Math.max(0, Math.min(px - x, w)) / cellSize; break; }
    x += w + GAP;
  }
  let y = MARGIN, cellY = null;
  for (let i = 0; i < hS.length-1; i++) {
    const h = (hS[i+1] - hS[i]) * cellSize;
    if (py >= y - GAP/2 && py <= y + h + GAP/2) { cellY = hS[i] + Math.max(0, Math.min(py - y, h)) / cellSize; break; }
    y += h + GAP;
  }
  return { cellX, cellY };
}

function canvasSize() {
  return {
    totalW: cols*cellSize + cuts.v.length*GAP + MARGIN*2,
    totalH: rows*cellSize + cuts.h.length*GAP + MARGIN*2
  };
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

/* disegna solo il canvas (veloce, usato anche per l'anteprima del taglio) */
function drawCanvas() {
  const { totalW, totalH } = canvasSize();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(totalW * dpr); canvas.height = Math.round(totalH * dpr);
  canvas.style.width = totalW + 'px'; canvas.style.height = totalH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, totalW, totalH);

  rects.forEach(rect => {
    const { px: x1, py: y1 } = cellToCanvas(rect.c1, rect.r1);
    const { px: x2, py: y2 } = cellToCanvas(rect.c2, rect.r2);
    const w = x2 - x1, h = y2 - y1;
    const col = COLORS[rect.colorIdx];
    roundRect(x1, y1, w, h, Math.min(8, cellSize/3));
    ctx.fillStyle = col; ctx.fill();
    // griglia interna
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.5;
    for (let c = rect.c1+1; c < rect.c2; c++) {
      const { px } = cellToCanvas(c, rect.r1);
      ctx.beginPath(); ctx.moveTo(px, y1); ctx.lineTo(px, y2); ctx.stroke();
    }
    for (let r = rect.r1+1; r < rect.r2; r++) {
      const { py } = cellToCanvas(rect.c1, r);
      ctx.beginPath(); ctx.moveTo(x1, py); ctx.lineTo(x2, py); ctx.stroke();
    }
    ctx.restore();
    roundRect(x1, y1, w, h, Math.min(8, cellSize/3));
    ctx.strokeStyle = darkenColor(col, 0.6); ctx.lineWidth = 2; ctx.stroke();
  });

  if (hoverCut) {
    ctx.save();
    ctx.strokeStyle = '#2d3142'; ctx.lineWidth = 3; ctx.setLineDash([8, 5]);
    ctx.beginPath();
    if (hoverCut.type === 'v') {
      const { px, py: y0 } = cellToCanvas(hoverCut.pos, 0);
      const { py: y1 } = cellToCanvas(hoverCut.pos, rows);
      ctx.moveTo(px, y0); ctx.lineTo(px, y1);
    } else {
      const { px: x0, py } = cellToCanvas(0, hoverCut.pos);
      const { px: x1 } = cellToCanvas(cols, hoverCut.pos);
      ctx.moveTo(x0, py); ctx.lineTo(x1, py);
    }
    ctx.stroke(); ctx.restore();
  }
  updatePreviewLabels();
}

/* ridisegna tutto: canvas, etichette, caselle, formula */
function render() {
  drawCanvas();
  renderEdgeLabels();
  renderInputs();
  updateFormula();
}

function addLabel(cls, text, x, y, transform) {
  const el = document.createElement('div');
  el.className = cls; el.textContent = text;
  el.style.left = (PAD + x) + 'px'; el.style.top = (PAD + y) + 'px';
  el.style.transform = transform;
  wrap.appendChild(el);
}

/* misure dei pezzi: sopra (colonne) e a sinistra (righe) */
function renderEdgeLabels() {
  wrap.querySelectorAll('.edge-label').forEach(el => el.remove());
  const vS = vSegs(), hS = hSegs();
  for (let i = 0; i < vS.length-1; i++) {
    const { px } = cellToCanvas((vS[i] + vS[i+1]) / 2, 0);
    addLabel('edge-label', vS[i+1] - vS[i], px, -6, 'translate(-50%,-100%)');
  }
  for (let i = 0; i < hS.length-1; i++) {
    const { py } = cellToCanvas(0, (hS[i] + hS[i+1]) / 2);
    addLabel('edge-label', hS[i+1] - hS[i], -8, py, 'translate(-100%,-50%)');
  }
}

/* anteprima delle misure del taglio: sotto o a destra */
function updatePreviewLabels() {
  wrap.querySelectorAll('.preview-label').forEach(el => el.remove());
  if (!hoverCut) return;
  const { totalW, totalH } = canvasSize();
  const isExisting = cuts[hoverCut.type].includes(hoverCut.pos);
  const p = hoverCut.pos;
  const segs = hoverCut.type === 'v' ? vSegs() : hSegs();
  // per un taglio esistente uso i segmenti senza quel taglio
  const base = isExisting ? segs.filter(s => s !== p) : segs;
  for (let i = 0; i < base.length-1; i++) {
    if (p > base[i] && p < base[i+1]) {
      const a = p - base[i], b = base[i+1] - p;
      if (hoverCut.type === 'v') {
        if (isExisting) {
          const { px } = cellToCanvas(p, rows);
          addLabel('preview-label', `✕  ${a + b}`, px, totalH + 6, 'translateX(-50%)');
        } else {
          addLabel('preview-label', a, cellToCanvas(base[i] + a/2, rows).px, totalH + 6, 'translateX(-50%)');
          addLabel('preview-label', b, cellToCanvas(p + b/2, rows).px, totalH + 6, 'translateX(-50%)');
        }
      } else {
        if (isExisting) {
          const { py } = cellToCanvas(cols, p);
          addLabel('preview-label', `✕  ${a + b}`, totalW + 6, py, 'translateY(-50%)');
        } else {
          addLabel('preview-label', a, totalW + 6, cellToCanvas(cols, base[i] + a/2).py, 'translateY(-50%)');
          addLabel('preview-label', b, totalW + 6, cellToCanvas(cols, p + b/2).py, 'translateY(-50%)');
        }
      }
      break;
    }
  }
}

function renderInputs() {
  wrap.querySelectorAll('.rect-input').forEach(el => el.remove());
  rects.forEach(rect => {
    const { px: x1, py: y1 } = cellToCanvas(rect.c1, rect.r1);
    const { px: x2, py: y2 } = cellToCanvas(rect.c2, rect.r2);
    const rectW = x2 - x1, rectH = y2 - y1;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.className = 'rect-input'; inp.placeholder = '?';
    inp.inputMode = 'numeric';
    inp.style.left = (PAD + (x1 + x2)/2) + 'px'; inp.style.top = (PAD + (y1 + y2)/2) + 'px';
    const boxW = Math.min(Math.max(26, rectW*0.6), 80);
    const boxH = Math.min(Math.max(20, rectH*0.5), 44);
    const fs = Math.min(Math.max(10, boxH*0.6), 24);
    inp.style.width = boxW + 'px'; inp.style.height = boxH + 'px';
    inp.style.fontSize = fs + 'px';
    const key = rectKey(rect);
    const expected = (rect.c2 - rect.c1) * (rect.r2 - rect.r1);
    const mark = v => {
      inp.classList.toggle('correct', v !== '' && parseInt(v) === expected);
      inp.classList.toggle('wrong', v !== '' && parseInt(v) !== expected);
    };
    inp.value = savedValues[key] || '';
    mark(inp.value);
    inp.addEventListener('input', e => { savedValues[key] = e.target.value; mark(e.target.value); updateFormula(); });
    inp.addEventListener('pointerdown', e => e.stopPropagation());
    inp.addEventListener('click', e => e.stopPropagation());
    wrap.appendChild(inp);
  });
}

function updateFormula() {
  const parts = [], vals = [];
  let allFilled = true, allCorrect = true;
  rects.forEach(rect => {
    const cw = rect.c2 - rect.c1, rh = rect.r2 - rect.r1;
    const tc = darkenColor(COLORS[rect.colorIdx], 0.55);
    parts.push(`<span style="color:${tc}">${cw}×${rh}</span>`);
    const s = savedValues[rectKey(rect)];
    if (s === undefined || s === '') { allFilled = false; vals.push(`<span style="color:${tc}">?</span>`); }
    else { vals.push(`<span style="color:${tc}">${parseInt(s)}</span>`); if (parseInt(s) !== cw*rh) allCorrect = false; }
  });
  const eq = '<span class="eq">=</span>', plus = '<span class="eq">+</span>';
  let html = `${cols}×${rows}`;
  if (rects.length > 1) html += ` ${eq} ` + parts.join(` ${plus} `);
  html += ` ${eq} ` + vals.join(` ${plus} `);
  const done = allFilled && allCorrect;
  if (done && rects.length > 1) html += ` ${eq} <span class="final">${cols*rows}</span>`;
  else if (done) html = `${cols}×${rows} ${eq} <span class="final">${cols*rows}</span>`;
  const f = document.getElementById('formula');
  f.innerHTML = html;
  f.classList.toggle('done', done);
}

function nearestCutLine(cellX, cellY, touch) {
  const threshPx = touch ? Math.max(14, Math.min(cellSize*0.5, 24)) : Math.max(10, Math.min(cellSize*0.45, 16));
  const tc = threshPx / cellSize;
  const nearV = Math.round(cellX), nearH = Math.round(cellY);
  const dV = Math.abs(cellX - nearV), dH = Math.abs(cellY - nearH);
  if (dV < tc && nearV > 0 && nearV < cols && dV <= dH) return { type: 'v', pos: nearV };
  if (dH < tc && nearH > 0 && nearH < rows) return { type: 'h', pos: nearH };
  return null;
}

function cutAt(e) {
  const rb = canvas.getBoundingClientRect();
  const { cellX, cellY } = canvasToCell(e.clientX - rb.left, e.clientY - rb.top);
  if (cellX === null || cellY === null) return null;
  return nearestCutLine(cellX, cellY, e.pointerType && e.pointerType !== 'mouse');
}

function toggleCut(type, pos) {
  const arr = cuts[type], idx = arr.indexOf(pos);
  if (idx === -1) { arr.push(pos); arr.sort((a, b) => a - b); }
  else arr.splice(idx, 1);
  buildRects(); render();
}

canvas.addEventListener('pointerup', e => {
  const cut = cutAt(e);
  if (cut) { hoverCut = null; toggleCut(cut.type, cut.pos); }
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const cut = cutAt(e);
  canvas.style.cursor = cut ? 'pointer' : 'default';
  if (JSON.stringify(cut) !== JSON.stringify(hoverCut)) { hoverCut = cut; drawCanvas(); }
});
canvas.addEventListener('pointerleave', () => { if (hoverCut) { hoverCut = null; drawCanvas(); } });

function initGame(c, r) {
  cols = c; rows = r;
  cuts = { v: [], h: [] }; savedValues = {}; hoverCut = null;
  cellSize = computeCellSize();
  buildRects(); render();
}

function start() {
  const fa = parseInt(document.getElementById('fa').value);
  const fb = parseInt(document.getElementById('fb').value);
  const err = document.getElementById('err');
  if (!fa || !fb || fa < 1 || fb < 1 || fa > 100 || fb > 100) { err.textContent = 'Inserisci due numeri tra 1 e 100.'; return; }
  if (fa * fb > 4000) { err.textContent = 'Prodotto troppo grande: massimo 4000.'; return; }
  err.textContent = '';
  initGame(fa, fb);
}

document.getElementById('start-btn').addEventListener('click', start);
['fa', 'fb'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') start(); }));
document.getElementById('clear-btn').addEventListener('click', () => {
  cuts = { v: [], h: [] }; savedValues = {}; hoverCut = null;
  buildRects(); render();
});

new ResizeObserver(() => {
  if (!cols) return;
  const s = computeCellSize();
  if (s !== cellSize) { cellSize = s; render(); }
}).observe(board);

start();
</script>
</body>
</html>
