<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armadio del cento</title>
<style>
  :root{
    --wood-1: #b9834f;
    --wood-2: #a06f3f;
    --wood-3: #8a5c34;
    --panel-bg: #f6efe2;
    --hidden: #e0596b;
    --hidden-dark: #c94257;
    --revealed: #4f9e63;
    --revealed-dark: #3d7f4d;
    --ink: #2c1f14;
    --paper: #fbf6ec;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #1b140d;
      --ink: #f1e6d6;
    }
  }
  :root[data-theme="dark"]{
    --paper: #1b140d;
    --ink: #f1e6d6;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .wrap{
    min-height: 100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 1.3rem 1rem 3rem;
    gap: 1.1rem;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: .3rem;
    text-decoration:none;
    color: var(--ink);
  }
  .brand img{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: contain;
  }
  .brand span{
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .01em;
  }

  header{
    text-align:center;
    max-width: 34rem;
  }

  h1{
    font-size: clamp(1.4rem, 3.2vw, 2rem);
    font-weight: 600;
    margin: 0 0 .35rem;
    letter-spacing: .01em;
  }

  p.sub{
    margin:0;
    font-size: .95rem;
    opacity: .72;
    font-style: italic;
  }

  .toolbar{
    display:flex;
    gap:.6rem;
    flex-wrap: wrap;
    justify-content:center;
  }

  button.action{
    font-family: inherit;
    font-size: .85rem;
    padding: .5rem 1rem;
    border-radius: .4rem;
    border: 1px solid rgba(44,31,20,.25);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  button.action:hover{ background: rgba(44,31,20,.07); }
  button.action:active{ transform: translateY(1px); }
  button.action:focus-visible{ outline: 2px solid var(--wood-3); outline-offset: 2px; }

  .frame{
    background: linear-gradient(160deg, var(--wood-1), var(--wood-2) 55%, var(--wood-3));
    padding: 1.1rem;
    border-radius: .6rem;
    box-shadow: 0 1.5rem 3rem -1.2rem rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.12);
    max-width: 100%;
    overflow-x: auto;
  }

  .board{
    background: var(--panel-bg);
    padding: .7rem;
    border-radius: .3rem;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    display:grid;
    grid-template-columns: repeat(2, max-content);
    gap: 1.3rem 1.5rem;
    width: max-content;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(5, minmax(2.7rem, 3.4rem));
    grid-template-rows: repeat(5, minmax(2.7rem, 3.4rem));
    gap: .32rem;
  }

  .cell{
    perspective: 400px;
  }

  .cell button{
    all: unset;
    display:block;
    width:100%;
    height:100%;
    cursor: pointer;
    border-radius: .32rem;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }

  .cell button:focus-visible{
    outline: 2px solid var(--wood-3);
    outline-offset: 2px;
  }

  .cell.revealed button{ transform: rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: .32rem;
    backface-visibility: hidden;
    font-size: 1.02rem;
    font-weight: 600;
  }

  .face.back{
    background: var(--hidden);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), inset 0 2px 0 rgba(255,255,255,.25);
  }

  .face.front{
    background: var(--revealed);
    color: #10210f;
    transform: rotateY(180deg);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25);
  }

  .cell button:hover .face.back{ background: var(--hidden-dark); }
  .cell button:hover .face.front{ background: var(--revealed-dark); }

  @media (prefers-reduced-motion: reduce){
    .cell button{ transition: none; }
  }

  @media (max-width: 480px){
    .grid{
      grid-template-columns: repeat(5, minmax(2.1rem, 2.6rem));
      grid-template-rows: repeat(5, minmax(2.1rem, 2.6rem));
      gap: .24rem;
    }
    .board{ gap: .9rem 1rem; padding: .5rem; }
    .face{ font-size: .82rem; }
    .frame{ padding: .7rem; }
  }

  footer{
    font-size: .78rem;
    opacity: .55;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://matematichenonsinasce.com" target="_blank" rel="noopener">
    <img src="https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png" alt="Logo Matematiche non si nasce" />
    <span>Matematiche non si nasce</span>
  </a>

  <header>
    <h1>Armadio del cento</h1>
    <p class="sub">Clicca su una casella per girarla e scoprire il numero</p>
  </header>

  <div class="toolbar">
    <button class="action" id="revealAll">Mostra tutti</button>
    <button class="action" id="hideAll">Nascondi tutti</button>
  </div>

  <div class="frame">
    <div class="board" id="board"></div>
  </div>

  <footer>1 – 100, da sinistra a destra, dall'alto in basso</footer>
</div>

<script>
(function(){
  const boardEl = document.getElementById('board');
  const cells = [];

  function buildQuadrant(rowStart, colStart){
    const grid = document.createElement('div');
    grid.className = 'grid';
    for(let r=0; r<5; r++){
      for(let c=0; c<5; c++){
        const row = rowStart + r;
        const col = colStart + c;
        const number = row*10 + col + 1;
        const cellWrap = document.createElement('div');
        cellWrap.className = 'cell';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-pressed', 'false');
        btn.setAttribute('aria-label', 'Casella nascosta, numero non visibile');

        const back = document.createElement('span');
        back.className = 'face back';

        const front = document.createElement('span');
        front.className = 'face front';
        front.textContent = number;

        btn.appendChild(back);
        btn.appendChild(front);
        btn.addEventListener('click', () => toggle(cellWrap, btn, number));

        cellWrap.appendChild(btn);
        grid.appendChild(cellWrap);
        cells.push({wrap: cellWrap, btn});
      }
    }
    boardEl.appendChild(grid);
  }

  function toggle(wrap, btn, number){
    const revealed = wrap.classList.toggle('revealed');
    btn.setAttribute('aria-pressed', String(revealed));
    btn.setAttribute('aria-label', revealed ? ('Numero ' + number + ', visibile') : 'Casella nascosta, numero non visibile');
  }

  buildQuadrant(0, 0);
  buildQuadrant(0, 5);
  buildQuadrant(5, 0);
  buildQuadrant(5, 5);

  document.getElementById('revealAll').addEventListener('click', () => {
    cells.forEach(({wrap, btn}) => {
      wrap.classList.add('revealed');
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  document.getElementById('hideAll').addEventListener('click', () => {
    cells.forEach(({wrap, btn}) => {
      wrap.classList.remove('revealed');
      btn.setAttribute('aria-pressed', 'false');
    });
  });
})();
</script>
</body>
</html>
