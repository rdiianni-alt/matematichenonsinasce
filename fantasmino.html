<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fantasmino · Matematiche non si nasce</title>
<style>
  :root{
    --ink:#1A1A1A; --muted:#6A6A6A; --red:#C81D25; --paper:#FFFFFF;
    --line:#BFD7EA; --line2:#E6F0F8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink); background:#fff;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{
    font:inherit; font-size:12px; font-weight:600; cursor:pointer;
    border:1px solid #CFCAC0; background:#fff; color:var(--ink);
    border-radius:999px; padding:3px 9px; line-height:1.3;
  }
  button:hover{border-color:var(--ink);}
  button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  button.primary{background:var(--red); color:#fff; border-color:var(--red);}

  /* barra comandi: una sola fascia compatta, va a capo solo se serve */
  header{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:6px 8px; border-bottom:1px solid #E6E2DC;
  }
  .cats,.tools{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; align-items:center;}
  .sw{width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #CFCAC0; cursor:pointer; padding:0;}
  .sw.on{box-shadow:0 0 0 2.5px var(--ink);}

  /* area di lavoro: fascia della carta in alto, lavagna libera sotto */
  .stage{flex:1; display:flex; flex-direction:column; min-height:0; padding:8px 10px 10px;}
  .cardBar{
    flex:none; height:clamp(70px, 15vh, 110px);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .card{
    background:#fff; border:3px solid #111; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:6px 18px; box-shadow:0 4px 12px rgba(0,0,0,.10);
    max-width:100%;
  }
  .eq{display:flex; align-items:center; gap:clamp(6px,1.5vw,10px); font-weight:700; font-size:clamp(18px,4.6vw,26px); white-space:nowrap; color:#111;}
  .eq svg{width:clamp(28px,5vw,40px); height:clamp(28px,5vw,40px); overflow:visible; flex:none;}
  .eq .sol{min-width:50px;}
  .empty{font-size:15px; color:var(--muted); text-align:center; padding:10px 16px;}

  .paper{
    flex:1; min-height:0; position:relative;
    background:var(--paper);
    border:1px solid #C9D6E2; border-radius:6px; overflow:hidden;
    background-image:
      linear-gradient(var(--line2) 1px, transparent 1px),
      linear-gradient(90deg, var(--line2) 1px, transparent 1px),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:14px 14px, 14px 14px, 70px 70px, 70px 70px;
  }
  #board{position:absolute; inset:0; width:100%; height:100%; touch-action:none; z-index:2; cursor:crosshair;}
  #board.eraser{cursor:cell;}
  .count{
    position:absolute; right:8px; bottom:6px; font-size:12px; color:var(--muted);
    background:rgba(255,255,255,.8); padding:2px 8px; border-radius:6px; z-index:3;
  }
  @media (max-width:480px){
    button{font-size:11px; padding:3px 7px;}
    .stage{padding:6px 6px 6px;}
  }
</style>
</head>
<body>

<header>
  <div class="cats" id="cats"></div>
  <div class="tools">
    <button class="primary" id="draw">Pesca una carta</button>
    <button id="sol">Mostra soluzione</button>
    <span class="sw" data-c="#111" style="background:#111" title="Penna nera"></span>
    <span class="sw" data-c="#1F5FBF" style="background:#1F5FBF" title="Penna blu"></span>
    <span class="sw" data-c="#C81D25" style="background:#C81D25" title="Penna rossa"></span>
    <span class="sw" data-c="#2E9C8C" style="background:#2E9C8C" title="Penna verde acqua"></span>
    <button id="eraser">Gomma</button>
    <button id="clear">Pulisci</button>
  </div>
</header>

<div class="stage">
  <div class="cardBar">
    <div class="card" id="card" style="display:none">
      <div class="eq" id="eq"></div>
    </div>
    <div class="empty" id="empty">Scegli una categoria e pesca una carta.</div>
  </div>
  <div class="paper" id="paper">
    <canvas id="board"></canvas>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
(function(){
  // ---------- categories (same colours as the printed cards) ----------
  var CATS = {
    "20":    {label:"Fino a 20",    d:0, max:20,   fill:"#F2B45E", dk:"#C2822A"},
    "100":   {label:"Fino a 100",   d:0, max:100,  fill:"#8ED17A", dk:"#4E9A3C"},
    "1000":  {label:"Fino a 1000",  d:0, max:1000, fill:"#E88A7A", dk:"#B45A4B"},
    "dec":   {label:"Decimi",       d:1, max:100,  fill:"#5CC8B8", dk:"#2E9C8C"},
    "cen":   {label:"Centesimi",    d:2, max:100,  fill:"#6FA8E8", dk:"#2F6FB5"},
    "mil":   {label:"Millesimi",    d:3, max:100,  fill:"#A38BE0", dk:"#6B52B0"}
  };
  var ORDER = ["20","100","1000","dec","cen","mil"];
  var current = null;
  var seen = {};          // per category: set of "a,b" already drawn
  ORDER.forEach(function(k){ seen[k] = {}; });
  var solutionOn = false;
  var lastCard = null;

  // ---------- helpers ----------
  function fmt(n, d){
    if(d === 0) return String(n);
    var p = Math.pow(10, d);
    var ip = Math.floor(n / p), fp = n % p;
    var fs = String(fp); while(fs.length < d) fs = "0" + fs;
    return ip + "," + fs;
  }
  function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function newCard(key){
    var c = CATS[key], scale = Math.pow(10, c.d), seenSet = seen[key];
    for(var tries = 0; tries < 5000; tries++){
      var a, b, s;
      if(c.d === 0){
        a = randInt(1, c.max - 1); b = randInt(1, c.max - 1); s = a + b;
        if(s > c.max) continue;
      } else {
        b = randInt(Math.max(1, scale/10), 60*scale);
        a = randInt(1, 60*scale); s = a + b;
        if(s >= 100*scale) continue;
      }
      var k = a + "," + b;
      if(seenSet[k]) continue;
      seenSet[k] = true;
      return {a:a, b:b, c:s, d:c.d, key:key};
    }
    return null; // category exhausted
  }

  // ---------- ghost drawing (SVG) ----------
  function ghostSVG(fill, dk){
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path d="M10 50 C10 8 90 8 90 50 L90 88 Q82 80 74 88 Q66 96 58 88 Q50 80 42 88 Q34 96 26 88 Q18 80 10 88 Z" fill="'+fill+'" stroke="'+dk+'" stroke-width="2.5"/>' +
      '<circle cx="24" cy="62" r="5" fill="#F4A7B9"/><circle cx="76" cy="62" r="5" fill="#F4A7B9"/>' +
      '<circle cx="36" cy="48" r="10" fill="#fff" stroke="'+dk+'" stroke-width="1.5"/>' +
      '<circle cx="64" cy="48" r="10" fill="#fff" stroke="'+dk+'" stroke-width="1.5"/>' +
      '<circle cx="38" cy="50" r="5" fill="#111"/><circle cx="66" cy="50" r="5" fill="#111"/>' +
      '<circle cx="40" cy="48" r="1.8" fill="#fff"/><circle cx="68" cy="48" r="1.8" fill="#fff"/>' +
      '<path d="M42 66 Q50 72 58 66" fill="none" stroke="'+dk+'" stroke-width="2.2" stroke-linecap="round"/>' +
      '</svg>';
  }

  // ---------- UI: category buttons ----------
  var catsEl = document.getElementById("cats");
  ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.textContent = CATS[k].label; b.dataset.k = k;
    b.addEventListener("click", function(){ selectCat(k); });
    catsEl.appendChild(b);
  });
  function selectCat(k){
    current = k;
    [].forEach.call(catsEl.children, function(b){ b.classList.toggle("on", b.dataset.k === k); });
    updateCount();
    drawCard();
  }
  function updateCount(){
    var el = document.getElementById("count");
    if(!current){ el.textContent = ""; return; }
    var drawnCount = Object.keys(seen[current] || {}).length;
    el.textContent = CATS[current].label + " · carte pescate: " + drawnCount;
  }

  // ---------- draw a card ----------
  var cardEl = document.getElementById("card");
  var eqEl = document.getElementById("eq");
  var emptyEl = document.getElementById("empty");
  function render(card){
    var c = CATS[card.key];
    var sol = solutionOn ? '<span class="sol">= '+fmt(card.b, card.d)+'</span>' : '';
    eqEl.innerHTML =
      '<span>'+fmt(card.a, card.d)+' +</span>' +
      ghostSVG(c.fill, c.dk) +
      (solutionOn ? '<span>= '+fmt(card.c, card.d)+'</span>' : '<span>= '+fmt(card.c, card.d)+'</span>');
    if(solutionOn){
      eqEl.innerHTML = '<span>'+fmt(card.a, card.d)+' +</span>' +
        ghostSVG(c.fill, c.dk) +
        '<span>= '+fmt(card.c, card.d)+'</span>' +
        '<span style="margin-left:4%;color:'+c.dk+'">(fantasmino = '+fmt(card.b, card.d)+')</span>';
    }
  }
  function drawCard(){
    if(!current){
      cardEl.style.display = "none";
      emptyEl.style.display = "block";
      emptyEl.textContent = "Scegli una categoria e pesca una carta.";
      return;
    }
    var card = newCard(current);
    if(!card){
      cardEl.style.display = "none";
      emptyEl.style.display = "block";
      emptyEl.textContent = "Hai già pescato tutte le carte di questa categoria.";
      return;
    }
    lastCard = card;
    emptyEl.style.display = "none";
    cardEl.style.display = "flex";
    render(card);
    updateCount();
  }
  document.getElementById("draw").addEventListener("click", function(){
    if(!current){ emptyEl.style.display = "block"; return; }
    drawCard();
  });
  document.getElementById("sol").addEventListener("click", function(){
    solutionOn = !solutionOn;
    this.classList.toggle("on", solutionOn);
    if(lastCard && cardEl.style.display !== "none") render(lastCard);
  });

  // ---------- whiteboard ----------
  var board = document.getElementById("board");
  var ctx = board.getContext("2d");
  var pen = "#111", eraser = false, drawing = false, lx = 0, ly = 0;
  var snapshot = null;

  function resize(){
    var r = board.getBoundingClientRect();
    var tmp = document.createElement("canvas");
    tmp.width = board.width; tmp.height = board.height;
    if(board.width) tmp.getContext("2d").drawImage(board, 0, 0);
    var dpr = window.devicePixelRatio || 1;
    board.width = Math.round(r.width * dpr); board.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(tmp, 0, 0, tmp.width / dpr, tmp.height / dpr);
  }
  function pos(e){
    var r = board.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  board.addEventListener("pointerdown", function(e){
    drawing = true; board.setPointerCapture(e.pointerId);
    var p = pos(e); lx = p.x; ly = p.y;
    ctx.beginPath(); ctx.arc(lx, ly, stroke()/2, 0, Math.PI*2);
    ctx.fillStyle = eraser ? "rgba(0,0,0,1)" : pen;
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.fill();
  });
  board.addEventListener("pointermove", function(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.strokeStyle = eraser ? "#000" : pen;
    ctx.lineWidth = stroke(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.stroke();
    lx = p.x; ly = p.y;
  });
  function end(){ drawing = false; }
  board.addEventListener("pointerup", end);
  board.addEventListener("pointercancel", end);
  function stroke(){ return eraser ? 26 : 3.2; }

  document.querySelectorAll(".sw").forEach(function(s){
    s.addEventListener("click", function(){
      pen = s.dataset.c; eraser = false;
      document.getElementById("eraser").classList.remove("on");
      document.querySelectorAll(".sw").forEach(function(x){ x.classList.toggle("on", x === s); });
      board.classList.remove("eraser");
    });
  });
  document.getElementById("eraser").addEventListener("click", function(){
    eraser = !eraser;
    this.classList.toggle("on", eraser);
    board.classList.toggle("eraser", eraser);
  });
  document.getElementById("clear").addEventListener("click", function(){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, board.width, board.height); ctx.restore();
  });

  window.addEventListener("resize", resize);
  resize();
  // default pen
  document.querySelector(".sw").classList.add("on");
  selectCat("100");
})();
</script>
</body>
</html>
