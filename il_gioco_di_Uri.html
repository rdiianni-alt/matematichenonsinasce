<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Gioco di Uri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #f5efe0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 14px;
  }

  header {
    width: 100%;
    background: #c19a6b;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .logo img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 50%;
    border: 2px solid #f5c97a;
  }
  .logo-name {
    color: #4a2e10;
    font-size: 12px;
    font-style: italic;
  }
  h1 {
    color: #4a2e10;
    font-size: 20px;
  }

  .legend {
    margin-top: 10px;
    display: flex;
    gap: 24px;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #5a2e0a;
    font-weight: bold;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* RIGA: carta + Uri affiancati, fissi */
  .gioco-row {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: min(96vw, 800px);
  }
  .uri-img {
    width: min(30vw, 240px);
    height: auto;
    flex-shrink: 0;
    object-fit: contain;
  }

  /* AREA CARTA: fissa, tutto nello stesso spazio */
  .card-area {
    margin-top: 0;
    width: min(92vw, 520px);
    height: min(44vh, 330px);
    background: #fffdf5;
    border: 3px solid #c8832a;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 12px;
    box-shadow: 0 4px 18px rgba(120,60,10,0.13);
  }
  .group {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 8px;
    max-height: 100%;
  }
  .group.coni { max-width: 45%; }
  .group.palline { max-width: 45%; }
  canvas.shape { display: block; }

  .start-msg {
    color: #c8832a;
    font-style: italic;
    font-size: 16px;
    text-align: center;
  }

  /* SOTTO LA CARTA */
  .prompt {
    margin-top: 12px;
    font-size: 20px;
    font-weight: bold;
    color: #5a2e0a;
    text-align: center;
    min-height: 28px;
  }
  .reveal {
    font-size: 44px;
    font-weight: bold;
    color: #4a2e10;
    text-align: center;
    min-height: 52px;
    line-height: 1.1;
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .btn {
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Georgia', serif;
    color: white;
    transition: background 0.2s;
  }
  .btn-new   { background: #4a7c3a; }
  .btn-new:hover   { background: #345a28; }
  .btn-check { background: #c8832a; }
  .btn-check:hover { background: #a0621a; }
  .btn-ok    { background: #2e7d32; }
  .btn-ok:hover    { background: #1b5e20; }
  .btn-no    { background: #c62828; }
  .btn-no:hover    { background: #8e1c1c; }
  .btn-print { background: #5a7a9e; font-size: 14px; }
  .btn-print:hover { background: #45607d; }
  .hidden { display: none !important; }

  .score-bar {
    margin-top: 12px;
    width: min(92vw, 520px);
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #7a3e1a;
  }

  .tablet-deco {
    font-size: 11px;
    color: #b08050;
    margin-top: 12px;
    font-style: italic;
    text-align: center;
  }

  @media (max-width: 480px) {
    h1 { font-size: 16px; }
    .prompt { font-size: 17px; }
    .reveal { font-size: 36px; }
    .btn { padding: 8px 16px; font-size: 14px; }
  }

  /* FOGLIO STAMPABILE (nascosto a schermo) */
  #print-sheet { display: none; }

  @media print {
    body * { visibility: hidden; }
    #print-sheet, #print-sheet * { visibility: visible; }
    #print-sheet {
      display: block !important;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      background: white;
    }
    .print-title {
      text-align: center;
      font-family: 'Georgia', serif;
      font-size: 20px;
      color: #4a2e10;
      margin-bottom: 16px;
    }
    .print-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 0 10px;
    }
    .print-card {
      border: 2px solid #c8832a;
      border-radius: 12px;
      min-height: 215px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      page-break-inside: avoid;
    }
    .print-card img.uri-print {
      width: 110px;
      height: auto;
      flex-shrink: 0;
      object-fit: contain;
    }
    .print-card img.logo-print {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      border-radius: 50%;
    }
    .print-shapes {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .print-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
    }
    .print-footer img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 50%;
    }
    .print-footer span {
      font-family: 'Georgia', serif;
      font-style: italic;
      color: #4a2e10;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="https://matematichenonsinasce.com/">
    <img src="https://raw.githubusercontent.com/rdiianni-alt/quiz-matematica-prima/fca31cdfe65286a5abbf269e23429e4ddc479c78/logo.png"
         onerror="this.style.display='none'" alt="Logo">
    <span class="logo-name">Matematiche non si nasce</span>
  </a>
  <h1>🏺 Il Gioco di Uri</h1>
</header>

<div class="legend">
  <div class="legend-item">
    <canvas id="leg-ball" width="28" height="28"></canvas>
    <span>= 10</span>
  </div>
  <div class="legend-item">
    <canvas id="leg-cone" width="26" height="38"></canvas>
    <span>= 1</span>
  </div>
</div>

<div class="gioco-row">
  <div class="card-area" id="card">
    <p class="start-msg">Premi "Nuova carta" per iniziare!</p>
  </div>
  <img class="uri-img" src="https://raw.githubusercontent.com/rdiianni-alt/archivio_privato/7409da0cf9bd7eba166e273bf5cf03e484ac980c/Uri.png" alt="Uri" onerror="this.style.display='none'">
</div>

<div class="prompt" id="prompt"></div>
<div class="reveal hidden" id="reveal"></div>

<div class="actions" id="actions-question">
  <button class="btn btn-new" id="btnNew" onclick="newCard()">🎲 Nuova carta</button>
  <button class="btn btn-check hidden" id="btnCheck" onclick="reveal()">👀 Controlla</button>
</div>

<div class="actions hidden" id="actions-answer">
  <button class="btn btn-ok" onclick="segna(true)">✔ Giusto</button>
  <button class="btn btn-no" onclick="segna(false)">✘ Sbagliato</button>
</div>

<div class="score-bar">
  <span id="scoreGood">✅ Corrette: 0</span>
  <span id="scoreTotal">Carte: 0</span>
</div>

<button class="btn btn-print" style="margin-top:12px" onclick="stampaSchede()">🖨️ Stampa schede (senza soluzioni)</button>

<p class="tablet-deco">Sistema numerico dei Sumeri — palline e coni di argilla</p>

<div id="print-sheet">
  <div class="print-title">🏺 Il Gioco di Uri</div>
  <div class="print-grid" id="printGrid"></div>
</div>

<script>
  // Pallina (10)
  function drawBall(canvas, size) {
    const ctx = canvas.getContext('2d');
    const cx = size / 2, cy = size / 2, r = size / 2 - 3;
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#d4855a');
    g.addColorStop(1, '#7a3010');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // Cono (1)
  function drawCone(canvas, w, h) {
    const ctx = canvas.getContext('2d');
    const tipX = w / 2, tipY = 3;
    const baseY = h - 3, baseR = w / 2 - 2;
    const g = ctx.createLinearGradient(0, tipY, w, baseY);
    g.addColorStop(0, '#c8722a');
    g.addColorStop(0.5, '#a0561a');
    g.addColorStop(1, '#7a3010');
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(tipX - baseR, baseY);
    ctx.ellipse(tipX, baseY, baseR, baseR * 0.28, 0, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(tipX, baseY, baseR, baseR * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#8b4010';
    ctx.fill();
  }

  drawBall(document.getElementById('leg-ball'), 28);
  drawCone(document.getElementById('leg-cone'), 26, 38);

  // ------- GIOCO -------
  let correct = 0, total = 0, currentNum = 0;

  function mostraAzioni(stato) {
    // stato: 'vuoto' | 'domanda' | 'risposta'
    const q = document.getElementById('actions-question');
    const a = document.getElementById('actions-answer');
    const check = document.getElementById('btnCheck');
    const rev = document.getElementById('reveal');
    const prompt = document.getElementById('prompt');

    if (stato === 'domanda') {
      q.classList.remove('hidden');
      check.classList.remove('hidden');
      a.classList.add('hidden');
      rev.classList.add('hidden');
      rev.textContent = '';
      prompt.textContent = 'Che numero è? Dillo ad alta voce!';
    } else if (stato === 'risposta') {
      q.classList.remove('hidden');
      check.classList.add('hidden');
      a.classList.remove('hidden');
      rev.classList.remove('hidden');
      rev.textContent = currentNum;
      prompt.textContent = 'Giusto o sbagliato?';
    }
  }

  function newCard() {
    currentNum = Math.floor(Math.random() * 99) + 1;
    const balls = Math.floor(currentNum / 10);
    const cones = currentNum % 10;

    const card = document.getElementById('card');
    card.innerHTML = '';

    const gBalls = document.createElement('div');
    gBalls.className = 'group palline';
    for (let i = 0; i < balls; i++) {
      const c = document.createElement('canvas');
      c.className = 'shape';
      c.width = 40; c.height = 40;
      drawBall(c, 40);
      gBalls.appendChild(c);
    }

    const gCones = document.createElement('div');
    gCones.className = 'group coni';
    for (let i = 0; i < cones; i++) {
      const c = document.createElement('canvas');
      c.className = 'shape';
      c.width = 34; c.height = 50;
      drawCone(c, 34, 50);
      gCones.appendChild(c);
    }

    card.appendChild(gBalls);
    card.appendChild(gCones);

    total++;
    document.getElementById('scoreTotal').textContent = `Carte: ${total}`;
    mostraAzioni('domanda');
  }

  function reveal() {
    mostraAzioni('risposta');
  }

  function segna(giusto) {
    if (giusto) {
      correct++;
      document.getElementById('scoreGood').textContent = `✅ Corrette: ${correct}`;
    }
    newCard();
  }

  // ------- STAMPA SCHEDE (senza soluzioni) -------
  function stampaSchede(numCarte = 8) {
    const grid = document.getElementById('printGrid');
    grid.innerHTML = '';
    const imgs = [];

    for (let i = 0; i < numCarte; i++) {
      const num = Math.floor(Math.random() * 99) + 1;
      const balls = Math.floor(num / 10);
      const cones = num % 10;

      const card = document.createElement('div');
      card.className = 'print-card';

      const logo = document.createElement('img');
      logo.className = 'logo-print';
      logo.alt = 'Logo';
      logo.src = 'https://raw.githubusercontent.com/rdiianni-alt/quiz-matematica-prima/fca31cdfe65286a5abbf269e23429e4ddc479c78/logo.png';
      logo.onerror = () => { logo.style.display = 'none'; };
      imgs.push(logo);
      card.appendChild(logo);

      const uri = document.createElement('img');
      uri.className = 'uri-print';
      uri.alt = 'Uri';
      uri.src = 'https://raw.githubusercontent.com/rdiianni-alt/archivio_privato/7409da0cf9bd7eba166e273bf5cf03e484ac980c/Uri.png';
      uri.onerror = () => { uri.style.display = 'none'; };
      imgs.push(uri);
      card.appendChild(uri);

      const shapes = document.createElement('div');
      shapes.className = 'print-shapes';

      for (let j = 0; j < balls; j++) {
        const c = document.createElement('canvas');
        c.width = 36; c.height = 36;
        drawBall(c, 36);
        shapes.appendChild(c);
      }
      for (let j = 0; j < cones; j++) {
        const c = document.createElement('canvas');
        c.width = 30; c.height = 44;
        drawCone(c, 30, 44);
        shapes.appendChild(c);
      }

      card.appendChild(shapes);
      grid.appendChild(card);
    }

    // Attende il caricamento di Uri prima di stampare (max 3 secondi)
    const attesa = imgs.map(im => im.complete ? Promise.resolve() :
      new Promise(res => { im.onload = res; im.onerror = res; }));
    Promise.race([Promise.all(attesa), new Promise(res => setTimeout(res, 3000))])
      .then(() => window.print());
  }
</script>
</body>
</html>
