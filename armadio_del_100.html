<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I pallini del 100</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }
  /* Menu iniziale: riempie tutto lo schermo, quattro grandi schede 2×2 */
  .menu { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 14px 24px 22px; gap: 14px; background: #f7f3ee; }
  .menu-head { width: 100%; max-width: 1500px; display: flex; align-items: center; justify-content: center; position: relative; min-height: 56px; }
  .logo-link { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; text-decoration: none; gap: 10px; }
  .logo img { width: 48px; height: 48px; object-fit: contain; border-radius: 50%; }
  .blog-name { font-size: 14px; font-weight: 600; color: #555; }
  .menu h1 { font-size: clamp(30px, 4.2vw, 54px); color: #222; letter-spacing: .01em; }
  .menu h1 span { color: #E24B4A; }
  .menu-cards { flex: 1; width: 100%; max-width: 1500px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 20px; }
  .menu-card { --c: #E24B4A; --soft: #fdeceb; display: flex; align-items: center; gap: clamp(16px, 2.5vw, 36px); padding: clamp(16px, 2.4vw, 34px); background: #fff; border: 3px solid var(--soft); border-radius: 24px; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .12s, box-shadow .15s, border-color .15s; }
  .menu-card:hover, .menu-card:focus-visible { border-color: var(--c); box-shadow: 0 10px 28px rgba(0,0,0,.10); transform: translateY(-2px); outline: none; }
  .menu-card.c2 { --c: #E07B1F; --soft: #fdf0e3; }
  .menu-card.c3 { --c: #2F74C8; --soft: #e8f0fb; }
  .menu-card.c4 { --c: #3B9358; --soft: #e7f4ea; }
  .mini { flex: none; width: clamp(110px, 24vh, 240px); height: auto; background: var(--soft); border-radius: 18px; padding: 10px; }
  .menu-txt { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .menu-card h2 { font-size: clamp(22px, 2.7vw, 40px); font-weight: 700; color: var(--c); line-height: 1.1; }
  .menu-card p { font-size: clamp(15px, 1.5vw, 21px); color: #555; line-height: 1.4; }
  .gioca { align-self: flex-start; margin-top: 4px; padding: 8px 20px; border-radius: 999px; background: var(--c); color: #fff; font-weight: 700; font-size: clamp(14px, 1.3vw, 18px); }
  @media (max-width: 760px) {
    .menu-cards { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .logo-link { position: static; transform: none; }
    .menu-head { flex-direction: column; gap: 6px; }
    .mini { width: 96px; }
  }
  .screen { display: none; flex-direction: column; align-items: center; padding: 12px 16px; min-height: 100vh; }
  .screen.active { display: flex; }
  .back-btn { align-self: flex-start; font-size: 14px; color: #888; background: none; border: none; cursor: pointer; margin-bottom: 4px; padding: 4px 0; }
  .back-btn:hover { color: #E24B4A; }
  .game-brand { font-size: 13px; font-weight: 600; color: #E24B4A; letter-spacing: .03em; margin-bottom: 2px; }
  h1.game-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; color: #222; }
  .grid { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
  .row-gap { height: 14px; }
  .row { display: flex; gap: 5px; align-items: center; justify-content: center; }
  .col-gap { width: 14px; }
  .ball { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #bbb; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #bbb; transition: background 0.15s, border-color 0.15s, color 0.15s; user-select: none; }
  .ball.on { background: #E24B4A; border-color: #A32D2D; color: #fff; }
  .ball.single { background: #E24B4A; border-color: #A32D2D; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 420px; }
  /* Pallini a sinistra, comandi a destra: tutto in un solo schermo (LIM) */
  .game-body { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; }
  .game-body .grid { margin-bottom: 0; }
  .game-body .controls { width: auto; min-width: 240px; max-width: 320px; gap: 12px; }
  @media (max-width: 760px) {
    .game-body { flex-direction: column; gap: 16px; }
    .game-body .controls { width: 100%; max-width: 420px; }
  }
  .btn { font-size: 16px; padding: 10px 28px; border-radius: 8px; border: 1.5px solid #bbb; background: #fff; cursor: pointer; font-weight: 500; }
  .btn:hover { background: #f0f0f0; }
  .btn.primary { background: #E24B4A; border-color: #A32D2D; color: #fff; }
  .btn.primary:hover { background: #c73938; }
  .num-box { font-size: 64px; font-weight: 700; color: #222; text-align: center; line-height: 1; }
  .answer-input { font-size: 32px; font-weight: 700; text-align: center; width: 100px; padding: 6px; border: 2px solid #bbb; border-radius: 8px; }
  .answer-row { display: flex; align-items: center; gap: 10px; }
  .hint { font-size: 18px; color: #555; min-height: 28px; text-align: center; }
  .ball.correct { background: #4CAF50; border-color: #2E7D32; color: #fff; }
  .question { font-size: 26px; font-weight: 700; color: #222; text-align: center; }

  @media (max-width: 480px) {
    .grid { gap: 3px; }
    .row { gap: 3px; }
    .col-gap { width: 8px; }
    .row-gap { height: 8px; }
    .ball { width: 28px; height: 28px; font-size: 9px; }
    .num-box { font-size: 48px; }
    .question { font-size: 20px; }
  }
  .feedback { font-size: 22px; font-weight: 700; min-height: 32px; text-align: center; }
  .feedback.ok { color: #2E7D32; }
  .feedback.no { color: #E24B4A; }

  /* --- Stampa scheda PDF: si sceglie quante pagine e il PDF si scarica subito --- */
  #printModalOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  #printModalOverlay.active { display: flex; }
  .print-modal { background: #fff; border-radius: 16px; padding: 26px 30px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .print-modal h3 { font-size: 20px; color: #222; font-weight: 700; text-align: center; }
  .print-modal .sub { font-size: 14px; color: #666; text-align: center; margin-top: -8px; }
  .pages-choice { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .pages-choice button { width: 64px; height: 64px; font-size: 26px; font-weight: 700; border-radius: 14px; border: 2px solid #A32D2D; background: #fff; color: #A32D2D; cursor: pointer; }
  .pages-choice button:hover { background: #E24B4A; color: #fff; }
  .print-status { font-size: 14px; color: #555; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>

<div id="menuScreen" class="menu">
  <div class="menu-head">
    <a href="https://matematichenonsinasce.com/" class="logo-link" target="_blank" rel="noopener">
      <div class="logo"><img src="https://raw.githubusercontent.com/rdiianni-alt/archivio_privato/988498e303d047e2e04caa80073d184ee4d392c7/logo.png" alt="Matematiche non si nasce"></div>
      <div class="blog-name">Matematiche non si nasce</div>
    </a>
    <h1>I pallini del <span>100</span></h1>
  </div>
  <div class="menu-cards">
    <button type="button" class="menu-card c1" onclick="startGame('conta')">
      <svg class="mini" data-mini="conta" viewBox="0 0 108 108" aria-hidden="true"></svg>
      <span class="menu-txt"><h2>Quante palline?</h2><p>Si colorano alcune palline. Quante sono?</p><span class="gioca">Gioca →</span></span>
    </button>
    <button type="button" class="menu-card c2" onclick="startGame('trova')">
      <svg class="mini" data-mini="trova" viewBox="0 0 108 108" aria-hidden="true"></svg>
      <span class="menu-txt"><h2>Trova la pallina</h2><p>Viene indicato un numero. Qual è la pallina corrispondente?</p><span class="gioca">Gioca →</span></span>
    </button>
    <button type="button" class="menu-card c3" onclick="startGame('indovina')">
      <svg class="mini" data-mini="indovina" viewBox="0 0 108 108" aria-hidden="true"></svg>
      <span class="menu-txt"><h2>Che numero è?</h2><p>Si accende una pallina. Che numero è?</p><span class="gioca">Gioca →</span></span>
    </button>
    <button type="button" class="menu-card c4" onclick="startGame('semplice')">
      <svg class="mini" data-mini="semplice" viewBox="0 0 108 108" aria-hidden="true"></svg>
      <span class="menu-txt"><h2>Pallini liberi</h2><p>Costruisci un percorso colorando i pallini: i bambini dicono quale numero c'è dietro ogni pallino colorato.</p><span class="gioca">Gioca →</span></span>
    </button>
  </div>
</div>

<div id="contaScreen" class="screen">
  <button class="back-btn" onclick="goMenu()">← Menu</button>
  <div class="game-brand">I pallini del 100</div>
  <h1 class="game-title">Quante palline sono colorate?</h1>
  <div class="game-body">
  <div class="grid" id="contaGrid"></div>
  <div class="controls">
    <button class="btn" onclick="newConta()">🎲 Nuovo numero</button>
    <div class="answer-row">
      <input type="number" id="contaInput" class="answer-input" placeholder="?" onkeydown="if(event.key==='Enter') checkConta()">
      <button class="btn" onclick="checkConta()">Verifica</button>
    </div>
    <div class="feedback" id="contaFeedback"></div>
    <div class="num-box" id="contaNum">?</div>
    <div class="hint" id="contaHint"></div>
    <button class="btn primary" id="contaRevBtn" onclick="revealConta()">Mostra risposta</button>
    <button class="btn" onclick="openPrintModal()">🖨️ Stampa scheda</button>
  </div>
  </div>
</div>

<div id="trovaScreen" class="screen">
  <button class="back-btn" onclick="goMenu()">← Menu</button>
  <div class="game-brand">I pallini del 100</div>
  <h1 class="game-title">Trova la pallina!</h1>
  <div class="game-body">
  <div class="grid" id="trovaGrid"></div>
  <div class="controls">
    <button class="btn" onclick="newTrova()">🎲 Nuovo numero</button>
    <div class="question" id="trovaQuestion">—</div>
    <div class="feedback" id="trovaFeedback"></div>
    <button class="btn" onclick="openPrintModal()">🖨️ Stampa scheda</button>
  </div>
  </div>
</div>

<div id="indovinaScreen" class="screen">
  <button class="back-btn" onclick="goMenu()">← Menu</button>
  <div class="game-brand">I pallini del 100</div>
  <h1 class="game-title">Che numero è?</h1>
  <div class="game-body">
  <div class="grid" id="indovinaGrid"></div>
  <div class="controls">
    <button class="btn" onclick="newIndovina()">🎲 Nuova pallina</button>
    <div class="answer-row">
      <input type="number" id="indovinaInput" class="answer-input" placeholder="?" onkeydown="if(event.key==='Enter') checkIndovina()">
      <button class="btn" onclick="checkIndovina()">Verifica</button>
    </div>
    <div class="feedback" id="indovinaFeedback"></div>
    <div class="num-box" id="indovinaNum"></div>
    <div class="hint" id="indovinaHint"></div>
    <button class="btn primary" id="indovinaRevBtn" onclick="revealIndovina()">Controlla!</button>
    <button class="btn" onclick="openPrintModal()">🖨️ Stampa scheda</button>
  </div>
  </div>
</div>

<div id="sempliceScreen" class="screen">
  <button class="back-btn" onclick="goMenu()">← Menu</button>
  <div class="game-brand">I pallini del 100</div>
  <h1 class="game-title">Pallini liberi</h1>
  <div class="game-body">
  <div class="grid" id="sempliceGrid"></div>
  <div class="controls">
    <button class="btn" onclick="resetSemplice()">🔄 Azzera</button>
    <button class="btn primary" id="sempliceRevBtn" onclick="toggleNumeriSemplice()">Mostra i numeri</button>
    <button class="btn" onclick="openPrintModal()">🖨️ Stampa scheda</button>
  </div>
  </div>
</div>

<div id="printModalOverlay" onclick="if(event.target===this) closePrintModal()">
  <div class="print-modal" role="dialog" aria-labelledby="printTitle">
    <h3 id="printTitle">Quante pagine vuoi stampare?</h3>
    <div class="sub">6 esercizi per pagina · il PDF si scarica subito</div>
    <div class="pages-choice">
      <button type="button" onclick="makePdf(1)">1</button>
      <button type="button" onclick="makePdf(2)">2</button>
      <button type="button" onclick="makePdf(3)">3</button>
      <button type="button" onclick="makePdf(4)">4</button>
      <button type="button" onclick="makePdf(5)">5</button>
    </div>
    <div class="print-status" id="printStatus"></div>
    <button class="btn" onclick="closePrintModal()">Annulla</button>
  </div>
</div>

<script>
  var contaCurrent = 0;
  var trovaCurrent = 0;
  var indovinaCurrent = 0;
  var activeGame = null;
  var LOGO_URL = 'https://raw.githubusercontent.com/rdiianni-alt/archivio_privato/988498e303d047e2e04caa80073d184ee4d392c7/logo.png';

  function buildGrid(gridId, prefix) {
    var grid = document.getElementById(gridId);
    grid.innerHTML = '';
    for (var r = 0; r < 10; r++) {
      if (r === 5) {
        var rg = document.createElement('div');
        rg.className = 'row-gap';
        grid.appendChild(rg);
      }
      var row = document.createElement('div');
      row.className = 'row';
      for (var c = 0; c < 10; c++) {
        if (c === 5) {
          var cg = document.createElement('div');
          cg.className = 'col-gap';
          row.appendChild(cg);
        }
        var b = document.createElement('div');
        b.className = 'ball';
        b.id = prefix + (r * 10 + c);
        row.appendChild(b);
      }
      grid.appendChild(row);
    }
  }

  function goMenu() {
    document.getElementById('menuScreen').style.display = 'flex';
    document.getElementById('contaScreen').classList.remove('active');
    document.getElementById('trovaScreen').classList.remove('active');
    document.getElementById('indovinaScreen').classList.remove('active');
    document.getElementById('sempliceScreen').classList.remove('active');
  }

  function startGame(g) {
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('contaScreen').classList.remove('active');
    document.getElementById('trovaScreen').classList.remove('active');
    document.getElementById('indovinaScreen').classList.remove('active');
    document.getElementById('sempliceScreen').classList.remove('active');
    activeGame = g;
    if (g === 'conta') {
      document.getElementById('contaScreen').classList.add('active');
      buildGrid('contaGrid', 'c');
      newConta();
    } else if (g === 'trova') {
      document.getElementById('trovaScreen').classList.add('active');
      buildGrid('trovaGrid', 't');
      newTrova();
    } else if (g === 'indovina') {
      document.getElementById('indovinaScreen').classList.add('active');
      buildGrid('indovinaGrid', 'i');
      newIndovina();
    } else if (g === 'semplice') {
      document.getElementById('sempliceScreen').classList.add('active');
      buildGrid('sempliceGrid', 's');
      resetSemplice();
    }
  }

  function newConta() {
    contaCurrent = Math.floor(Math.random() * 100) + 1;
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('c' + i);
      if (b) { b.className = 'ball' + (i < contaCurrent ? ' on' : ''); b.textContent = ''; b.style.color = ''; }
    }
    document.getElementById('contaNum').textContent = '?';
    document.getElementById('contaHint').textContent = '';
    document.getElementById('contaInput').value = '';
    document.getElementById('contaFeedback').textContent = '';
    document.getElementById('contaFeedback').className = 'feedback';
    document.getElementById('contaRevBtn').style.display = 'inline-block';
  }

  function checkConta() {
    var val = parseInt(document.getElementById('contaInput').value, 10);
    var fb = document.getElementById('contaFeedback');
    if (val === contaCurrent) {
      fb.textContent = 'Giusto!';
      fb.className = 'feedback ok';
    } else {
      fb.textContent = 'Riprova!';
      fb.className = 'feedback no';
    }
  }

  function revealConta() {
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('c' + i);
      if (!b) continue;
      var isOn = i < contaCurrent;
      b.className = 'ball' + (isOn ? ' on' : '');
      b.textContent = i + 1;
      b.style.color = isOn ? '#fff' : '#bbb';
    }
    var dec = Math.floor(contaCurrent / 10);
    var uni = contaCurrent % 10;
    document.getElementById('contaNum').textContent = contaCurrent;
    var txt = '';
    if (contaCurrent === 100) txt = '10 decine = 100';
    else if (dec === 0) txt = uni + ' unità';
    else if (uni === 0) txt = dec + (dec === 1 ? ' decina' : ' decine');
    else txt = dec + (dec === 1 ? ' decina' : ' decine') + ' + ' + uni + ' unità';
    document.getElementById('contaHint').textContent = txt;
    document.getElementById('contaRevBtn').style.display = 'none';
  }

  function newTrova() {
    trovaCurrent = Math.floor(Math.random() * 100) + 1;
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('t' + i);
      if (b) {
        b.className = 'ball';
        b.textContent = '';
        b.style.color = '';
        b.onclick = (function(idx) {
          return function() { checkTrova(idx); };
        })(i);
      }
    }
    document.getElementById('trovaQuestion').textContent = 'Clicca sulla pallina numero ' + trovaCurrent;
    document.getElementById('trovaFeedback').textContent = '';
    document.getElementById('trovaFeedback').className = 'feedback';
  }

  function checkTrova(idx) {
    var fb = document.getElementById('trovaFeedback');
    if (idx === trovaCurrent - 1) {
      for (var i = 0; i < 100; i++) {
        var b = document.getElementById('t' + i);
        if (!b) continue;
        var isTarget = i === trovaCurrent - 1;
        b.className = 'ball' + (isTarget ? ' correct' : '');
        b.textContent = i + 1;
        b.style.color = isTarget ? '#fff' : '#bbb';
        b.onclick = null;
      }
      fb.textContent = 'Giusto!';
      fb.className = 'feedback ok';
    } else {
      fb.textContent = 'Riprova!';
      fb.className = 'feedback no';
    }
  }

  function newIndovina() {
    indovinaCurrent = Math.floor(Math.random() * 100) + 1;
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('i' + i);
      if (b) { b.className = 'ball' + (i === indovinaCurrent - 1 ? ' single' : ''); b.textContent = ''; b.style.color = ''; }
    }
    document.getElementById('indovinaNum').textContent = '';
    document.getElementById('indovinaHint').textContent = '';
    document.getElementById('indovinaInput').value = '';
    document.getElementById('indovinaFeedback').textContent = '';
    document.getElementById('indovinaFeedback').className = 'feedback';
    document.getElementById('indovinaRevBtn').style.display = 'inline-block';
  }

  function checkIndovina() {
    var val = parseInt(document.getElementById('indovinaInput').value, 10);
    var fb = document.getElementById('indovinaFeedback');
    if (val === indovinaCurrent) {
      fb.textContent = 'Giusto!';
      fb.className = 'feedback ok';
    } else {
      fb.textContent = 'Riprova!';
      fb.className = 'feedback no';
    }
  }

  function revealIndovina() {
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('i' + i);
      if (!b) continue;
      var isTarget = i === indovinaCurrent - 1;
      b.className = 'ball' + (isTarget ? ' on' : '');
      b.textContent = i + 1;
      b.style.color = isTarget ? '#fff' : '#bbb';
    }
    var dec = Math.floor(indovinaCurrent / 10);
    var uni = indovinaCurrent % 10;
    document.getElementById('indovinaNum').textContent = indovinaCurrent;
    var txt = '';
    if (indovinaCurrent === 100) txt = '10 decine = 100';
    else if (dec === 0) txt = uni + ' unità';
    else if (uni === 0) txt = dec + (dec === 1 ? ' decina' : ' decine');
    else txt = dec + (dec === 1 ? ' decina' : ' decine') + ' + ' + uni + ' unità';
    document.getElementById('indovinaHint').textContent = txt;
    document.getElementById('indovinaRevBtn').style.display = 'none';
  }

  var sempliceNumeriVisibili = false;

  function resetSemplice() {
    sempliceNumeriVisibili = false;
    document.getElementById('sempliceRevBtn').textContent = 'Mostra i numeri';
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('s' + i);
      if (b) {
        b.className = 'ball';
        b.textContent = '';
        b.style.color = '';
        b.onclick = (function (idx) {
          return function () { toggleSemplice(idx); };
        })(i);
      }
    }
  }

  function toggleSemplice(idx) {
    var b = document.getElementById('s' + idx);
    if (!b) return;
    b.classList.toggle('on');
  }

  function toggleNumeriSemplice() {
    sempliceNumeriVisibili = !sempliceNumeriVisibili;
    for (var i = 0; i < 100; i++) {
      var b = document.getElementById('s' + i);
      if (!b) continue;
      if (sempliceNumeriVisibili) {
        b.textContent = i + 1;
        b.style.color = '#000';
      } else {
        b.textContent = '';
        b.style.color = '';
      }
    }
    document.getElementById('sempliceRevBtn').textContent = sempliceNumeriVisibili ? 'Nascondi i numeri' : 'Mostra i numeri';
  }

  /* --- Disegnini del menu --- */
  (function drawMinis() {
    var liberi = [11, 12, 13, 23, 33, 34, 35, 45, 55, 56, 57, 67, 77]; // un percorso a scalini
    document.querySelectorAll('[data-mini]').forEach(function (svg) {
      var kind = svg.getAttribute('data-mini');
      var out = '';
      for (var i = 0; i < 100; i++) {
        var r = Math.floor(i / 10), c = i % 10;
        var x = 9 + c * 9.6 + (c >= 5 ? 3 : 0), y = 9 + r * 9.6 + (r >= 5 ? 3 : 0);
        var on = kind === 'conta' ? i < 37 : kind === 'indovina' ? i === 57 : kind === 'semplice' ? liberi.indexOf(i) >= 0 : false;
        out += '<circle cx="' + x + '" cy="' + y + '" r="3.7" fill="' + (on ? 'var(--c)' : '#fff') + '" stroke="' + (on ? 'rgba(0,0,0,.35)' : '#bbb') + '" stroke-width="0.8"/>';
        if (kind === 'trova' && i === 64) out += '<circle cx="' + x + '" cy="' + y + '" r="6.2" fill="none" stroke="var(--c)" stroke-width="2"/>';
      }
      svg.innerHTML = out;
    });
  })();

  /* --- Stampa scheda PDF --- */

  function openPrintModal() {
    document.getElementById('printStatus').textContent = '';
    document.getElementById('printModalOverlay').classList.add('active');
  }

  function closePrintModal() {
    document.getElementById('printModalOverlay').classList.remove('active');
  }

  function shuffledNumbers(max) {
    var arr = [];
    for (var i = 1; i <= max; i++) arr.push(i);
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Logo come immagine per il PDF (se non si carica, il PDF esce senza logo)
  var logoData = null;
  (function loadLogo() {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function () {
      try {
        var cv = document.createElement('canvas'); cv.width = cv.height = 160;
        var g = cv.getContext('2d');
        g.beginPath(); g.arc(80, 80, 80, 0, 7); g.clip(); g.fillStyle = '#fff'; g.fillRect(0, 0, 160, 160);
        var k = Math.min(160 / img.width, 160 / img.height);
        g.drawImage(img, 80 - img.width * k / 2, 80 - img.height * k / 2, img.width * k, img.height * k);
        logoData = cv.toDataURL('image/png');
      } catch (e) { logoData = null; }
    };
    img.src = LOGO_URL;
  })();

  var QUESTIONS = {
    conta: 'Quante palline sono colorate?',
    indovina: 'Che numero è la pallina colorata?',
    semplice: 'Che numeri sono i pallini colorati?'
  };
  var FILE_NAMES = { conta: 'quante-palline', trova: 'trova-la-pallina', indovina: 'che-numero-e', semplice: 'pallini-liberi' };

  // Un esercizio: riquadro con logo, domanda, griglia 10×10 e riga per la risposta.
  // Le palline sono cerchi vettoriali: rosso scuro pieno con bordo nero, ben visibili anche in bianco e nero.
  // Percorso casuale di `len` pallini vicini (in orizzontale o in verticale), senza ripassare
  function randomPath(len) {
    for (var tries = 0; tries < 200; tries++) {
      var cur = Math.floor(Math.random() * 100), path = [cur];
      while (path.length < len) {
        var r = Math.floor(cur / 10), c = cur % 10, next = [];
        if (c < 9) next.push(cur + 1);
        if (c > 0) next.push(cur - 1);
        if (r < 9) next.push(cur + 10);
        if (r > 0) next.push(cur - 10);
        next = next.filter(function (n) { return path.indexOf(n) < 0; });
        if (!next.length) break;
        cur = next[Math.floor(Math.random() * next.length)];
        path.push(cur);
      }
      if (path.length === len) return path;
    }
    return [0, 1, 2, 3, 4].slice(0, len);
  }

  function drawTile(doc, x, y, w, h, game, num) {
    doc.setDrawColor(190); doc.setLineWidth(0.25); doc.setLineDashPattern([1.5, 1.2], 0);
    doc.roundedRect(x, y, w, h, 2, 2, 'S'); doc.setLineDashPattern([], 0);
    var cx = x + w / 2;
    if (logoData) doc.addImage(logoData, 'PNG', x + 3, y + 3, 7, 7);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(120);
    doc.text('Matematiche non si nasce', x + 11.5, y + 6);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(226, 75, 74);
    doc.text('I pallini del 100', x + 11.5, y + 9.3);
    doc.setFontSize(11); doc.setTextColor(30);
    var q = game === 'trova' ? 'Colora la pallina numero ' + num : QUESTIONS[game];
    doc.text(q, cx, y + 17, { align: 'center' });
    var pitch = 6, d = 5.1, gap = 2.2;
    var gw = 10 * pitch + gap, gx = cx - gw / 2 + pitch / 2, gy = y + 22 + pitch / 2;
    var path = game === 'semplice' ? randomPath(5) : [];
    for (var i = 0; i < 100; i++) {
      var r = Math.floor(i / 10), c = i % 10;
      var bx = gx + c * pitch + (c >= 5 ? gap : 0), by = gy + r * pitch + (r >= 5 ? gap : 0);
      var on = (game === 'conta' && i < num) || (game === 'indovina' && i === num - 1) || path.indexOf(i) >= 0;
      if (on) { doc.setFillColor(179, 38, 30); doc.setDrawColor(0); doc.setLineWidth(0.5); doc.circle(bx, by, d / 2, 'FD'); }
      else { doc.setFillColor(255, 255, 255); doc.setDrawColor(130); doc.setLineWidth(0.25); doc.circle(bx, by, d / 2, 'FD'); }
    }
    var ly = gy + 10 * pitch + gap + 3;
    doc.setDrawColor(90); doc.setLineWidth(0.35);
    if (game === 'semplice') {
      // una riga per ogni pallino del percorso
      for (var k = 0; k < 5; k++) doc.line(cx - 32 + k * 13.2, ly, cx - 32 + k * 13.2 + 10, ly);
    } else if (game !== 'trova') {
      doc.line(cx - 18, ly, cx + 18, ly);
    }
  }

  function makePdf(pages) {
    var status = document.getElementById('printStatus');
    if (!window.jspdf || !activeGame) {
      status.textContent = 'Non riesco a creare il PDF: controlla la connessione a internet e ricarica la pagina.';
      return;
    }
    var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    var count = pages * 6, nums = [];
    while (nums.length < count) nums = nums.concat(shuffledNumbers(100));
    // Margini 10 mm, 3 colonne × 2 righe per pagina
    var M = 10, G = 5, tw = (297 - 2 * M - 2 * G) / 3, th = (210 - 2 * M - G) / 2;
    for (var p = 0; p < pages; p++) {
      if (p > 0) doc.addPage();
      for (var k = 0; k < 6; k++) {
        var col = k % 3, row = Math.floor(k / 3);
        drawTile(doc, M + col * (tw + G), M + row * (th + G), tw, th, activeGame, nums[p * 6 + k]);
      }
    }
    doc.save('i-pallini-del-100-' + FILE_NAMES[activeGame] + '.pdf');
    status.textContent = 'PDF pronto: ' + pages + (pages === 1 ? ' pagina' : ' pagine') + '. Se lo crei di nuovo, i numeri cambiano.';
  }
</script>
