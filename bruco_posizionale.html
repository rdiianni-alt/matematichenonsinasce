<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il bruco posizionale</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --c: 48px;               /* larghezza di una casella */
    --u: calc(var(--c) / 24); /* 1 "mm" del modello stampabile */
    --H: calc(var(--u) * 42);
    --band: calc(var(--u) * 6);
    --green: #9CCB5B; --green-d: #4F8A2B; --green-l: #C9E6A0;
    --gray: #D2D2D2; --gray-t: #5E5E5E; --ink: #1F2A44;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: 'Poppins', sans-serif; color: var(--ink); }
  body { display: flex; flex-direction: column; align-items: center; }
  .top { display: flex; flex-direction: column; align-items: center; padding-top: 10px; flex: none; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; }
  .logo img { width: 60px; height: 60px; object-fit: contain; border-radius: 50%; }
  .logo span { font-size: 14px; color: #5f5e5a; }
  h1 { font-size: clamp(18px, 3vw, 26px); margin: 6px 0 0; font-weight: 700; }

  #stage { position: relative; flex: 1; width: 100%; perspective: 1800px; perspective-origin: 50% 40%; overflow: hidden; }
  #wrap { position: absolute; left: 0; top: 50%; transition: transform 1.3s cubic-bezier(.6,0,.3,1); transform-style: preserve-3d; }
  #bruco { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }

  .head { position: absolute; left: 0; top: calc(var(--u) * -12); width: calc(var(--u) * 54); height: calc(var(--u) * 58); }

  .seg { position: absolute; top: 0; height: var(--H); transform-origin: 0 50%; transform-style: preserve-3d;
         transform: translateZ(0) rotateY(0deg); transition: transform 1.3s cubic-bezier(.6,0,.3,1); }
  .seg .seg { left: 100%; }
  #A { left: calc(var(--u) * 52); }

  .win { background: var(--green); }
  .win .bt, .win .bb { position: absolute; left: 0; right: 0; height: var(--band); }
  .win .bt { top: 0;
    background: radial-gradient(circle at 50% 50%, var(--green-l) 0 calc(var(--u) * 1.5), transparent calc(var(--u) * 1.6)) 0 0 / var(--c) 100% repeat-x; }
  .win .bb { bottom: 0;
    background:
      radial-gradient(ellipse calc(var(--u) * 2.3) calc(var(--u) * 1.65) at 34% 55%, var(--green-d) 98%, transparent 100%) 0 0 / var(--c) 100% repeat-x,
      radial-gradient(ellipse calc(var(--u) * 2.3) calc(var(--u) * 1.65) at 66% 55%, var(--green-d) 98%, transparent 100%) 0 0 / var(--c) 100% repeat-x; }
  .win .mid { position: absolute; left: 0; right: 0; top: var(--band); bottom: var(--band); background: #fff; }
  .card { position: absolute; top: calc(var(--band) + var(--u) * 0.5); left: calc(var(--u) * 0.5);
          height: calc(var(--u) * 29); background: #fff; border: 1px solid #9a9a9a; display: flex; cursor: pointer;
          user-select: none; -webkit-user-select: none; }
  .card span { width: var(--c); display: flex; align-items: center; justify-content: center;
               font-weight: 700; font-size: calc(var(--c) * 0.74); line-height: 1; color: #000; }
  .card span + span { border-left: 1px solid #ececec; }
  .card span:first-child { margin-left: calc(var(--u) * -0.5); }

  .gray { background: var(--gray); }
  .plus { position: absolute; top: 50%; width: var(--c); transform: translateY(-50%); text-align: center;
          font-weight: 700; font-size: calc(var(--c) * 0.9); line-height: 1; color: var(--gray-t); }

  .tail { position: absolute; left: calc(100% - var(--u) * 4); top: 0; width: calc(var(--u) * 60); height: var(--H); }

  /* piegato: zone grigie a valle, finestre a monte */
  .folded .gray { transform: translateZ(1px) rotateY(-180deg); }
  .folded .win.inner { transform: translateZ(-1px) rotateY(180deg); }

  /* frecce */
  #ctrl { position: absolute; left: 0; top: 0; transition: opacity .4s; }
  .notrans .seg, .notrans .arrow { transition: none !important; }
  .arrow { position: absolute; transform: translateX(-50%); width: calc(var(--c) * 0.95); height: calc(var(--c) * 0.62);
           border: 0; border-radius: 10px; background: #f1f1f1; color: var(--ink); cursor: pointer;
           display: flex; align-items: center; justify-content: center; padding: 0;
           transition: left 1.3s cubic-bezier(.6,0,.3,1); }
  .arrow:hover { background: #e4e4e4; }
  .arrow svg { width: 50%; height: 70%; }

  .hint { display: none; flex: none; font-size: 13px; color: #5f5e5a; margin: 0 0 4px; }
  @media (orientation: portrait) and (max-width: 700px) { .hint { display: block; } }
  .bar { flex: none; display: flex; gap: 12px; padding: 10px 12px 16px; flex-wrap: wrap; justify-content: center; }
  .bar button { font-family: inherit; font-size: clamp(15px, 2.2vw, 19px); font-weight: 600; border-radius: 999px;
                padding: 10px 26px; cursor: pointer; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  .bar button.main { background: var(--ink); color: #fff; min-width: 9em; }
  .seg-choice { display: flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .bar .seg-choice button { border: 0; border-radius: 0; padding: 10px 16px; min-width: 0; }
  .bar .seg-choice button + button { border-left: 2px solid var(--ink); }
  .bar .seg-choice button.on { background: var(--ink); color: #fff; }
  .bar button:disabled { opacity: .45; cursor: default; }
  .numform { display: flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .numform input { font-family: inherit; font-size: clamp(15px, 2.2vw, 19px); font-weight: 600; color: var(--ink); border: 0; outline: 0;
                   width: 6.5em; padding: 10px 6px 10px 18px; background: #fff; }
  .numform input::placeholder { color: #9a9a9a; font-weight: 400; }
  .bar .numform button { border: 0; border-left: 2px solid var(--ink); border-radius: 0; padding: 10px 18px; }
  .numform.err { animation: shake .3s; border-color: #b3261e; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
</style>
</head>
<body>
  <header class="top">
    <a class="logo" href="https://matematichenonsinasce.com/" target="_blank" rel="noopener">
      <img src="https://raw.githubusercontent.com/rdiianni-alt/matematichenonsinasce/main/logo.png" alt="Matematiche non si nasce">
      <span>Matematiche non si nasce</span>
    </a>
    <h1>Il bruco posizionale</h1>
  </header>

  <main id="stage">
    <div id="wrap">
      <div id="bruco"></div>
      <div id="ctrl"></div>
    </div>
  </main>

  <p class="hint">Ruota il telefono per vedere il bruco più grande.</p>
  <div class="bar">
    <button id="fold" class="main">Piega</button>
    <button id="rnd">Numero a caso</button>
    <form class="numform" id="numForm" autocomplete="off">
      <input id="numIn" inputmode="numeric" maxlength="4" placeholder="es. 8755" aria-label="Scrivi un numero da 2 a 4 cifre">
      <button type="submit">Componi</button>
    </form>
    <div class="seg-choice" id="nsel">
      <button data-n="2">2 cifre</button><button data-n="3">3 cifre</button><button data-n="4" class="on">4 cifre</button>
    </div>
  </div>

<script>
let N = 4;
let PLACES = [];
let digits = [8, 7, 2, 3];
let folded = false, busy = false;

const svgNS = "http://www.w3.org/2000/svg";
const bruco = document.getElementById("bruco");
const ctrl = document.getElementById("ctrl");
const wrap = document.getElementById("wrap");

function headSVG() {
  const cx = -27, cy = 21;
  const ant = [98, 132].map(a => {
    const r = a * Math.PI / 180;
    return { x1: cx + 20 * Math.cos(r), y1: cy - 20 * Math.sin(r), x2: cx + 29 * Math.cos(r), y2: cy - 29 * Math.sin(r) };
  });
  return `<svg class="head" viewBox="-52 -12 54 58" xmlns="${svgNS}">
    <rect x="-13" y="9" width="14" height="24" fill="#9CCB5B"/>
    ${ant.map(a => `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="#4F8A2B" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="${a.x2}" cy="${a.y2}" r="2.6" fill="#4F8A2B"/>`).join("")}
    <circle cx="${cx}" cy="${cy}" r="23" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="0.8"/>
    ${[-8, 6].map(dx => `<circle cx="${cx + dx}" cy="${cy - 5}" r="5" fill="#fff"/>
      <circle cx="${cx + dx + 1}" cy="${cy - 4.5}" r="2.8" fill="#1F2A44"/>
      <circle cx="${cx + dx + 2}" cy="${cy - 5.8}" r="0.9" fill="#fff"/>`).join("")}
    <ellipse cx="${cx - 12.5}" cy="${cy + 4}" rx="3.5" ry="2" fill="#F4A3A8"/>
    <ellipse cx="${cx + 12.5}" cy="${cy + 4}" rx="3.5" ry="2" fill="#F4A3A8"/>
    <path d="M ${cx - 6.6} ${cy + 8.4} Q ${cx} ${cy + 14} ${cx + 6.6} ${cy + 8.4}" fill="none" stroke="#1F2A44" stroke-width="1.4" stroke-linecap="round"/>
  </svg>`;
}

function tailSVG() {
  return `<svg class="tail" viewBox="-4 0 60 42" xmlns="${svgNS}">
    <circle cx="12" cy="21" r="15" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="0.6"/>
    <circle cx="12" cy="14" r="1.6" fill="#C9E6A0"/>
    <circle cx="30" cy="21" r="10" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="0.6"/>
    <circle cx="30" cy="16.5" r="1.3" fill="#C9E6A0"/>
    <circle cx="46" cy="21" r="7.6" fill="#9CCB5B" stroke="#4F8A2B" stroke-width="0.6"/>
    <circle cx="46" cy="17.5" r="1.1" fill="#C9E6A0"/>
  </svg>`;
}

function makeSeg(cls, cells) {
  const d = document.createElement("div");
  d.className = "seg " + cls;
  d.style.width = `calc(var(--c) * ${cells})`;
  return d;
}

function makeWin(p, inner) {
  const d = makeSeg("win" + (inner ? " inner" : ""), p.cells);
  d.id = p.id;
  d.innerHTML = `<div class="bt"></div><div class="mid"></div><div class="bb"></div>`;
  const card = document.createElement("div");
  card.className = "card";
  card.style.width = `calc(var(--c) * ${p.cells} - var(--u))`;
  card.addEventListener("click", () => { if (!busy) step(PLACES.indexOf(p), 1); });
  d.appendChild(card);
  p.card = card;
  return d;
}

function makeGray(cells, plusAt) {
  const d = makeSeg("gray", cells);
  const s = document.createElement("div");
  s.className = "plus";
  s.textContent = "+";
  s.style.left = `calc(var(--c) * ${plusAt})`;
  d.appendChild(s);
  return d;
}

function makePlaces(n) {
  // finestre di n, n-1, ..., 1 caselle; dopo ognuna (tranne l'ultima) una zona grigia di n-1, ..., 1 caselle
  const out = [];
  let start = 0;
  for (let k = n; k >= 1; k--) {
    out.push({ id: "W" + k, cells: k, start, zeros: k - 1, min: k === n ? 1 : 0 });
    start += k + (k - 1);
  }
  return out;
}

function build() {
  bruco.classList.add("notrans");
  ctrl.classList.add("notrans");
  bruco.innerHTML = "";
  ctrl.innerHTML = "";
  PLACES = makePlaces(N);
  bruco.insertAdjacentHTML("beforeend", headSVG());
  let first = null, last = null;
  PLACES.forEach((p, i) => {
    const w = makeWin(p, i > 0);
    if (i === 0) { w.id = "A"; first = w; }
    else {
      const g = makeGray(p.cells, Math.min(1, p.cells - 1));
      last.appendChild(g);
      g.appendChild(w);
    }
    last = w;
  });
  last.insertAdjacentHTML("beforeend", tailSVG());
  bruco.appendChild(first);

  PLACES.forEach((p, i) => {
    ["up", "down"].forEach(dir => {
      const b = document.createElement("button");
      b.className = "arrow";
      b.setAttribute("aria-label", dir === "up" ? "aumenta" : "diminuisci");
      b.innerHTML = dir === "up"
        ? `<svg viewBox="0 0 20 12"><path d="M2 10 L10 2 L18 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        : `<svg viewBox="0 0 20 12"><path d="M2 2 L10 10 L18 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      b.addEventListener("click", () => step(i, dir === "up" ? 1 : -1));
      p[dir] = b;
      ctrl.appendChild(b);
    });
  });
}

function step(i, delta) {
  if (busy) return;
  const p = PLACES[i];
  let v = digits[i] + delta;
  if (v > 9) v = p.min;
  if (v < p.min) v = 9;
  digits[i] = v;
  render();
}

function render() {
  PLACES.forEach((p, i) => {
    const txt = digits[i] === 0 ? "0".repeat(p.cells) : String(digits[i]) + "0".repeat(p.zeros);
    p.card.innerHTML = [...txt].map(ch => `<span>${ch}</span>`).join("");
  });
}

function layout() {
  const stage = document.getElementById("stage");
  const sw = stage.clientWidth, sh = stage.clientHeight;
  // larghezza aperta: testa 52u + 16 caselle + coda 56u  →  (52 + 384 + 56)/24 = 20.5 caselle
  const byW = (sw - 24) / 20.5;
  const byH = sh / 4.1;
  const c = Math.max(14, Math.min(byW, byH, 72));
  document.documentElement.style.setProperty("--c", c + "px");
  const u = c / 24;
  const H = 42 * u;
  wrap.dataset.c = c;
  position(false);
  bruco.offsetHeight;
  bruco.classList.remove("notrans");
  ctrl.classList.remove("notrans");
}

// frecce sopra e sotto ogni cartellino; a bruco chiuso stanno sopra e sotto la sua cifra
function placeArrows() {
  const c = parseFloat(wrap.dataset.c);
  const u = c / 24, H = 42 * u;
  PLACES.forEach((p, i) => {
    const x = 52 * u + (folded ? (i + 0.5) : (p.start + p.cells / 2)) * c;
    p.up.style.left = x + "px";
    p.up.style.top = (-0.8 * c) + "px";
    p.down.style.left = x + "px";
    p.down.style.top = (H + 0.18 * c) + "px";
  });
}

function position(animate) {
  const stage = document.getElementById("stage");
  const sw = stage.clientWidth;
  const c = parseFloat(wrap.dataset.c);
  const u = c / 24;
  const w = folded ? (52 * u + N * c + 56 * u) : (52 * u + N * N * c + 56 * u);
  const x = (sw - w) / 2;
  const y = -21 * u;
  placeArrows();
  if (!animate) wrap.style.transition = "none";
  wrap.style.transform = `translate(${x}px, ${y}px)`;
  if (!animate) { wrap.offsetHeight; wrap.style.transition = ""; }
}

const foldBtn = document.getElementById("fold");
const rndBtn = document.getElementById("rnd");

foldBtn.addEventListener("click", () => {
  if (busy) return;
  busy = true;
  folded = !folded;
  bruco.classList.toggle("folded", folded);
  document.body.classList.toggle("folded-ui", folded);
  position(true);
  foldBtn.textContent = folded ? "Apri" : "Piega";
  setTimeout(() => { busy = false; }, 1350);
});

rndBtn.addEventListener("click", () => {
  if (busy) return;
  digits = [1 + Math.floor(Math.random() * 9), ...Array.from({ length: N - 1 }, () => Math.floor(Math.random() * 10))];
  render();
});

const nsel = document.getElementById("nsel");
nsel.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || busy) return;
  const n = +b.dataset.n;
  if (n === N) return;
  // tiene le ultime cifre del numero attuale (la prima non può essere 0)
  let d = digits.slice(-n);
  while (d.length < n) d.unshift(0);
  if (d[0] === 0) d[0] = 1 + Math.floor(Math.random() * 9);
  N = n; digits = d;
  nsel.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n === N));
  build(); render(); layout();
});

// scrivo un numero: il bruco lo compone chiuso, poi si apre per vedere la scomposizione
const numForm = document.getElementById("numForm");
const numIn = document.getElementById("numIn");
numIn.addEventListener("input", () => { numIn.value = numIn.value.replace(/\D/g, "").slice(0, 4); });
numForm.addEventListener("submit", e => {
  e.preventDefault();
  if (busy) return;
  const v = numIn.value;
  if (!/^[1-9]\d{1,3}$/.test(v)) {
    numForm.classList.remove("err"); numForm.offsetWidth; numForm.classList.add("err");
    numIn.focus();
    return;
  }
  N = v.length;
  digits = [...v].map(Number);
  nsel.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.n === N));
  folded = true;
  bruco.classList.add("folded");
  document.body.classList.add("folded-ui");
  foldBtn.textContent = "Apri";
  build(); render(); layout();
  numIn.value = "";
  numIn.blur();
});

build();
render();
layout();
window.addEventListener("resize", layout);
</script>
</body>
</html>
